name: SQ4KOU WideBand UI fix x64 MSI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/wideband-ui-fix-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: windows-latest
    steps:
      - name: Checkout SQ4KOU synthesis branch
        uses: actions/checkout@v4
        with:
          ref: sq4kou
          fetch-depth: 1
          persist-credentials: true

      - name: Patch WideBand UI flow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Project Files/Source/Console/wbDisplay.cs'
          $bytes = [IO.File]::ReadAllBytes($path)
          $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
          $lines = [System.Collections.Generic.List[string]](Get-Content -LiteralPath $path)

          if (-not (($lines -join "`n").Contains('SQ4KOU_WB_UI_FLOW_V1'))) {
            $runIdx = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i].Trim() -eq 'RunDisplay(rx); // get pixels') { $runIdx = $i; break }
            }
            if ($runIdx -lt 0) { throw 'Active RunDisplay anchor not found' }

            $lines.Insert($runIdx + 1, '')
            $lines.Insert($runIdx + 2, '                    // SQ4KOU_WB_UI_FLOW_V1: render/present only a fresh WDSP frame.')
            $lines.Insert($runIdx + 3, '                    if (!this.DataReady) continue;')

            $usingIdx = -1
            for ($i = $runIdx + 4; $i -lt $lines.Count; $i++) {
              if ($lines[$i].Trim() -eq 'using (Graphics grSrc = Graphics.FromImage(wbDisplay_buffer))') { $usingIdx = $i; break }
            }
            if ($usingIdx -lt 0) { throw 'Active Graphics block not found' }

            $expected = @(
              'using (Graphics grSrc = Graphics.FromImage(wbDisplay_buffer))',
              '{',
              'grSrc.Clear(Color.Transparent);',
              'if (DrawWideBand(grSrc, rx))',
              '{',
              'this.Invoke(new Action(() =>',
              '{',
              'this.Image = wbDisplay_buffer;',
              'this.Refresh();',
              '}));',
              '}',
              '}'
            )
            for ($j = 0; $j -lt $expected.Count; $j++) {
              if (($usingIdx + $j) -ge $lines.Count -or $lines[$usingIdx + $j].Trim() -ne $expected[$j]) {
                throw "Graphics block mismatch at offset $j: '$($lines[$usingIdx + $j].Trim())'"
              }
            }

            $base = $lines[$usingIdx].Substring(0, $lines[$usingIdx].IndexOf('using'))
            $replacement = [string[]]@(
              ($base + 'bool frameDrawn;'),
              ($base + 'using (Graphics grSrc = Graphics.FromImage(wbDisplay_buffer))'),
              ($base + '{'),
              ($base + '    grSrc.Clear(Color.Transparent);'),
              ($base + '    frameDrawn = DrawWideBand(grSrc, rx);'),
              ($base + '}'),
              '',
              ($base + '// GDI+ drawing is fully closed before the bitmap is presented by WinForms.'),
              ($base + 'if (frameDrawn)'),
              ($base + '{'),
              ($base + '    this.Invoke(new Action(() =>'),
              ($base + '    {'),
              ($base + '        this.Image = wbDisplay_buffer;'),
              ($base + '        this.Refresh();'),
              ($base + '    }));'),
              ($base + '}')
            )
            $lines.RemoveRange($usingIdx, 12)
            $lines.InsertRange($usingIdx, $replacement)

            $getIdx = -1
            for ($i = $usingIdx + $replacement.Count; $i -lt $lines.Count; $i++) {
              if ($lines[$i].Trim() -eq 'SpecHPSDRDLL.GetPixels(rx, 0, ptr, ref flag);') { $getIdx = $i; break }
            }
            if ($getIdx -lt 0) { throw 'GetPixels anchor not found' }

            $readyIdx = -1
            for ($i = $getIdx + 1; $i -le [Math]::Min($getIdx + 8, $lines.Count - 1); $i++) {
              if ($lines[$i].Trim() -eq 'this.DataReady = true;') { $readyIdx = $i; break }
            }
            if ($readyIdx -lt 0) { throw 'DataReady assignment after GetPixels not found' }
            $readyBase = $lines[$readyIdx].Substring(0, $lines[$readyIdx].IndexOf('this.DataReady'))
            $lines.RemoveAt($readyIdx)
            $lines.Insert($readyIdx, $readyBase + '// WDSP flag==1 means a new pixel frame was actually returned.')
            $lines.Insert($readyIdx + 1, $readyBase + 'if (flag != 0)')
            $lines.Insert($readyIdx + 2, $readyBase + '    this.DataReady = true;')

            $enc = New-Object System.Text.UTF8Encoding($hasBom)
            [IO.File]::WriteAllLines($path, $lines, $enc)
          }

          $check = [IO.File]::ReadAllText($path)
          if (($check.Split('SQ4KOU_WB_UI_FLOW_V1').Count - 1) -ne 1) { throw 'Patch marker count is not 1' }
          if (($check.Split('if (flag != 0)').Count - 1) -ne 1) { throw 'GetPixels flag gate count is not 1' }
          if (($check.Split('frameDrawn = DrawWideBand(grSrc, rx);').Count - 1) -ne 1) { throw 'frameDrawn gate count is not 1' }
          $markerIndex = $check.IndexOf('SQ4KOU_WB_UI_FLOW_V1')
          $drawIndex = $check.IndexOf('frameDrawn = DrawWideBand(grSrc, rx);', $markerIndex)
          $invokeIndex = $check.IndexOf('this.Invoke(new Action(() =>', $markerIndex)
          if ($drawIndex -lt 0 -or $invokeIndex -lt 0 -or $drawIndex -gt $invokeIndex) { throw 'Invoke ordering check failed' }
          git diff --check
          git diff -- 'Project Files/Source/Console/wbDisplay.cs'

      - name: Commit patch to sq4kou
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git status --porcelain -- 'Project Files/Source/Console/wbDisplay.cs').Length -gt 0) {
            git config user.name 'SQ4KOU Build Bot'
            git config user.email 'actions@github.com'
            git add -- 'Project Files/Source/Console/wbDisplay.cs'
            git commit -m 'Fix WideBand UI frame gating and GDI presentation'
            git push origin HEAD:sq4kou
          }
          git rev-parse HEAD | Tee-Object -FilePath WB_UI_FIX_COMMIT.txt

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore 'Project Files/Source/Thetis_VS2026.sln' -NonInteractive

      - name: Build x64 Release and MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          msbuild 'Project Files/Source/Thetis_VS2026.sln' /m /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal /fl /flp:'logfile=build-logs/msbuild-x64-release.log;verbosity=normal' /bl:build-logs/msbuild-x64-release.binlog
          $msi = 'Project Files/bin/Installers/Thetis.msi'
          if (-not (Test-Path $msi)) { throw "MSI not found: $msi" }
          New-Item -ItemType Directory -Force -Path build-artifacts | Out-Null
          Copy-Item $msi 'build-artifacts/SQ4KOU_THETIS_WIDEBAND_UI_FIX_X64.msi' -Force
          (Get-FileHash 'build-artifacts/SQ4KOU_THETIS_WIDEBAND_UI_FIX_X64.msi' -Algorithm SHA256).Hash | Set-Content 'build-artifacts/SQ4KOU_THETIS_WIDEBAND_UI_FIX_X64.msi.sha256'
          Copy-Item WB_UI_FIX_COMMIT.txt build-artifacts/WB_UI_FIX_COMMIT.txt -Force

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sq4kou-wideband-ui-fix-build-logs
          path: build-logs/
          if-no-files-found: warn

      - name: Upload MSI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU_THETIS_WIDEBAND_UI_FIX_X64_MSI
          path: build-artifacts/
          if-no-files-found: error
