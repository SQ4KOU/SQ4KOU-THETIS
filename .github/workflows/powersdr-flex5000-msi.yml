name: PowerSDR FLEX-5000 DISPLAY MSI

on:
  push:
    branches: [powersdr-flex5000-display]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-powersdr-msi:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout display build harness
        uses: actions/checkout@v4
        with:
          ref: powersdr-flex5000-display
          fetch-depth: 1
          filter: blob:none

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure build tools
        shell: pwsh
        run: |
          $heat = Get-Command heat.exe -ErrorAction SilentlyContinue
          if (-not $heat) {
            choco install wixtoolset -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "WiX install failed rc=$LASTEXITCODE" }
            $heat = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3*\bin\heat.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $heat) { throw 'WiX heat.exe not found' }
          $wixDir = if ($heat.PSIsContainer) { $heat.FullName } elseif ($heat.Source) { Split-Path $heat.Source } else { $heat.Directory.FullName }
          "WIXBIN=$wixDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if (-not (Get-Command innoextract.exe -ErrorAction SilentlyContinue) -and -not (Get-Command innoextract -ErrorAction SilentlyContinue)) {
            choco install innoextract -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "innoextract install failed rc=$LASTEXITCODE" }
          }
          $inno = Get-Command innoextract.exe -ErrorAction SilentlyContinue
          if (-not $inno) { $inno = Get-Command innoextract -ErrorAction SilentlyContinue }
          if (-not $inno) { throw 'innoextract not found after installation' }
          Write-Host "WIXBIN=$wixDir"
          Write-Host "INNOEXTRACT=$($inno.Source)"

      - name: Build clean KE9NS 2.8.0.334 display MSI
        shell: pwsh
        run: |
          & .\tools\powersdr\Build-PowerSDR-MSI.ps1 -WixBin "$env:WIXBIN"

      - name: Verify PowerSDR and display isolation
        shell: pwsh
        run: |
          $manifest = Get-Content .\artifacts\powersdr\POWERSDR_BUILD_MANIFEST.txt -Raw
          if ($manifest -notmatch '(?m)^PRODUCT=PowerSDR\r?$') { throw 'Product identity is not PowerSDR' }
          if ($manifest -notmatch '(?m)^EXE=PowerSDR.exe\r?$') { throw 'Executable identity is not PowerSDR.exe' }
          if ($manifest -notmatch '(?m)^POWERSDR_FILE_VERSION=2\.8\.0\.334\r?$') { throw 'Executable is not KE9NS 2.8.0.334 base' }
          if ($manifest -notmatch '(?m)^CONSOLE_LAYOUT=KE9NS_NATIVE\r?$') { throw 'Console layout isolation gate failed' }
          if ($manifest -notmatch '(?m)^SKIN=KE9NS_NATIVE\r?$') { throw 'Skin isolation gate failed' }
          if ($manifest -notmatch '(?m)^DISPLAY_DATA_SOURCE=POWERSDR_DTTSP\r?$') { throw 'Display data source gate failed' }
          if ($manifest -match 'Thetis\.exe') { throw 'Thetis executable leaked into PowerSDR product' }
          $msi = Get-ChildItem .\artifacts\powersdr\PowerSDR*.msi | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $msi) { throw 'PowerSDR MSI missing' }
          if ($msi.Length -lt 1MB) { throw "MSI unexpectedly small: $($msi.Length)" }
          Write-Host "READY=$($msi.FullName)"

      - name: Upload PowerSDR display MSI
        uses: actions/upload-artifact@v4
        with:
          name: PowerSDR-FLEX5000-KE9NS334-DISPLAY-P01
          path: |
            artifacts/powersdr/*.msi
            artifacts/powersdr/*.sha256
            artifacts/powersdr/POWERSDR_BUILD_MANIFEST.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PowerSDR-FLEX5000-display-build-logs
          path: artifacts/powersdr/logs/**
          if-no-files-found: ignore
