name: Build ramdor DB minimal safe MSI

on:
  push:
    branches:
      - fix/db-ramdor-minimal-safe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msi:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Apply minimal DB safety
        shell: pwsh
        run: |
          python tools/apply_db_ramdor_minimal_safety.py
          git diff --check

      - name: Verify Occam DB contract
        shell: pwsh
        run: |
          $db = Get-Content "Project Files\Source\Console\database.cs" -Raw
          $dbman = Get-Content "Project Files\Source\Console\clsDBMan.cs" -Raw

          $required = @(
            'File.Replace(temp, fn, lastGood, true)',
            'fs.Flush(true)',
            'verify.ReadXml(temp)',
            '_loaded_from_lastgood'
          )
          foreach ($token in $required) {
            if (-not $db.Contains($token)) { throw "Missing minimal DB safety token: $token" }
          }

          $forbidden = @(
            'IsDatabaseCompatible',
            'CurrentDatabaseSchemaVersion',
            'LoadedDatabaseSchemaVersion',
            'schema_mismatch',
            'MIGRATE_',
            'CHECKPOINT_'
          )
          foreach ($token in $forbidden) {
            if ($db.Contains($token) -or $dbman.Contains($token)) { throw "Over-engineered DB token present: $token" }
          }

          if ($dbman.Contains('A new updated database will be created as a candidate')) {
            throw 'Candidate migration dialog is still present'
          }
          Write-Host 'PASS: original ramdor DB semantics + atomic write + last-good fallback only.'

      - name: Commit real source change
        shell: pwsh
        run: |
          git config user.name "SQ4KOU Build Bot"
          git config user.email "actions@github.com"
          git add "Project Files/Source/Console/database.cs"
          if (-not (git diff --cached --quiet)) {
            git commit -m "Add minimal atomic safety to ramdor database handling"
            git push origin HEAD:fix/db-ramdor-minimal-safe
          }

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) {
            choco install wixtoolset -y --no-progress
          }
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) {
            $targets = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\Wix.targets" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $targets) { throw "WiX 3.x Wix.targets not found" }
          "WIX_TARGETS=$($targets.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore "Project Files\Source\Thetis_VS2026.sln" -NonInteractive

      - name: Build Release x64 and MSI
        shell: pwsh
        run: |
          msbuild "Project Files\Source\Thetis_VS2026.sln" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal

      - name: Verify MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "Project Files\bin\Installers\*.msi" -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw "MSI was not produced" }
          if ($msi.Length -lt 1MB) { throw "MSI is unexpectedly small: $($msi.Length) bytes" }
          Write-Host "MSI: $($msi.FullName) ($([math]::Round($msi.Length/1MB,2)) MB)"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-DB-RAMDOR-MINIMAL-SAFE-MSI
          path: Project Files/bin/Installers/*.msi
          if-no-files-found: error
          compression-level: 0
