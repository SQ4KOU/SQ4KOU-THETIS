name: Diagnose Diversity Native Fallback R2

on:
  push:
    branches: [build/native-fallback-diag-r2-20260910]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e22a6d93330b77d2aa7b3a98ce995d6b28fc3989
          fetch-depth: 1
      - name: Locate every DiversityForm declaration
        shell: pwsh
        run: |
          Write-Host '=== DiversityForm declarations ==='
          Get-ChildItem . -Recurse -Filter *.cs | Select-String -Pattern '\b(class|partial\s+class)\s+DiversityForm\b' | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
          Write-Host '=== exact token references ==='
          Get-ChildItem . -Recurse -Filter *.cs | Select-String -SimpleMatch 'DiversityForm' | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
