name: Build SQ4KOU GPU Waterfall V2

on:
  push:
    branches: [feature/eu2av-gpu-waterfall-sq4kou]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout GPU feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/eu2av-gpu-waterfall-sq4kou
          fetch-depth: 1

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Apply SQ4KOU GPU V2 integration
        shell: pwsh
        run: .\.github\scripts\apply-gpu-waterfall-sq4kou.ps1

      - name: Commit deterministic integration patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Project Files/Source/ChannelMaster/cmaster.c" `
                     "Project Files/Source/ChannelMaster/ChannelMaster.vcxproj" `
                     "Project Files/Source/ChannelMaster/gpu_waterfall.cpp" `
                     "Project Files/Source/Console/Thetis.csproj" `
                     "Project Files/Source/Console/display.cs" `
                     "Project Files/Source/Console/Display.GPUWaterfall.cs"
          if (-not (git diff --cached --quiet)) {
            git commit -m "GPU waterfall V2: integrate resolve and calibration"
            git push origin HEAD:feature/eu2av-gpu-waterfall-sq4kou
          } else {
            Write-Host "V2 integration patch already committed."
          }

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) {
            choco install wixtoolset -y --no-progress
          }
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) {
            $targets = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\Wix.targets" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $targets) { throw "WiX 3.x Wix.targets not found" }
          "WIX_TARGETS=$($targets.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore "Project Files\Source\Thetis_VS2026.sln" -NonInteractive

      - name: Build Release x64 and MSI
        shell: pwsh
        run: msbuild "Project Files\Source\Thetis_VS2026.sln" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal

      - name: Verify MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "Project Files\bin\Installers\*.msi" -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw "MSI was not produced" }
          if ($msi.Length -lt 1MB) { throw "MSI is unexpectedly small: $($msi.Length) bytes" }
          Write-Host "MSI: $($msi.FullName) ($([math]::Round($msi.Length/1MB,2)) MB)"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-GPU-WATERFALL-V2-MSI
          path: Project Files/bin/Installers/*.msi
          if-no-files-found: error
          compression-level: 0
