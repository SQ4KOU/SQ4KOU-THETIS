name: Inspect waterfall UI

on:
  push:
    paths:
      - '.github/workflows/inspect-waterfall-ui.yml'

jobs:
  inspect:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sq4kou
      - name: Inspect setup sources
        shell: pwsh
        run: |
          $setup = 'Project Files/Source/Console/setup.cs'
          $lines = Get-Content $setup
          Write-Host '=== constructor setup 440-475 ==='
          for($i=439; $i -lt [Math]::Min(475,$lines.Count); $i++){ '{0}: {1}' -f ($i+1),$lines[$i] }
          Write-Host '=== waterfall UI creator 36080-36190 ==='
          for($i=36079; $i -lt [Math]::Min(36190,$lines.Count); $i++){ '{0}: {1}' -f ($i+1),$lines[$i] }
          Write-Host '=== creator names/calls ==='
          Select-String -Path $setup -Pattern 'Create.*Waterfall|Init.*Waterfall|Waterfall.*Controls|comboPaletteRes = new|chkWFDither = new|tbWFGamma = new' -Context 2,3 | ForEach-Object { $_.ToString() }
