name: Inspect waterfall UI

on:
  push:
    paths:
      - '.github/workflows/inspect-waterfall-ui.yml'

jobs:
  inspect:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sq4kou
      - name: Inspect Display General layout
        shell: pwsh
        run: |
          $setup = 'Project Files/Source/Console/setup.cs'
          $d = 'Project Files/Source/Console/setup.designer.cs'
          Write-Host '=== grpDisplayDriverEngine ==='
          Select-String -Path $d -Pattern 'grpDisplayDriverEngine\.(Location|Size|Text|Controls.Add)' -Context 0,0 | ForEach-Object { $_.Line }
          Write-Host '=== other Display General groups ==='
          Select-String -Path $d -Pattern '(grpDisplayRefreshRates|grpDisplayPhase|grpDisplayScopeMode|grpDisplayMultimeter|grpDisplay8000DLE|groupBoxTS11|groupBoxTS13|grpSpectralWarningLeds)\.(Location|Size|Text)' -Context 0,0 | ForEach-Object { $_.Line }
          Write-Host '=== DPI creator ==='
          Select-String -Path $setup -Pattern 'CreateDpiAwarenessCheckBox|chkDpiAwareness\.(Location|Size|Text)' -Context 0,10 | ForEach-Object { $_.ToString() }
