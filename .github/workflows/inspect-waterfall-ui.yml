name: Inspect waterfall UI

on:
  push:
    paths:
      - '.github/workflows/inspect-waterfall-ui.yml'

jobs:
  inspect:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sq4kou
      - name: Inspect palette controls
        shell: pwsh
        run: |
          $d = 'Project Files/Source/Console/setup.designer.cs'
          Select-String -Path $d -Pattern 'DeepBlue 256' -Context 20,10 | ForEach-Object { $_.ToString() }
