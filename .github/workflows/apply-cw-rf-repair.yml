name: Apply P1 CW RF Repair

on:
  push:
    branches: [sq4kou]
    paths:
      - '.github/workflows/apply-cw-rf-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sq4kou with history
        uses: actions/checkout@v4
        with:
          ref: sq4kou
          fetch-depth: 0

      - name: Restore CW RF path and remove N1MM CW-shift delta
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          # 1) Restore the native Ramdor/EU2AV PTTMode.CW exception.
          p = Path('Project Files/Source/Console/console.cs')
          s = p.read_text(encoding='utf-8-sig')
          old = '''                     _current_ptt_mode != PTTMode.SPACE &&\n                    _current_ptt_mode != PTTMode.CAT)'''
          new = '''                     _current_ptt_mode != PTTMode.SPACE &&\n                    _current_ptt_mode != PTTMode.CAT &&\n                    _current_ptt_mode != PTTMode.CW)'''
          if s.count(old) != 1:
              raise SystemExit(f'console.cs: expected one CW PTT condition, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8-sig')

          # 2) Remove only the added N1MM CW-shift Setup UI/handler.
          p = Path('Project Files/Source/Console/setup.cs')
          s = p.read_text(encoding='utf-8-sig')
          call = '            InitN1mmCWShiftOption(); // Ramdor N1MM CW spectrum shift option\n'
          if s.count(call) != 1:
              raise SystemExit(f'setup.cs: expected one N1MM init call, found {s.count(call)}')
          s = s.replace(call, '')
          start = '        private CheckBoxTS chkN1mm_include_cw_shift;\n\n        private void InitN1mmCWShiftOption()\n        {\n'
          i = s.find(start)
          end_marker = '        private void chkWaterfall_smear_CheckedChanged(object sender, EventArgs e)\n'
          j = s.find(end_marker, i if i >= 0 else 0)
          if i < 0 or j < 0:
              raise SystemExit('setup.cs: N1MM CW-shift block not found')
          s = s[:i] + s[j:]
          p.write_text(s, encoding='utf-8-sig')

          # 3) Remove the temporary provenance note for the discarded N1MM delta.
          p = Path('.sq4kou/SYNTHESIS_BASE.md')
          s = p.read_text(encoding='utf-8')
          marker = '\n\nIntegrated Ramdor delta:\n'
          if marker in s:
              s = s.split(marker, 1)[0].rstrip() + '\n'
          p.write_text(s, encoding='utf-8')
          PY

          # Restore N1MM.cs exactly to the clean-synthesis pre-delta version.
          git show e89dce877580e4c2a65629f373135032e4d06b7c:'Project Files/Source/Console/N1MM.cs' > 'Project Files/Source/Console/N1MM.cs'

          # Remove one-shot diagnostic workflows/markers; keep the permanent MSI builder.
          git rm -f --ignore-unmatch \
            '.github/workflows/export-cw-audit-source.yml' \
            '.github/workflows/cw-upstream-audit.yml' \
            '.github/workflows/sq4kou-cw-p1-runfix.yml' \
            '.github/workflows/apply-cw-rf-repair.yml' \
            'BUILD_CW_P1_RUNFIX.txt'

          # Hard checks: intended condition restored; N1MM CW-shift extension gone.
          grep -n -A7 -B2 '_current_ptt_mode != PTTMode.SPACE' 'Project Files/Source/Console/console.cs'
          if grep -RniE 'CWShiftEnable|InitN1mmCWShiftOption|chkN1mm_include_cw_shift|Include CW shift' \
               'Project Files/Source/Console/N1MM.cs' 'Project Files/Source/Console/setup.cs'; then
            echo 'Unexpected N1MM CW-shift extension remains' >&2
            exit 1
          fi

          git diff --check
          git diff --stat

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SQ4KOU Build Bot'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Restore P1 CW RF path and remove N1MM CW shift'
          git push origin HEAD:sq4kou
          git rev-parse HEAD
