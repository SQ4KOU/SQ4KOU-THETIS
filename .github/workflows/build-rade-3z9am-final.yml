name: Build 3Z9AM RADE Final Test MSI

on:
  push:
    branches: [feature/rade-3z9am-v1v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout exact 3Z9AM branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Base and proven RADE tooling
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config --global core.longpaths true
          $base='ab0071751b0fbe006ddad243361a37cfd59bed46'
          git cat-file -e "$base^{commit}"
          git fetch origin feature/rade-redpitaya-v1v2 --no-tags
          git checkout origin/feature/rade-redpitaya-v1v2 -- tools/rade-redpitaya
          git checkout origin/feature/rade-redpitaya-v1v2 -- 'Project Files/Source/Console/RadeNative.cs' 'Project Files/Source/Console/RadeIntegration.cs'
          $ri='Project Files\Source\Console\RadeIntegration.cs'
          $s=Get-Content $ri -Raw
          $s=$s.Replace('Thetis-RedPitaya - FreeDV RADE V1/V2','Thetis-3Z9AM - FreeDV RADE V1/V2')
          Set-Content $ri $s -Encoding UTF8
          Write-Host 'THETIS_3Z9AM_BASE_AND_RADE_TOOLING=PASS'

      - name: Pinned SV1EIA RADE vendor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pin='408f2b5232ff0a2aec9b538a40d4cb1b02627b17'
          $vendor='Project Files\lib\Thetis-RADE-vendor'
          if(Test-Path $vendor){Remove-Item $vendor -Recurse -Force}
          git clone --recursive https://github.com/sv1eia/Thetis-RADE.git $vendor
          git -C $vendor checkout $pin
          git -C $vendor submodule update --init --recursive
          if((git -C $vendor rev-parse HEAD).Trim() -ne $pin){throw 'Wrong RADE vendor pin'}
          Write-Host 'RADE_VENDOR_PIN=PASS'

      - name: RADE core integration
        shell: pwsh
        run: |
          python tools/rade-redpitaya/integrate.py
          if($LASTEXITCODE -ne 0){throw 'RADE core integration failed'}

      - name: SV1EIA Setup DSP RADE surface
        shell: pwsh
        run: |
          python tools/rade-redpitaya/integrate-ui.py
          if($LASTEXITCODE -ne 0){throw 'RADE UI integration failed'}

      - name: UI dependency closure
        shell: pwsh
        run: |
          python tools/rade-redpitaya/fix-ui-deps.py
          if($LASTEXITCODE -ne 0){throw 'RADE UI dependency closure failed'}

      - name: Prune foreign 3Z9AM General Log children
        shell: pwsh
        run: |
          python tools/rade-3z9am/prune-general-log-orphans.py
          if($LASTEXITCODE -ne 0){throw '3Z9AM General Log prune failed'}

      - name: Final SV1EIA UI closure
        shell: pwsh
        run: |
          python tools/rade-redpitaya/fix-ui-deps-final.py
          if($LASTEXITCODE -ne 0){throw 'RADE final UI closure failed'}

      - name: RADE dependency closure
        shell: pwsh
        run: |
          python tools/rade-redpitaya/integrate-deps.py
          if($LASTEXITCODE -ne 0){throw 'RADE dependency closure failed'}

      - name: Restore native 3Z9AM project references
        shell: pwsh
        run: |
          python tools/rade-3z9am/restore-projectrefs.py
          if($LASTEXITCODE -ne 0){throw '3Z9AM ProjectReference restore failed'}

      - name: Setup startup NRE gate
        shell: pwsh
        run: |
          python tools/rade-3z9am/gate-setup-runtime.py
          if($LASTEXITCODE -ne 0){throw '3Z9AM Setup construction-order NRE gate failed'}

      - name: Protect 3Z9AM GPU and gate PTT EOO
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='ab0071751b0fbe006ddad243361a37cfd59bed46'
          foreach($p in @(
            'Project Files/Source/Console/Display.GPUWaterfall.cs',
            'Project Files/Source/Console/display.cs',
            'Project Files/Source/Console/NetworkIO.cs',
            'Project Files/Source/Console/PSForm.cs'
          )){
            if(Test-Path $p){
              git diff --exit-code $base -- $p
              if($LASTEXITCODE -ne 0){throw "Protected 3Z9AM file changed: $p"}
            }
          }
          $c=Get-Content 'Project Files\Source\Console\console.cs' -Raw
          foreach($t in @('RadeInterceptMoxChange(chkMOX.Checked)','RadeAfterMoxChanged(tx)','RadePttStateMachine(); // SQ4KOU RADE EOO-safe arbiter')){
            if(-not $c.Contains($t)){throw "Missing EOO hook: $t"}
          }
          $r=Get-Content 'Project Files\Source\Console\RadeIntegration.cs' -Raw
          foreach($t in @('SetRadaeTxSilenceHold(1)','RadaeNotifyEndOfOver()','GetRadaeEooFlushed()','RadeEooMarginMs = 300','RadeEooTimeoutMs = 3000')){
            if(-not $r.Contains($t)){throw "Missing EOO arbiter element: $t"}
          }
          Write-Host 'THETIS_3Z9AM_GPU_PTT_EOO_GATE=PASS'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build native RADE dependencies
        shell: pwsh
        run: tools/rade-redpitaya/build-rade-deps.ps1 -Configuration Release

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $targets){choco install wixtoolset -y --no-progress}
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $targets){$targets=Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\Wix.targets' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1}
          if(-not $targets){throw 'WiX 3.x Wix.targets not found'}
          "WIX_TARGETS=$($targets.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Thetis packages
        shell: pwsh
        run: nuget restore 'Project Files\Source\Thetis_VS2026.sln' -NonInteractive

      - name: Build Thetis-3Z9AM RADE Release x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $log=Join-Path $env:RUNNER_TEMP 'thetis-3z9am-rade-final-build.log'
          "BUILD_LOG=$log" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & msbuild 'Project Files\Source\Thetis_VS2026.sln' /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal 2>&1 | Tee-Object -FilePath $log
          $code=$LASTEXITCODE
          $errs=Select-String -Path $log -Pattern ': error |error CS|error C[0-9]{4}|fatal error|MSB[0-9]{4}:' -ErrorAction SilentlyContinue
          if($errs){
            $e=Join-Path $env:RUNNER_TEMP '3z9am-rade-final-errors.txt'
            $errs | ForEach-Object {$_.Line} | Set-Content $e -Encoding UTF8
            "ERROR_LOG=$e" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if($code -ne 0 -or $errs){throw 'MSBuild failed'}
          Write-Host 'THETIS_3Z9AM_RADE_BUILD=PASS'

      - name: Validate ChannelMaster RADE exports
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll=Get-ChildItem 'Project Files\bin' -Recurse -Filter ChannelMaster.dll | Where-Object {$_.FullName -match '\\x64\\Release\\'} | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $dll){throw 'ChannelMaster.dll x64 Release not found'}
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vspath=& $vswhere -latest -products * -property installationPath
          $dump=Get-ChildItem (Join-Path $vspath 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe | Where-Object {$_.FullName -match '\\Hostx64\\x64\\'} | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $dump){throw 'dumpbin.exe not found'}
          $x=& $dump.FullName /exports $dll.FullName | Out-String
          foreach($n in @('SetRadaeRxEnabled','SetRadaeProtocolV2','SetRadaeTxRx','GetRadaeSync','SetRadaeMoxState','RadaeNotifyBeginOver','RadaeNotifyEndOfOver','GetRadaeEooFlushed','SetRadaeTxSilenceHold')){
            if($x -notmatch [regex]::Escape($n)){throw "Missing RADE export: $n"}
          }
          Write-Host 'THETIS_3Z9AM_RADE_EXPORTS=PASS'

      - name: Locate verified 3Z9AM RADE MSI
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $msi=Get-ChildItem 'Project Files\bin\Installers\*.msi' -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $msi -or $msi.Length -lt 1MB){throw 'Valid MSI was not produced'}
          $final=Join-Path $env:RUNNER_TEMP 'SQ4KOU-THETIS-3Z9AM-RADE-SV1EIA-1TO1-NREFIX-TEST-x64.msi'
          Copy-Item $msi.FullName $final -Force
          "FINAL_MSI=$final" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MSI_BYTES=$($msi.Length)"
          Write-Host "MSI_SHA256=$((Get-FileHash $final -Algorithm SHA256).Hash)"

      - name: Upload verified 3Z9AM RADE MSI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-3Z9AM-RADE-SV1EIA-1TO1-NREFIX-TEST-x64
          path: ${{ env.FINAL_MSI }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload errors
        if: ${{ always() && env.ERROR_LOG != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-3Z9AM-RADE-FINAL-ERRORS
          path: ${{ env.ERROR_LOG }}
          if-no-files-found: error

      - name: Upload build log
        if: ${{ always() && env.BUILD_LOG != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-3Z9AM-RADE-FINAL-BUILD-LOG
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: error
