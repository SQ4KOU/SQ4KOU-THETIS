name: Build TX-RX GPU switch MSI final

on:
  push:
    branches: [test/tx-rx-switch-from-pass-20260911]
    paths:
      - .github/workflows/build-tx-rx-switch-msi-final.yml
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout exact test state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Verify frozen PASS ancestry and isolated source delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='47221621b2f59564bb7ca6721ba5f2efe5ca3532'
          git merge-base --is-ancestor $base HEAD
          if($LASTEXITCODE -ne 0){throw 'Not descended from frozen PASS'}
          $sourceChanged=@(git diff --name-only $base HEAD -- 'Project Files/Source')
          $expected=@(
            'Project Files/Source/ChannelMaster/cmaster.c',
            'Project Files/Source/Console/Display.GPUWaterfall.cs',
            'Project Files/Source/Console/display.cs'
          )
          if($sourceChanged.Count -ne 3){throw ('Unexpected source delta count: '+$sourceChanged.Count)}
          foreach($p in $expected){if($p -notin $sourceChanged){throw "Missing expected source delta: $p"}}
          foreach($p in $sourceChanged){if($p -notin $expected){throw "Unexpected source delta: $p"}}
          $sha=(git rev-parse HEAD).Trim()
          "SOURCE_SHA=$sha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PASS_BASE=$base"
          Write-Host "SOURCE_SHA=$sha"
          Write-Host ('SOURCE_DELTA=' + ($sourceChanged -join ';'))

      - name: Verify TX-RX GPU switch and frozen palettes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $gpu=Get-Content 'Project Files\Source\Console\Display.GPUWaterfall.cs' -Raw
          $display=Get-Content 'Project Files\Source\Console\display.cs' -Raw
          $setup=Get-Content 'Project Files\Source\Console\setup.cs' -Raw
          $cm=Get-Content 'Project Files\Source\ChannelMaster\cmaster.c' -Raw
          foreach($t in @(
            @($cm,'CM_WaterfallIQ_Push\(2, pcm->xmtr\[tx\]\.ch_outsize','isolated TX IQ ring'),
            @($gpu,'bool gpuTxSource = localMox\(rx\) && !DisplayDuplex;','TX source selector'),
            @($gpu,'_gpuLastIQSource\[num2\] != gpuSourceStream','RX-TX transition flush'),
            @($gpu,'int stream = gpuSourceStream;','active IQ source consumer'),
            @($display,'if \(ManagedGPUFFTRequested\)','GPU rendering during MOX'),
            @($gpu,'ColorScheme\.Enhanced256','Enhanced256'),
            @($gpu,'ColorScheme\.Grayscale256','Grayscale256'),
            @($gpu,'B8G8R8A8_UNorm','8-bit path'),
            @($gpu,'R16G16B16A16_Float','16-bit path'),
            @($setup,'comboColorPalette\.Text == "Enhanced 256"','RX1 Enhanced256 mapping')
          )){if($t[0] -notmatch $t[1]){throw "Missing: $($t[2])"}}
          if($display -match 'ManagedGPUFFTRequested && !local_mox'){throw 'Old MOX GPU block still present'}
          Write-Host 'TX_RX_GPU_SWITCH_STATIC_AUDIT=PASS'

      - name: Exact recovered Final palette parity
        shell: pwsh
        run: .github/scripts/test-final-palettes.ps1

      - name: Diversity lifecycle regression guard
        shell: powershell
        run: .github/scripts/test-diversity-visibility.ps1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $targets){choco install wixtoolset -y --no-progress}
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $targets){$targets=Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\Wix.targets' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1}
          if(-not $targets){throw 'WiX 3.x Wix.targets not found'}
          "WIX_TARGETS=$($targets.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore packages
        shell: pwsh
        run: nuget restore 'Project Files\Source\Thetis_VS2026.sln' -NonInteractive

      - name: Build Release x64 and MSI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'SQ4KOU-THETIS-TX-RX-GPU-SWITCH-BUILD.log'
          & msbuild 'Project Files\Source\Thetis_VS2026.sln' /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal 2>&1 | Tee-Object -FilePath $log
          if($LASTEXITCODE -ne 0){throw "MSBuild failed: $LASTEXITCODE"}
          $errors=Select-String -Path $log -Pattern ': error ' -ErrorAction SilentlyContinue
          if($errors){throw 'Build log contains errors'}
          "BUILD_LOG=$log" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate built and MSI-extracted GPU shaders
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $expected=@('Thetis.waterfall_postproc.bin','Thetis.waterfall_row_cs.bin','Thetis.waterfall_fft_bitreverse_cs.bin','Thetis.waterfall_fft_stage_ab_cs.bin','Thetis.waterfall_fft_stage_ba_cs.bin','Thetis.waterfall_fft_magnitude_cs.bin','Thetis.waterfall_resolve_cs.bin')
          function Test-Shaders($exePath) {
            $asm=[System.Reflection.Assembly]::ReflectionOnlyLoadFrom($exePath)
            $resources=@($asm.GetManifestResourceNames())
            $missing=@($expected | Where-Object {$_ -notin $resources})
            if($missing.Count){throw ('Missing GPU shaders: '+($missing -join ', '))}
            if(($expected | Where-Object {$_ -in $resources}).Count -ne 7){throw 'GPU shader count is not 7'}
          }
          $built=Get-ChildItem 'Project Files\bin' -Recurse -Filter Thetis.exe | Where-Object {$_.FullName -match '\\x64\\Release\\'} | Sort-Object Length -Descending | Select-Object -First 1
          if(-not $built){throw 'Built x64 Release Thetis.exe not found'}
          Test-Shaders $built.FullName
          $msi=Get-ChildItem 'Project Files\bin\Installers\*.msi' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $msi -or $msi.Length -lt 1MB){throw 'Valid MSI not produced'}
          $extract=Join-Path $env:RUNNER_TEMP 'sq4kou-msi-extract-final'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $p=Start-Process msiexec.exe -ArgumentList @('/a',"`"$($msi.FullName)`"",'/qn',"TARGETDIR=`"$extract`"") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "MSI extraction failed: $($p.ExitCode)"}
          $installed=Get-ChildItem $extract -Recurse -Filter Thetis.exe | Sort-Object Length -Descending | Select-Object -First 1
          if(-not $installed){throw 'Thetis.exe not found in MSI'}
          Test-Shaders $installed.FullName
          $final=Join-Path $env:RUNNER_TEMP 'SQ4KOU-THETIS-TX-RX-GPU-SWITCH-TEST-x64.msi'
          Copy-Item $msi.FullName $final -Force
          $hash=(Get-FileHash $final -Algorithm SHA256).Hash
          "FINAL_MSI_PATH=$final" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MSI_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'BUILT_EXE_7_SHADERS=PASS'
          Write-Host 'MSI_EXTRACTED_EXE_7_SHADERS=PASS'
          Write-Host "MSI_SHA256=$hash"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-TX-RX-GPU-SWITCH-TEST-x64
          path: ${{ env.FINAL_MSI_PATH }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-TX-RX-GPU-SWITCH-BUILD-LOG
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: error
          compression-level: 6
