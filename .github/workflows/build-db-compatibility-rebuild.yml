name: Build DB compatibility rebuild MSI

on:
  push:
    branches:
      - fix/db-compatibility-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-msi:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout clean compatibility branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Apply DB compatibility rebuild
        shell: pwsh
        run: |
          python tools/apply_db_compatibility_rebuild.py
          git diff --check
          git diff --stat
          git diff -- "Project Files/Source/Console/database.cs" "Project Files/Source/Console/clsDBMan.cs"

      - name: Static compatibility gates
        shell: pwsh
        run: |
          $db = Get-Content "Project Files\Source\Console\database.cs" -Raw
          $man = Get-Content "Project Files\Source\Console\clsDBMan.cs" -Raw
          $required = @(
            "SQ4KOU_DB_COMPAT_REBUILD",
            "BuildCurrentSchemaTemplate",
            "NormalizeDataSetForCurrentBuild",
            "ValidateLegacyDataPreserved",
            "ValidateDatabasePreservesSource",
            "Imported legacy-authoritative table <TXProfile>",
            "Preserved legacy-only key"
          )
          foreach ($token in $required) {
            if (-not $db.Contains($token)) { throw "Missing compatibility token: $token" }
          }
          if (-not $man.Contains("MIGRATE_PRESERVE")) { throw "Persisted candidate preservation gate missing" }
          if ($db.Contains('expandedTable.ImportRow(newRow)')) { throw "Detached-row ImportRow bug remains" }
          Write-Host "Static DB compatibility gates: PASS"

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) { choco install wixtoolset -y --no-progress }
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) {
            $targets = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\Wix.targets" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $targets) { throw "WiX 3.x Wix.targets not found" }
          "WIX_TARGETS=$($targets.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore "Project Files\Source\Thetis_VS2026.sln" -NonInteractive

      - name: Build Release x64 and MSI
        shell: pwsh
        run: |
          msbuild "Project Files\Source\Thetis_VS2026.sln" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal

      - name: Locate Thetis executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem "Project Files\bin" -Recurse -Filter Thetis.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Release' -or $_.FullName -match 'x64' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem "Project Files\bin" -Recurse -Filter Thetis.exe -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if (-not $exe) { throw "Thetis.exe not found" }
          "THETIS_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Thetis.exe: $($exe.FullName)"

      - name: Execute production DB backward-compatibility self-test
        shell: powershell
        run: |
          & "tools\test_db_compatibility_rebuild.ps1" -ThetisExe "$env:THETIS_EXE" -WorkDir "$env:RUNNER_TEMP\db-compat-selftest"

      - name: Verify MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "Project Files\bin\Installers\*.msi" -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw "MSI was not produced" }
          if ($msi.Length -lt 1MB) { throw "MSI is unexpectedly small: $($msi.Length) bytes" }
          Write-Host "MSI: $($msi.FullName) ($([math]::Round($msi.Length/1MB,2)) MB)"

      - name: Upload MSI and compatibility test output
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-DB-COMPATIBILITY-REBUILD-MSI
          path: |
            Project Files/bin/Installers/*.msi
            ${{ runner.temp }}/db-compat-selftest/*.xml
          if-no-files-found: error
          compression-level: 0
