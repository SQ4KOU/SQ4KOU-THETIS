name: Build 3Z9AM RADE V1-V2 Test MSI

on:
  push:
    branches: [feature/rade-3z9am-v1v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rade-3z9am:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout exact 3Z9AM test branch state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Verify immutable 3Z9AM base
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='ab0071751b0fbe006ddad243361a37cfd59bed46'
          git cat-file -e "$base^{commit}"
          Write-Host "THETIS_3Z9AM_BASE=$base"

      - name: Import proven RADE integration tooling and glue
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin feature/rade-redpitaya-v1v2 --no-tags
          git checkout origin/feature/rade-redpitaya-v1v2 -- tools/rade-redpitaya
          git checkout origin/feature/rade-redpitaya-v1v2 -- 'Project Files/Source/Console/RadeNative.cs' 'Project Files/Source/Console/RadeIntegration.cs'
          $ri='Project Files\Source\Console\RadeIntegration.cs'
          $txt=Get-Content $ri -Raw
          $txt=$txt.Replace('Thetis-RedPitaya - FreeDV RADE V1/V2','Thetis-3Z9AM - FreeDV RADE V1/V2')
          Set-Content $ri $txt -Encoding UTF8
          Write-Host 'RADE_TOOLING_IMPORT=PASS'

      - name: Checkout pinned SV1EIA RADE vendor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pin='408f2b5232ff0a2aec9b538a40d4cb1b02627b17'
          $vendor='Project Files\lib\Thetis-RADE-vendor'
          if(Test-Path $vendor){Remove-Item $vendor -Recurse -Force}
          git clone --recursive https://github.com/sv1eia/Thetis-RADE.git $vendor
          git -C $vendor checkout $pin
          git -C $vendor submodule update --init --recursive
          $vsha=(git -C $vendor rev-parse HEAD).Trim()
          if($vsha -ne $pin){throw "Wrong RADE vendor: $vsha"}
          Write-Host "RADE_VENDOR=$vsha"

      - name: Preflight 3Z9AM MOX PTT compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $console=Get-Content 'Project Files\Source\Console\console.cs' -Raw
          foreach($t in @(
            'bool bOldMox = _mox; //MW0LGE_21b used for state change delgates at end of fn',
            'if (bOldMox != tx) MoxChangeHandlers?.Invoke(rx2_enabled && VFOBTX ? 2 : 1, bOldMox, tx); // MW0LGE_21a',
            'private async void PollPTT()',
            'int dotdashptt = NetworkIO.nativeGetDotDashPTT();'
          )){
            if($console -notmatch [regex]::Escape($t)){throw "3Z9AM source-family mismatch; missing anchor: $t"}
          }
          Write-Host 'THETIS_3Z9AM_MOX_PTT_PREFLIGHT=PASS'

      - name: Integrate SV1EIA RADE into 3Z9AM
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tools/rade-redpitaya/integrate.py
          if($LASTEXITCODE -ne 0){throw 'RADE core integration failed'}
          python tools/rade-redpitaya/integrate-ui.py
          if($LASTEXITCODE -ne 0){throw 'SV1EIA RADE UI integration failed'}
          python tools/rade-redpitaya/fix-setup-nre.py
          if($LASTEXITCODE -ne 0){throw 'Setup InitializeComponent NRE gate failed'}
          python tools/rade-redpitaya/integrate-deps.py
          if($LASTEXITCODE -ne 0){throw 'RADE dependency closure failed'}
          python tools/rade-3z9am/restore-projectrefs.py
          if($LASTEXITCODE -ne 0){throw '3Z9AM ProjectReference restore failed'}
          Write-Host 'THETIS_3Z9AM_RADE_INTEGRATION=PASS'

      - name: Gate protected 3Z9AM paths and EOO arbiter
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='ab0071751b0fbe006ddad243361a37cfd59bed46'
          $protected=@(
            'Project Files/Source/Console/Display.GPUWaterfall.cs',
            'Project Files/Source/Console/display.cs',
            'Project Files/Source/Console/NetworkIO.cs',
            'Project Files/Source/Console/PSForm.cs'
          )
          foreach($p in $protected){
            if(Test-Path $p){
              git diff --exit-code $base -- $p
              if($LASTEXITCODE -ne 0){throw "Protected 3Z9AM file changed: $p"}
            }
          }
          $console=Get-Content 'Project Files\Source\Console\console.cs' -Raw
          foreach($t in @('RadeInterceptMoxChange(chkMOX.Checked)','RadeAfterMoxChanged(tx)','RadePttStateMachine(); // SQ4KOU RADE EOO-safe arbiter')){
            if($console -notmatch [regex]::Escape($t)){throw "Missing EOO-safe console hook: $t"}
          }
          $ri=Get-Content 'Project Files\Source\Console\RadeIntegration.cs' -Raw
          foreach($t in @('SetRadaeTxSilenceHold(1)','RadaeNotifyEndOfOver()','GetRadaeEooFlushed()','RadeEooMarginMs = 300','RadeEooTimeoutMs = 3000')){
            if($ri -notmatch [regex]::Escape($t)){throw "Missing EOO-safe arbiter element: $t"}
          }
          Write-Host 'THETIS_3Z9AM_GPU_AND_PTT_EOO_GATE=PASS'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify CMake
        shell: pwsh
        run: cmake --version

      - name: Build pinned RADE native dependencies
        shell: pwsh
        run: tools/rade-redpitaya/build-rade-deps.ps1 -Configuration Release

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $targets){choco install wixtoolset -y --no-progress}
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $targets){$targets=Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\Wix.targets' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1}
          if(-not $targets){throw 'WiX 3.x Wix.targets not found'}
          "WIX_TARGETS=$($targets.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Thetis packages
        shell: pwsh
        run: nuget restore 'Project Files\Source\Thetis_VS2026.sln' -NonInteractive

      - name: Build Thetis-3Z9AM RADE Release x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'thetis-3z9am-rade-build.log'
          "BUILD_LOG=$log" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & msbuild 'Project Files\Source\Thetis_VS2026.sln' /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal 2>&1 | Tee-Object -FilePath $log
          if($LASTEXITCODE -ne 0){throw "MSBuild failed: $LASTEXITCODE"}
          $errors=Select-String -Path $log -Pattern ': error ' -ErrorAction SilentlyContinue
          if($errors){$errors | ForEach-Object {Write-Host $_.Line}; throw 'Build log contains compiler/build errors'}
          Write-Host 'THETIS_3Z9AM_RADE_BUILD=PASS'

      - name: Validate ChannelMaster RADE exports
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll=Get-ChildItem 'Project Files\bin' -Recurse -Filter ChannelMaster.dll | Where-Object {$_.FullName -match '\\x64\\Release\\'} | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $dll){throw 'ChannelMaster.dll x64 Release not found'}
          $dumpbin=Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if(-not $dumpbin){
            $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vspath=& $vswhere -latest -products * -property installationPath
            $dumpbin=Get-ChildItem (Join-Path $vspath 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe | Where-Object {$_.FullName -match '\\Hostx64\\x64\\'} | Sort-Object FullName -Descending | Select-Object -First 1
          }
          if(-not $dumpbin){throw 'dumpbin.exe not found'}
          $exports=& $dumpbin.FullName /exports $dll.FullName | Out-String
          foreach($name in @('SetRadaeRxEnabled','SetRadaeProtocolV2','SetRadaeTxRx','GetRadaeSync','SetRadaeMoxState','RadaeNotifyBeginOver','RadaeNotifyEndOfOver','GetRadaeEooFlushed','SetRadaeTxSilenceHold')){
            if($exports -notmatch [regex]::Escape($name)){throw "Missing ChannelMaster export: $name"}
          }
          Write-Host 'THETIS_3Z9AM_RADE_EXPORTS=PASS'

      - name: Locate verified 3Z9AM RADE MSI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $msi=Get-ChildItem 'Project Files\bin\Installers\*.msi' -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $msi -or $msi.Length -lt 1MB){throw 'Valid MSI was not produced'}
          $final=Join-Path $env:RUNNER_TEMP 'SQ4KOU-THETIS-3Z9AM-RADE-SV1EIA-1TO1-TEST-x64.msi'
          Copy-Item $msi.FullName $final -Force
          "FINAL_MSI=$final" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MSI_BYTES=$($msi.Length)"
          Write-Host "MSI_SHA256=$((Get-FileHash $final -Algorithm SHA256).Hash)"

      - name: Upload 3Z9AM RADE MSI
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-3Z9AM-RADE-SV1EIA-1TO1-TEST-x64
          path: ${{ env.FINAL_MSI }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload 3Z9AM RADE build log
        if: ${{ always() && env.BUILD_LOG != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-3Z9AM-RADE-BUILD-LOG
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: error
          compression-level: 6
