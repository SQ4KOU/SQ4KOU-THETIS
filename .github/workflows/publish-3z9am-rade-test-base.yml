name: Publish 3Z9AM RADE Test Base

on:
  push:
    branches:
      - automation/publish-3z9am-rade-20260916
    paths:
      - .github/workflows/publish-3z9am-rade-test-base.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact verified MSI artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: '35025554718'
          ARTIFACT_NAME: SQ4KOU-THETIS-REDPITAYA-RADE-SV1EIA-1TO1-NREFIX-TEST-x64
          MSI_NAME: SQ4KOU-THETIS-REDPITAYA-RADE-SV1EIA-1TO1-NREFIX-TEST-x64.msi
          EXPECTED_SHA256: a768c7d61a87725cf7856320ca6b12a5dbbefdd2d552c479158a388f5511ad27
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$RUN_ID" --repo "$REPO" --name "$ARTIFACT_NAME" --dir release
          test -f "release/$MSI_NAME"
          printf '%s  %s\n' "$EXPECTED_SHA256" "release/$MSI_NAME" | sha256sum -c -
          (cd release && sha256sum "$MSI_NAME" > SHA256SUMS.txt)

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: sq4kou-thetis-3z9am-rade-test-base-2026-09-16
          TARGET: fcc68ded12ac7111f650a3b84690b7df2b1f5a22
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # SQ4KOU Thetis-3Z9AM RADE — TEST BASE

          **Status:** baza testowa 3Z9AM RADE.

          > Przed instalacją zalecana jest kopia zapasowa bazy danych Thetis.

          - Dokładny commit źródłowy: `fcc68ded12ac7111f650a3b84690b7df2b1f5a22`
          - Commit: `Build RADE startup NRE fixed MSI`
          - Zachowana gałąź bazowa: `release/3Z9AM-RADE-TEST-BASE-20260916`
          - Oryginalny udany build GitHub Actions: `35025554718`
          - MSI pochodzi bezpośrednio z artefaktu tego buildu; nie wykonywano ponownej kompilacji.
          - RADE/SV1EIA: wariant 1:1, NRE startup fix, Red Pitaya.
          - To wydanie jest punktem odniesienia do dalszych testów. Kolejne zmiany powinny być wykonywane dopiero na podstawie konkretnego zgłoszonego błędu.

          Pliki:
          - `SQ4KOU-THETIS-REDPITAYA-RADE-SV1EIA-1TO1-NREFIX-TEST-x64.msi`
          - `SHA256SUMS.txt`
          EOF

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; verifying target only."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$TARGET" \
            --title "SQ4KOU Thetis-3Z9AM RADE — TEST BASE 2026-09-16" \
            --prerelease \
            --notes-file release-notes.md \
            release/SQ4KOU-THETIS-REDPITAYA-RADE-SV1EIA-1TO1-NREFIX-TEST-x64.msi \
            release/SHA256SUMS.txt
