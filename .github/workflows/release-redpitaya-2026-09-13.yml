name: Publish Thetis-RedPitaya 2026-09-13

on:
  push:
    branches:
      - feature/redpitaya-safe-dev-tci-antenna-fix
    paths:
      - .github/workflows/release-redpitaya-2026-09-13.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish Thetis-RedPitaya release 2026-09-13'
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      RELEASE_SHA: bbe47216cdc15b3b64a50e108c01fdd42d34bf26
      NEW_TAG: sq4kou-thetis-redpitaya-2026-09-13
      OLD_TAG: sq4kou-thetis-redpitaya-2026-09-12
      RELEASE_NAME: SQ4KOU Thetis-RedPitaya — 2026-09-13

    steps:
      - name: Checkout exact Thetis-RedPitaya FINAL/PASS
        uses: actions/checkout@v4
        with:
          ref: bbe47216cdc15b3b64a50e108c01fdd42d34bf26
          fetch-depth: 1
          filter: blob:none

      - name: Verify exact source commit
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:RELEASE_SHA) { throw "Unexpected checkout: $head" }
          Write-Host "Release source: $head"

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) { choco install wixtoolset -y --no-progress }
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) {
            $targets = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\Wix.targets" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $targets) { throw "WiX 3.x Wix.targets not found" }
          "WIX_TARGETS=$($targets.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore "Project Files\Source\Thetis_VS2026.sln" -NonInteractive

      - name: Build Release x64 MSI
        shell: pwsh
        run: |
          msbuild "Project Files\Source\Thetis_VS2026.sln" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal

      - name: Verify and stage release assets
        shell: pwsh
        run: |
          $msi = Get-ChildItem "Project Files\bin\Installers\*.msi" -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw "MSI was not produced" }
          if ($msi.Length -lt 1MB) { throw "MSI is unexpectedly small: $($msi.Length) bytes" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $out = "release\SQ4KOU-THETIS-REDPITAYA-x64.msi"
          Copy-Item $msi.FullName $out -Force
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SQ4KOU-THETIS-REDPITAYA-x64.msi" | Set-Content "release\SHA256SUMS.txt"
          "MSI_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MSI: $out ($($msi.Length) bytes)"
          Write-Host "SHA256: $hash"

      - name: Prepare release notes
        shell: pwsh
        run: |
          @'
          # SQ4KOU Thetis-RedPitaya

          > **UWAGA: PRZED INSTALACJĄ NALEŻY BEZWZGLĘDNIE WYKONAĆ KOPIĘ ZAPASOWĄ BAZY DANYCH THETIS.**

          Wydanie z głównej gałęzi `Thetis-RedPitaya`.

          - Źródło wydania: `bbe47216cdc15b3b64a50e108c01fdd42d34bf26`.
          - Zachowana potwierdzona obsługa GPU Waterfall RX/TX oraz historia wodospadu przy przejściach RX ↔ TX.
          - Zachowana poprawka rebind GPU Waterfall po zmianie szerokości displayu / Collapse / Expand.
          - TCI: po zmianie pasma ponownie publikowana jest antena RX1 przypisana do nowego pasma (`sq4kou_rx_antenna_selected_ex`), dzięki czemu ESP32 przełącza antenę zgodnie z konfiguracją Thetis.
          - TCI `rx_filter_band`: przed zmianą krawędzi filtra wybierany jest filtr VAR dla RX1/RX2.
          - cmASIO/VAC: poprawione sumowanie stereo do mono z kompensacją poziomu 0.5.
          - Network Watchdog: przywrócone prawidłowe położenie kontrolki w Setup bez przebudowy pozostałego UI.
          - Build: Release x64 MSI.

          MSI został przebudowany przez GitHub Actions dokładnie z powyższego commita przed publikacją wydania.
          '@ | Set-Content release-notes.md -Encoding utf8

      - name: Publish new release and replace previous RedPitaya release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "SQ4KOU/SQ4KOU-THETIS"

          gh release view $env:NEW_TAG --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $env:NEW_TAG --repo $repo --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not remove pre-existing new release" }
          }

          gh release create $env:NEW_TAG `
            "release\SQ4KOU-THETIS-REDPITAYA-x64.msi" `
            "release\SHA256SUMS.txt" `
            --repo $repo `
            --target $env:RELEASE_SHA `
            --title $env:RELEASE_NAME `
            --notes-file release-notes.md `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "New release creation failed" }

          $json = gh release view $env:NEW_TAG --repo $repo --json tagName,targetCommitish,isDraft,isPrerelease,assets,name
          if ($LASTEXITCODE -ne 0) { throw "New release verification failed" }
          $r = $json | ConvertFrom-Json
          if ($r.tagName -ne $env:NEW_TAG) { throw "Unexpected release tag" }
          if ($r.targetCommitish -ne $env:RELEASE_SHA) { throw "Unexpected release target: $($r.targetCommitish)" }
          if ($r.isDraft -or $r.isPrerelease) { throw "Release is draft/prerelease" }
          $names = @($r.assets | ForEach-Object { $_.name })
          if ($names -notcontains "SQ4KOU-THETIS-REDPITAYA-x64.msi") { throw "MSI asset missing" }
          if ($names -notcontains "SHA256SUMS.txt") { throw "SHA256SUMS asset missing" }

          gh release view $env:OLD_TAG --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $env:OLD_TAG --repo $repo --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "New release exists, but old release cleanup failed" }
          }

          Write-Host "Published $env:NEW_TAG from $env:RELEASE_SHA"
          Write-Host "MSI SHA256: $env:MSI_SHA256"

      - name: Upload build backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-REDPITAYA-2026-09-13
          path: release/*
          if-no-files-found: error
          compression-level: 0
