name: Integrate Ramdor N1MM CW shift

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-ramdor-n1mm.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control scripts
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          path: control

      - name: Checkout current synthesis snapshot
        uses: actions/checkout@v4
        with:
          ref: synthesis-clean
          fetch-depth: 1
          path: synthesis

      - name: Semantically integrate Ramdor N1MM option
        working-directory: synthesis
        shell: bash
        run: python ../control/.github/scripts/integrate_n1mm.py

      - name: Validate and push synthesis commit
        working-directory: synthesis
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SQ4KOU synthesis automation"
          git config user.email "actions@users.noreply.github.com"
          git add "Project Files/Source/Console/N1MM.cs" \
                  "Project Files/Source/Console/setup.cs" \
                  "Project Files/Source/Console/titlebar.cs" \
                  .sq4kou/SYNTHESIS_BASE.md
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Synthesis already contains the selected Ramdor N1MM delta."
          else
            git commit -m "Integrate Ramdor N1MM CW shift into clean synthesis"
            git push origin HEAD:synthesis-clean
          fi
          git rev-parse HEAD

  build-x64:
    needs: integrate
    runs-on: windows-latest
    steps:
      - name: Checkout updated synthesis
        uses: actions/checkout@v4
        with:
          ref: synthesis-clean
          fetch-depth: 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore "Project Files/Source/Thetis_VS2026.sln" -NonInteractive

      - name: Build full x64 Release solution and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          msbuild "Project Files/Source/Thetis_VS2026.sln" /m /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal /fl /flp:"logfile=build-logs/msbuild-x64-release.log;verbosity=normal" /bl:build-logs/msbuild-x64-release.binlog

      - name: Stage MSI installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerDir = "Project Files/bin/Installers"
          $msis = @(Get-ChildItem -LiteralPath $installerDir -Filter "*.msi" -File)
          if ($msis.Count -ne 1) {
            Write-Host "MSI candidates in ${installerDir}:"
            $msis | ForEach-Object { Write-Host $_.FullName }
            throw "Expected exactly one MSI installer, found $($msis.Count)."
          }
          New-Item -ItemType Directory -Force -Path "artifact-stage/installer" | Out-Null
          $dest = Join-Path "artifact-stage/installer" $msis[0].Name
          Copy-Item -LiteralPath $msis[0].FullName -Destination $dest -Force
          $item = Get-Item -LiteralPath $dest
          Write-Host ("Staged MSI: {0} ({1} bytes)" -f $item.Name, $item.Length)

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-n1mm-x64-build-logs
          path: build-logs/
          if-no-files-found: warn

      - name: Upload x64 release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-n1mm-x64-release
          path: Project Files/bin/x64/Release/**
          if-no-files-found: error

      - name: Upload MSI installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-n1mm-x64-installer
          path: artifact-stage/installer/*.msi
          if-no-files-found: error
