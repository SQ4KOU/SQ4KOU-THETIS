name: SQ4KOU DB runtime self-test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/db-runtime-selftest.yml

permissions:
  contents: read

jobs:
  db-selftest:
    runs-on: windows-latest
    steps:
      - name: Checkout SQ4KOU branch
        uses: actions/checkout@v4
        with:
          ref: sq4kou
          fetch-depth: 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore "Project Files/Source/Thetis_VS2026.sln" -NonInteractive

      - name: Build x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild "Project Files/Source/Thetis_VS2026.sln" /m /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Validate fresh and legacy database migrations through built Thetis DB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Resolve-Path "Project Files/bin/x64/Release").Path
          [Environment]::CurrentDirectory = $release
          $handler = [ResolveEventHandler]{
            param($sender,$args)
            $name = (New-Object Reflection.AssemblyName($args.Name)).Name + '.dll'
            $candidate = Join-Path $release $name
            if (Test-Path -LiteralPath $candidate) { return [Reflection.Assembly]::LoadFrom($candidate) }
            return $null
          }
          [AppDomain]::CurrentDomain.add_AssemblyResolve($handler)

          $asm = [Reflection.Assembly]::LoadFrom((Join-Path $release 'Thetis.exe'))
          $db = $asm.GetType('Thetis.DB', $true)
          $pub = [Reflection.BindingFlags]'Public,Static'
          $fileProp = $db.GetProperty('FileName', $pub)
          $verNumProp = $db.GetProperty('VersionNumber', $pub)
          $verStrProp = $db.GetProperty('VersionString', $pub)
          $dsField = $db.GetField('ds', $pub)
          $init = $db.GetMethod('Init', $pub)
          $validate = $db.GetMethod('ValidateCurrentDatabase', $pub)
          $import = $db.GetMethod('ImportAndMergeDatabase', $pub)
          $exit = $db.GetMethod('Exit', $pub)

          $dir = Join-Path $env:RUNNER_TEMP 'sq4kou-db-selftest'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $dbfile = Join-Path $dir 'database.xml'
          if (Test-Path $dbfile) { Remove-Item $dbfile -Force }

          $fileProp.SetValue($null, $dbfile, $null)
          $verNumProp.SetValue($null, '2.10.3.15', $null)
          $verStrProp.SetValue($null, '2.10.3.15 SQ4KOU SELFTEST', $null)
          $initOk = [bool]$init.Invoke($null, [object[]]@())
          Write-Host "DB.Init(fresh)=$initOk"
          if (-not $initOk) { throw 'Fresh DB.Init failed.' }

          $argsV = [object[]]@([string]'')
          $valid = [bool]$validate.Invoke($null, $argsV)
          Write-Host "ValidateCurrentDatabase(fresh)=$valid"
          Write-Host "Problems=$($argsV[0])"
          if (-not $valid) { throw "Fresh database fails current validator: $($argsV[0])" }

          $fresh = ([System.Data.DataSet]$dsField.GetValue($null)).Copy()

          function Test-Merge([System.Data.DataSet]$old, [string]$name) {
            $oldFile = [string](Join-Path $dir ($name + '.xml'))
            $old.WriteXml($oldFile, [System.Data.XmlWriteMode]::WriteSchema)
            $dsField.SetValue($null, $fresh.Copy())
            $a = New-Object 'System.Object[]' 3
            $a[0] = [string]$oldFile
            $a[1] = $null
            $a[2] = [bool]$true
            $mergeOk = [bool]$import.Invoke($null, $a)
            Write-Host "$name Merge=$mergeOk"
            Write-Host "$name ImportLog=$($a[1])"
            if (-not $mergeOk) { throw "$name ImportAndMergeDatabase failed." }
            $v = [object[]]@([string]'')
            $ok = [bool]$validate.Invoke($null, $v)
            Write-Host "$name Validate=$ok"
            Write-Host "$name Problems=$($v[0])"
            if (-not $ok) { throw "$name merged database rejected: $($v[0])" }
          }

          $old1 = $fresh.Copy()
          foreach ($tn in @('TXProfile','TXProfileDef')) {
            if ($old1.Tables[$tn].Columns.Contains('CFCPhaseRotatorAuto')) {
              $old1.Tables[$tn].Columns.Remove('CFCPhaseRotatorAuto')
            }
          }
          $srows = $old1.Tables['State'].Select("Key = 'DatabaseSchemaVersion'")
          foreach ($r in $srows) { $old1.Tables['State'].Rows.Remove($r) }
          Test-Merge $old1 'legacy-no-new-column'

          $old2 = $fresh.Copy()
          if ($old2.Tables['TXProfile'].Columns.Contains('CFCPhaseRotatorAuto')) {
            foreach ($r in $old2.Tables['TXProfile'].Rows) { $r['CFCPhaseRotatorAuto'] = [DBNull]::Value }
          }
          $schemaRows = $old2.Tables['State'].Select("Key = 'DatabaseSchemaVersion'")
          if ($schemaRows.Length -gt 0) { $schemaRows[0]['Value'] = '0' }
          Test-Merge $old2 'legacy-null-phase-rotator'

          $dsField.SetValue($null, $fresh.Copy())
          $exit.Invoke($null, [object[]]@()) | Out-Null

