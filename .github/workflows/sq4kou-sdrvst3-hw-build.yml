name: SQ4KOU SDR-VST3 HW Build

on:
  push:
    branches:
      - feature/sdr-vst3-sq4kou-hw
      - feature/sdr-vst3-full-gpu-waterfall-ff62
      - fix/sdr-vst3-overlay-shutdown-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: msbuild "Project Files/Source/Thetis_VS2026.sln" -t:Restore -p:Configuration=Release -p:Platform=x64 -m -nologo

      - name: Build
        run: msbuild "Project Files/Source/Thetis_VS2026.sln" -p:Configuration=Release -p:Platform=x64 -m -nologo

      - name: Verify renderer stability contract and SDR-VST3 3D parity
        shell: pwsh
        run: |
          $pan3d = git hash-object -- "Project Files/Source/Console/Display.Pan3DMesh.cs"
          if ($pan3d -ne "4ac1445c302537d3f61ea8f877527767921eaec5") {
            throw "Display.Pan3DMesh.cs is not the SDR-VST3 reference blob: $pan3d"
          }
          $form3d = git hash-object -- "Project Files/Source/Console/frm3DPanadapter.cs"
          if ($form3d -ne "b79852f27d3882c5b6008d8dd1e0af9099ff13fc") {
            throw "frm3DPanadapter.cs is not the SDR-VST3 reference blob: $form3d"
          }

          $wfMesh = Get-Content "Project Files/Source/Console/Display.WaterfallMesh.cs" -Raw
          if ($wfMesh -notmatch "ExperimentalSharedBackbufferMeshesEnabled\s*=\s*false") {
            throw "Shared-backbuffer waterfall mesh is not hard-disabled"
          }

          $compute = Get-Content "Project Files/Source/Console/Display.SpectrumCompute.cs" -Raw
          if ($compute -notmatch "private static bool ComputeArmed[\s\S]*?return false;") {
            throw "Blocking shared-context compute path is not hard-disabled"
          }

          $pan2d = Get-Content "Project Files/Source/Console/Display.Pan2DMesh.cs" -Raw
          if ($pan2d -notmatch "ExperimentalSharedBackbufferMeshesEnabled\s*&&\s*GpuMeshEnabled") {
            throw "2D spectrum mesh is not routed through the shared-backbuffer stability gate"
          }

          $gpuWf = Get-Content "Project Files/Source/Console/Display.GPUWaterfall.cs" -Raw
          if ($gpuWf -notmatch "ManagedGPUFFTRequested\s*=>\s*false") {
            throw "Managed SharpDX FFT path on the live Vortice device is not hard-disabled"
          }

          $overlay = Get-Content "Project Files/Source/Console/Display.OverlayMesh.cs" -Raw
          if ($overlay -notmatch "return ExperimentalSharedBackbufferMeshesEnabled\s*&&\s*GpuOverlayEnabled") {
            throw "GPU overlay is not routed through the shared-backbuffer stability gate"
          }

          $display = Get-Content "Project Files/Source/Console/display.cs" -Raw
          if ($display.Contains("_bWfMeshDrewFrame = RenderGpuWaterfall();")) {
            throw "Shared-swapchain waterfall presentation is still called from RenderDX2D"
          }
          if (-not $display.Contains("_bWfMeshDrewFrame = false;")) {
            throw "Stable D2D waterfall presentation contract is missing"
          }
          if (-not $display.Contains("Monitor.TryEnter(_objDX2Lock, 1500)")) {
            throw "Shutdown lock timeout guard is missing"
          }
          if (-not $display.Contains("POWER ON: suppressing full DX restart; renderer retained")) {
            throw "Power-on DX restart suppression is missing"
          }
          if (-not $display.Contains("managedGPU=") -or
              -not $display.Contains("computeArmed=") -or
              -not $display.Contains("wfMeshArmed=") -or
              -not $display.Contains("overlayArmed=")) {
            throw "Renderer diagnostics do not expose actual armed-path state"
          }

          Write-Host "PASS: original Pan3D parity retained; dedicated GPU FFT isolated; shared-context waterfall/compute/2D/overlay paths gated; shutdown and power guards present"

      - name: Verify SQ4KOU native and exact GPU waterfall exports
        shell: pwsh
        run: |
          $dll = Get-ChildItem "Project Files" -Recurse -Filter ChannelMaster.dll |
            Where-Object { $_.FullName -match '\\bin\\x64\\Release\\' } |
            Select-Object -First 1
          if (-not $dll) { throw "ChannelMaster.dll not found" }

          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }

          $exports = & $dumpbin.FullName /exports $dll.FullName | Out-String
          $requiredExports = @(
            'GetSQ4KOUHardwareState',
            'CM_GPUWaterfallExact_Init',
            'CM_GPUWaterfallExact_Configure',
            'CM_GPUWaterfallExact_Process',
            'CM_GPUWaterfallExact_RenderRow'
          )
          foreach ($name in $requiredExports) {
            if ($exports -notmatch [regex]::Escape($name)) {
              throw "$name export missing from ChannelMaster.dll"
            }
          }
          Write-Host "PASS: SQ4KOU + exact GPU waterfall exports present in $($dll.FullName)"

          $binDir = Split-Path $dll.FullName -Parent
          $requiredShaders = @(
            'waterfall_fft_bitreverse_cs.bin',
            'waterfall_fft_stage_ab_cs.bin',
            'waterfall_fft_stage_ba_cs.bin',
            'waterfall_fft_magnitude_cs.bin',
            'waterfall_row_cs.bin'
          )
          foreach ($shader in $requiredShaders) {
            $path = Join-Path $binDir $shader
            if (-not (Test-Path $path)) { throw "Required GPU waterfall shader missing: $path" }
          }
          Write-Host "PASS: all exact GPU waterfall shaders are present in release output"

      - name: Build test MSI
        shell: pwsh
        run: |
          $wixTargets = "C:/Program Files (x86)/MSBuild/Microsoft/WiX/v3.x/Wix.targets"
          msbuild "Project Files/Source/Thetis-Installer/Thetis-Installer.wixproj" -p:Configuration=Release -p:Platform=x64 "-p:WixTargetsPath=$wixTargets" -m -nologo

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem "Project Files/bin/Installers/SDR-VST3-v*.msi" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw "Test MSI not found" }
          Write-Host "MSI: $($msi.FullName)"
          "path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload test MSI
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-SDR-VST3-HW-NET10-x64
          path: ${{ steps.msi.outputs.path }}
          if-no-files-found: error
          retention-days: 14
