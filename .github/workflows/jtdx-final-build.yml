name: JTDX FINAL Windows Build

on:
  push:
    branches:
      - jtdx-final-build-2
    paths:
      - '.github/workflows/jtdx-final-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify FINAL bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:GITHUB_WORKSPACE\jtdx-final"
          function Read-Part([string[]]$names) {
            $s = ''
            foreach ($name in $names) {
              $p = Join-Path $dir $name
              if (-not (Test-Path $p)) { throw "Missing bundle fragment: $p" }
              $s += [IO.File]::ReadAllText($p).Trim()
            }
            return $s
          }

          $expectedPartSha = @{
            0='9adbb4e2835c2d55a76bb7402638663e0e1e02f5'; 1='6dc0fe18760d8be0c8f87f1f2c2bf910a54b0142';
            2='98707e1026bdf25d5d679ac3dbf4a678494ed556'; 3='24e7d915afec316dd45faaca8d816cb1dfbbc33f';
            4='587e5349d5e1208b3e857179ec9c43249cc1703e'; 5='7598923e9d6cc6452e44aa32f2fa67880b65eb5d';
            6='d3914a8e00d3195f194b822d22ba740a5da09c74'; 7='d8b46227f544e0f7a430330c624fe0af391e1485';
            8='aff4b5a08dd35c104b1d6889e69ce9ead233bf21'; 9='57b50a6fe1f2505b316b8315098debfa7d392fb9';
            10='174ed9360d69893567bc77d3817fbdee7870d98d'; 11='85643e04862a23c9546b7e75e208871308b881f9';
            12='3c6e036e30fbdf18a82e2eec3e416f64e5fff85d'; 13='36b8b1879d9b0b4bbe7eb1ff490ad82baaa61fc7'
          }

          $b64 = ''
          for ($i = 0; $i -lt 14; $i++) {
            if ($i -eq 6) {
              $part = Read-Part @('fix06.0.0','fix06.0.1.0','fix06.0.1.1','fix06.1','fix06.2','fix06.3')
            } elseif ($i -eq 7) {
              $part = Read-Part @('fix07.0','fix07.1','fix07.2','fix07.3.0','fix07.3.1')
            } elseif ($i -eq 12) {
              $part = Read-Part @('fix12.0','fix12.1','fix12.2','fix12.3')
            } else {
              $part = Read-Part @(("bundle.part{0:D2}" -f $i))
            }

            $expectedLen = if ($i -eq 13) { 704 } else { 8000 }
            if ($part.Length -ne $expectedLen) { throw "Part $i length mismatch: $($part.Length), expected $expectedLen" }

            $tmpPart = Join-Path $env:RUNNER_TEMP ("part{0:D2}.txt" -f $i)
            [IO.File]::WriteAllText($tmpPart, $part, [Text.Encoding]::ASCII)
            $gitHeader = [Text.Encoding]::ASCII.GetBytes("blob $($part.Length)`0")
            $body = [Text.Encoding]::ASCII.GetBytes($part)
            $all = New-Object byte[] ($gitHeader.Length + $body.Length)
            [Array]::Copy($gitHeader,0,$all,0,$gitHeader.Length)
            [Array]::Copy($body,0,$all,$gitHeader.Length,$body.Length)
            $sha1 = [Security.Cryptography.SHA1]::Create().ComputeHash($all)
            $gitSha = -join ($sha1 | ForEach-Object { $_.ToString('x2') })
            Write-Host "PART_$('{0:D2}' -f $i)_LEN=$($part.Length) GIT_SHA=$gitSha"
            if ($gitSha -ne $expectedPartSha[$i]) { throw "Part $i Git SHA mismatch: $gitSha" }
            $b64 += $part
          }

          if ($b64.Length -ne 104704) { throw "Combined Base64 length mismatch: $($b64.Length)" }
          $zip = "$env:RUNNER_TEMP\JTDX_SUPERHOUND_MSI_FINAL.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "BUNDLE_SHA256=$hash"
          if ($hash -ne 'c7bafdd622a46dac7730f477b46daf69f821a4b2edc70e27345036e842a1b354') {
            throw "Bundle SHA256 mismatch: $hash"
          }

          $dst = "$env:RUNNER_TEMP\jtdx-final"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $root = "$dst\JTDX_SUPERHOUND_MSI_FINAL"
          if (-not (Test-Path "$root\BUILD_JTDX_SUPERHOUND_MSI.ps1")) { throw 'FINAL build script missing' }
          Write-Host "FINAL_ROOT=$root"

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          location: C:\msys64
          update: false

      - name: Build JTDX SuperHound FINAL MSI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:RUNNER_TEMP\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$root\BUILD_JTDX_SUPERHOUND_MSI.ps1"
          if ($LASTEXITCODE -ne 0) { throw "FINAL builder failed with exit code $LASTEXITCODE" }

      - name: Validate FINAL MSI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:RUNNER_TEMP\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL"
          $msi = Get-ChildItem "$root\OUTPUT\JTDX-SuperHound*.msi" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw 'FINAL MSI not found' }
          if ($msi.Length -lt 1000000) { throw "FINAL MSI too small: $($msi.Length) bytes" }
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "FINAL_MSI=$($msi.Name)"
          Write-Host "FINAL_MSI_SIZE=$($msi.Length)"
          Write-Host "FINAL_MSI_SHA256=$hash"
          @(
            "FINAL_MSI=$($msi.Name)",
            "FINAL_MSI_SIZE=$($msi.Length)",
            "FINAL_MSI_SHA256=$hash"
          ) | Set-Content "$root\OUTPUT\FINAL_BUILD_INFO.txt" -Encoding UTF8

      - name: Upload FINAL artifact
        uses: actions/upload-artifact@v4
        with:
          name: JTDX-SuperHound-FINAL
          path: |
            ${{ runner.temp }}\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL\OUTPUT\*.msi
            ${{ runner.temp }}\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL\OUTPUT\FINAL_BUILD_INFO.txt
            ${{ runner.temp }}\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL\LOGS\*.log
          if-no-files-found: error
