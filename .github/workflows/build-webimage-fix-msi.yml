name: SQ4KOU 16-bit Waterfall render fix x64 MSI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-webimage-fix-msi.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout exact SQ4KOU branch
        uses: actions/checkout@v4
        with:
          ref: sq4kou
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '8707b1c5d4771ca458ec05238b38514c9b495dd3'
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Source baseline: $actual"
          if ($actual -ne $expected) { throw "Unexpected sq4kou HEAD: $actual" }

      - name: Apply 16-bit render correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'Project Files/Source/Console/display.cs'
          $text = [IO.File]::ReadAllText($p)
          $nl = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }

          function Replace-Once([string]$src, [string]$old, [string]$new, [string]$label) {
            $count = ([regex]::Matches($src, [regex]::Escape($old))).Count
            if ($count -ne 1) { throw "$label anchor count=$count, expected 1" }
            return $src.Replace($old, $new)
          }

          # 16-bit float needs linear RGB, but alpha is coverage and must remain unchanged.
          $oldAlpha = '                a = (float)Math.Pow(a, 1.6);'
          $newAlpha = '                // SQ4KOU_WF16_RENDER_FIX: alpha is coverage, not gamma-encoded; preserve it unchanged.'
          $text = Replace-Once $text $oldAlpha $newAlpha '16-bit alpha compensation'

          # Do not shrink logical Direct2D stroke geometry merely because the render target
          # uses 16-bit float pixels. Sub-pixel 0.45x strokes become visually translucent.
          $oldLine1 = @(
            '            // Yurij-eu2av - 2026-07-04: scale stroke for float surface (see sw()).',
            '            if (WaterfallPixelWriter.PixelSize == 8) strokeWidth *= 0.45f;'
          ) -join $nl
          $newLine1 = '            // SQ4KOU_WF16_RENDER_FIX: keep nominal stroke width at every colour depth.'
          $text = Replace-Once $text $oldLine1 $newLine1 'drawLineDX2D basic stroke scaling'

          $oldLine2 = @(
            '            // Yurij-eu2av - 2026-07-04: on 16-bit float surfaces Direct2D operates in',
            '            // linear/scRGB space, where antialiased stroke coverage is computed',
            '            // differently and renders visibly thicker than on 8-bit sRGB. Scale the',
            '            // stroke width down (0.45, tuned empirically) so the on-screen thickness',
            '            // matches the 8-bit path. Single chokepoint for all grid/spectrum lines.',
            '            if (WaterfallPixelWriter.PixelSize == 8) strokeWidth *= 0.45f;'
          ) -join $nl
          $newLine2 = '            // SQ4KOU_WF16_RENDER_FIX: keep nominal stroke width at every colour depth.'
          $text = Replace-Once $text $oldLine2 $newLine2 'drawLineDX2D styled stroke scaling'

          $oldSw = @(
            '        // Yurij-eu2av - 2026-07-04: scale a stroke width for the active depth.',
            '        // Callers that invoke _d2dRenderTarget.DrawLine directly (spectrum,',
            '        // waveform, data line) use this on their width argument. 0.45 was tuned',
            '        // empirically: pure 0.5 (2x) left lines ~8-10% too thick vs 8-bit.',
            '        [MethodImpl(MethodImplOptions.AggressiveInlining)]',
            '        private static float sw(float width)',
            '        {',
            '            return WaterfallPixelWriter.PixelSize == 8 ? width * 0.45f : width;',
            '        }'
          ) -join $nl
          $newSw = @(
            '        // SQ4KOU_WF16_RENDER_FIX: pixel precision must not change screen-space geometry.',
            '        [MethodImpl(MethodImplOptions.AggressiveInlining)]',
            '        private static float sw(float width)',
            '        {',
            '            return width;',
            '        }'
          ) -join $nl
          $text = Replace-Once $text $oldSw $newSw 'spectrum direct stroke scaling'

          [IO.File]::WriteAllText($p, $text, [Text.UTF8Encoding]::new($true))

          $check = [IO.File]::ReadAllText($p)
          if ($check.Contains('a = (float)Math.Pow(a, 1.6);')) { throw '16-bit alpha power compensation still present' }
          if ($check.Contains('strokeWidth *= 0.45f;')) { throw '16-bit drawLine stroke scaling still present' }
          if ($check.Contains('width * 0.45f')) { throw '16-bit sw() stroke scaling still present' }
          if (([regex]::Matches($check, 'SQ4KOU_WF16_RENDER_FIX')).Count -ne 4) { throw 'Expected four WF16 fix markers' }
          if (!$check.Contains('r = WaterfallPixelWriter.SrgbToLinear(r);')) { throw '16-bit linear RGB conversion was unexpectedly removed' }
          if (!$check.Contains('WaterfallPixelWriter.EncodeRow(rowF, row, W);')) { throw 'Waterfall 16-bit pixel encoder path was unexpectedly changed' }
          Write-Host '16-bit render correction applied; Waterfall encoder preserved.'

      - name: Verify only display.cs changed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'Project Files/Source/Console/display.cs') {
            throw "Expected exactly display.cs changed, got: $($changed -join ', ')"
          }
          git diff --check
          git diff -- 'Project Files/Source/Console/display.cs'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        shell: pwsh
        run: nuget restore 'Project Files/Source/Thetis_VS2026.sln' -NonInteractive

      - name: Build Release x64 MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          msbuild 'Project Files/Source/Thetis_VS2026.sln' /m /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal /fl /flp:'logfile=build-logs/msbuild-x64-release.log;verbosity=normal' /bl:build-logs/msbuild-x64-release.binlog

      - name: Commit validated source fix to sq4kou
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'SQ4KOU Render Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- 'Project Files/Source/Console/display.cs'
          git diff --cached --check
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 1 -or $staged[0] -ne 'Project Files/Source/Console/display.cs') { throw "Expected exactly display.cs staged, got: $($staged -join ', ')" }
          git commit -m 'Fix 16-bit waterfall spectrum rendering'
          git push origin HEAD:sq4kou
          $final = (git rev-parse HEAD).Trim()
          $final | Set-Content SQ4KOU_SOURCE_COMMIT.txt
          Write-Host "Validated source commit: $final"

      - name: Collect final MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem -LiteralPath 'Project Files/bin/Installers' -File -Filter '*.msi' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $msi) { throw 'No MSI found after successful build' }

          New-Item -ItemType Directory -Force -Path build-artifacts | Out-Null
          $out = 'build-artifacts/SQ4KOU_THETIS_WATERFALL16_RENDER_FIX_X64.msi'
          Copy-Item -LiteralPath $msi.FullName -Destination $out -Force
          (Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash | Set-Content 'build-artifacts/SQ4KOU_THETIS_WATERFALL16_RENDER_FIX_X64.msi.sha256'
          Copy-Item SQ4KOU_SOURCE_COMMIT.txt build-artifacts/SQ4KOU_SOURCE_COMMIT.txt -Force

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sq4kou-waterfall16-render-fix-build-logs
          path: build-logs/
          if-no-files-found: warn

      - name: Upload final MSI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU_THETIS_WATERFALL16_RENDER_FIX_X64_MSI
          path: build-artifacts/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (Get-Content SQ4KOU_SOURCE_COMMIT.txt -Raw).Trim()
          $tag = "waterfall16-render-fix-$env:GITHUB_RUN_NUMBER"
          $title = 'SQ4KOU Thetis Waterfall 16-bit Render Fix x64'
          $notes = @"
          Waterfall 16-bit render correction.

          Scope: Project Files/Source/Console/display.cs only.
          - preserves linear RGB conversion for R16G16B16A16_FLOAT;
          - preserves alpha as coverage instead of applying alpha^1.6;
          - removes the 0.45x stroke-width reduction used only in 16-bit mode;
          - leaves WaterfallPixelWriter and the 16-bit Waterfall pixel encoder unchanged.

          Validated source commit: $sha
          "@
          gh release create $tag 'build-artifacts/SQ4KOU_THETIS_WATERFALL16_RENDER_FIX_X64.msi' 'build-artifacts/SQ4KOU_THETIS_WATERFALL16_RENDER_FIX_X64.msi.sha256' 'build-artifacts/SQ4KOU_SOURCE_COMMIT.txt' --repo "$env:GITHUB_REPOSITORY" --target $sha --title $title --notes $notes
