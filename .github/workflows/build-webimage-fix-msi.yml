name: SQ4KOU WebImage network stall fix V3 x64 MSI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-webimage-fix-msi.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout exact SQ4KOU branch
        uses: actions/checkout@v4
        with:
          ref: sq4kou
          fetch-depth: 0
          persist-credentials: true

      - name: Verify source baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '197326df13824f46682111a1c9755e9884586645'
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Source baseline: $actual"
          if ($actual -ne $expected) { throw "Unexpected sq4kou HEAD: $actual" }

      - name: Apply WebImage network stall fix V3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'Project Files/Source/Console/clsImgeFetcher.cs'
          $text = [IO.File]::ReadAllText($p)
          $nl = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }

          function Replace-Once([string]$src, [string]$old, [string]$new, [string]$label) {
            $count = ([regex]::Matches($src, [regex]::Escape($old))).Count
            if ($count -ne 1) { throw "$label anchor count=$count, expected 1" }
            return $src.Replace($old, $new)
          }

          # A stalled WebImage worker must never keep the application alive during shutdown.
          $oldThread = '            Thread thread = new Thread(() => fetch_images(url, store, reset_event, id, file));'
          $newThread = @(
            '            Thread thread = new Thread(() => fetch_images(url, store, reset_event, id, file));',
            '            // SQ4KOU_WEBIMAGE_STALL_FIX_V3: WebImage is auxiliary and must not block process shutdown.',
            '            thread.IsBackground = true;'
          ) -join $nl
          $text = Replace-Once $text $oldThread $newThread 'background fetch thread'

          # HttpWebRequest.Timeout only covers establishing/getting the response. Reads from
          # ReadToEnd/CopyTo/stream.Read use ReadWriteTimeout and otherwise can block for minutes.
          $oldMainTimeout = '                            request.Timeout = 2000;'
          $newMainTimeout = @(
            '                            request.Timeout = 2000;',
            '                            // SQ4KOU_WEBIMAGE_STALL_FIX_V3: bound response-body stalls too.',
            '                            request.ReadWriteTimeout = 5000;'
          ) -join $nl
          $text = Replace-Once $text $oldMainTimeout $newMainTimeout 'main WebImage read timeout'

          # WebClient.DownloadData has no timeout control here. Use the same bounded request
          # path as the main WebImage request so an embedded HTML image cannot hang the worker.
          $oldHtml = @(
            '                                                using (WebClient webClient = new WebClient())',
            '                                                {',
            '                                                    byte[] imageData = webClient.DownloadData(imageUrl);',
            '                                                    using (MemoryStream imageStream = new MemoryStream(imageData))',
            '                                                    {',
            '                                                        Image image = LoadDetachedImage(imageStream);',
            '                                                        bool full = store.AddImage(image);',
            '                                                        imagesAdded = true;',
            '                                                        if (full) break;',
            '                                                        StateChanged?.Invoke(this, new StateEventArgs(id, State.OK));',
            '                                                    }',
            '                                                }'
          ) -join $nl
          $newHtml = @(
            '                                                // SQ4KOU_WEBIMAGE_STALL_FIX_V3: bounded HTML image download.',
            '                                                HttpWebRequest imageRequest = (HttpWebRequest)WebRequest.Create(imageUrl);',
            '                                                imageRequest.UserAgent = "Thetis v" + _version;',
            '                                                imageRequest.Timeout = 2000;',
            '                                                imageRequest.ReadWriteTimeout = 5000;',
            '                                                imageRequest.CachePolicy = new HttpRequestCachePolicy(HttpRequestCacheLevel.NoCacheNoStore);',
            '                                                using (HttpWebResponse imageResponse = (HttpWebResponse)imageRequest.GetResponse())',
            '                                                using (Stream imageResponseStream = imageResponse.GetResponseStream())',
            '                                                using (MemoryStream imageStream = new MemoryStream())',
            '                                                {',
            '                                                    imageResponseStream.CopyTo(imageStream);',
            '                                                    imageStream.Position = 0;',
            '                                                    Image image = LoadDetachedImage(imageStream);',
            '                                                    bool full = store.AddImage(image);',
            '                                                    imagesAdded = true;',
            '                                                    if (full) break;',
            '                                                    StateChanged?.Invoke(this, new StateEventArgs(id, State.OK));',
            '                                                }'
          ) -join $nl
          $text = Replace-Once $text $oldHtml $newHtml 'HTML WebClient download'

          # UpdateBypassCache signals the same event as StopFetching. The old wake code looked
          # only at timeout, so changing bypass-cache with an unchanged interval terminated the
          # fetch loop. Distinguish a genuine stop (configuration unchanged) from either update.
          $oldWake = @(
            '                        bool timout_exists = _timeouts.TryGetValue(id, out _);  // check we have not removed these',
            '                        bool bypass_exists = _bypass_cache.TryGetValue(id, out _);',
            '',
            '                        //check if _timeout is the same, if so break. It will be different if we have signaled',
            '                        //due to timeout change',
            '                        if (!timout_exists || !bypass_exists || _timeouts[id] == timeout)',
            '                            break;  // Exit the loop if signaled to stop, or items have been removed',
            '                        else',
            '                        {',
            '                            timeout = _timeouts[id];',
            '                            bypass_cache = _bypass_cache[id];',
            '                            reset_event.Reset();',
            '                        }'
          ) -join $nl
          $newWake = @(
            '                        // SQ4KOU_WEBIMAGE_STALL_FIX_V3: distinguish StopFetching from settings updates.',
            '                        bool timeout_exists = _timeouts.TryGetValue(id, out int new_timeout);',
            '                        bool bypass_exists = _bypass_cache.TryGetValue(id, out bool new_bypass_cache);',
            '',
            '                        if (!timeout_exists || !bypass_exists)',
            '                            break;',
            '',
            '                        // StopFetching only sets the event, so unchanged configuration means stop.',
            '                        if (new_timeout == timeout && new_bypass_cache == bypass_cache)',
            '                            break;',
            '',
            '                        timeout = new_timeout;',
            '                        bypass_cache = new_bypass_cache;',
            '                        reset_event.Reset();'
          ) -join $nl
          $text = Replace-Once $text $oldWake $newWake 'WebImage signal wake logic'

          [IO.File]::WriteAllText($p, $text, [Text.UTF8Encoding]::new($true))

          $check = [IO.File]::ReadAllText($p)
          $markers = ([regex]::Matches($check, 'SQ4KOU_WEBIMAGE_STALL_FIX_V3')).Count
          if ($markers -ne 4) { throw "Expected 4 V3 markers, found $markers" }
          if (([regex]::Matches($check, 'ReadWriteTimeout = 5000;')).Count -ne 2) { throw 'Expected two bounded WebImage body-read timeouts' }
          if ($check.Contains('WebClient webClient')) { throw 'Unbounded WebClient download still present' }
          if ($check.Contains('_timeouts[id] == timeout')) { throw 'Old bypass-cache-breaking wake test still present' }
          if (!$check.Contains('thread.IsBackground = true;')) { throw 'WebImage worker is not a background thread' }
          if (([regex]::Matches($check, 'SQ4KOU_WEBIMAGE_RACE_FIX_V2')).Count -ne 3) { throw 'V2 image-lifetime fixes were not preserved' }
          Write-Host 'WebImage V3 network-stall fix applied and invariants verified.'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        shell: pwsh
        run: nuget restore 'Project Files/Source/Thetis_VS2026.sln' -NonInteractive

      - name: Build Release x64 MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          msbuild 'Project Files/Source/Thetis_VS2026.sln' /m /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal /fl /flp:'logfile=build-logs/msbuild-x64-release.log;verbosity=normal' /bl:build-logs/msbuild-x64-release.binlog

      - name: Commit validated source fix to sq4kou
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'SQ4KOU WebImage Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- 'Project Files/Source/Console/clsImgeFetcher.cs'
          git diff --cached --check
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 1 -or $staged[0] -ne 'Project Files/Source/Console/clsImgeFetcher.cs') { throw "Expected exactly clsImgeFetcher.cs staged, got: $($staged -join ', ')" }
          git commit -m 'Fix WebImage blocking reads and bypass-cache stop'
          git push origin HEAD:sq4kou
          $final = (git rev-parse HEAD).Trim()
          $final | Set-Content SQ4KOU_SOURCE_COMMIT.txt
          Write-Host "Validated source commit: $final"

      - name: Collect final MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem -LiteralPath 'Project Files/bin/Installers' -File -Filter '*.msi' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $msi) { throw 'No MSI found after successful build' }

          New-Item -ItemType Directory -Force -Path build-artifacts | Out-Null
          $out = 'build-artifacts/SQ4KOU_THETIS_WEBIMAGE_STALL_FIX_V3_X64.msi'
          Copy-Item -LiteralPath $msi.FullName -Destination $out -Force
          (Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash | Set-Content 'build-artifacts/SQ4KOU_THETIS_WEBIMAGE_STALL_FIX_V3_X64.msi.sha256'
          Copy-Item SQ4KOU_SOURCE_COMMIT.txt build-artifacts/SQ4KOU_SOURCE_COMMIT.txt -Force

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sq4kou-webimage-stall-fix-v3-build-logs
          path: build-logs/
          if-no-files-found: warn

      - name: Upload final MSI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU_THETIS_WEBIMAGE_STALL_FIX_V3_X64_MSI
          path: build-artifacts/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (Get-Content SQ4KOU_SOURCE_COMMIT.txt -Raw).Trim()
          $tag = "webimage-stall-fix-v3-$env:GITHUB_RUN_NUMBER"
          $title = 'SQ4KOU Thetis WebImage Stall Fix V3 x64'
          $notes = @"
          WebImage freeze/stall fix V3.

          Scope remains limited to Project Files/Source/Console/clsImgeFetcher.cs:
          - response-body reads now have a finite 5 s ReadWriteTimeout;
          - HTML embedded-image WebClient download replaced by a bounded HttpWebRequest;
          - bypass-cache updates no longer terminate the fetch loop when interval is unchanged;
          - WebImage worker is background-only and cannot hold the process open;
          - V1 detached-image and V2 image-lifetime race fixes are retained.

          WideBand is untouched.
          Validated source commit: $sha
          "@
          gh release create $tag 'build-artifacts/SQ4KOU_THETIS_WEBIMAGE_STALL_FIX_V3_X64.msi' 'build-artifacts/SQ4KOU_THETIS_WEBIMAGE_STALL_FIX_V3_X64.msi.sha256' 'build-artifacts/SQ4KOU_SOURCE_COMMIT.txt' --repo "$env:GITHUB_REPOSITORY" --target $sha --title $title --notes $notes
