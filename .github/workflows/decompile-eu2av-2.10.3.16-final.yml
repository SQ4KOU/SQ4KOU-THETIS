name: Decompile EU2AV 2.10.3.16 Final

on:
  push:
    branches:
      - reference/eu2av-2.10.3.16-final-decompiled
    paths:
      - .github/workflows/decompile-eu2av-2.10.3.16-final.yml
      - tools/reverse-engineering/decompile-eu2av-final.ps1
      - tools/reverse-engineering/ExportDecomp.java
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eu2av-2.10.3.16-final-decompile
  cancel-in-progress: false

jobs:
  decompile:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Checkout isolated reference branch
        uses: actions/checkout@v4
        with:
          ref: reference/eu2av-2.10.3.16-final-decompiled
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Java for Ghidra
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET runtimes for ILSpy
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Full managed/native/DXBC reverse engineering
        shell: pwsh
        run: |
          ./tools/reverse-engineering/decompile-eu2av-final.ps1

      - name: Verify required reference outputs
        shell: pwsh
        run: |
          $root = 'reverse-engineering/EU2AV-Thetis-2.10.3.16-Final'
          $required = @(
            "$root/README.md",
            "$root/metadata/MANIFEST.csv",
            "$root/metadata/PROVENANCE.txt",
            "$root/metadata/NATIVE_DECOMPILE_STATUS.csv"
          )
          foreach ($p in $required) { if (-not (Test-Path $p)) { throw "Missing required output: $p" } }
          $managed = Get-ChildItem "$root/managed" -Recurse -File -ErrorAction Stop
          $nativeStats = Get-ChildItem "$root/native" -Recurse -File -Filter decompile-stats.txt -ErrorAction Stop
          $dxbc = Get-ChildItem "$root/dxbc" -File -Filter *.asm.txt -ErrorAction Stop
          if ($managed.Count -lt 100) { throw "Managed recovery unexpectedly small: $($managed.Count) files" }
          if ($nativeStats.Count -lt 2) { throw "Native decompilation unexpectedly small: $($nativeStats.Count) modules" }
          if ($dxbc.Count -lt 7) { throw "DXBC disassembly unexpectedly small: $($dxbc.Count) shaders" }
          Write-Host "VERIFY OK: managed files=$($managed.Count), native modules=$($nativeStats.Count), DXBC=$($dxbc.Count)"

      - name: Commit decompiled reference snapshot to branch
        shell: pwsh
        run: |
          git config user.name 'SQ4KOU Reverse Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- 'reverse-engineering/EU2AV-Thetis-2.10.3.16-Final'
          if (git diff --cached --quiet) {
            Write-Host 'No generated changes to commit.'
            exit 0
          }
          git commit -m 'Reference: full EU2AV 2.10.3.16 Final decompilation'
          git push origin HEAD:reference/eu2av-2.10.3.16-final-decompiled

      - name: Upload provenance and status artifact
        uses: actions/upload-artifact@v4
        with:
          name: EU2AV-2.10.3.16-Final-decompilation-status
          path: |
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/README.md
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/metadata
          if-no-files-found: error
