name: Decompile EU2AV 2.10.3.16 Final

on:
  push:
    branches:
      - reference/eu2av-2.10.3.16-final-decompiled
    paths:
      - .github/workflows/decompile-eu2av-2.10.3.16-final.yml
      - tools/reverse-engineering/decompile-eu2av-final.ps1
      - tools/reverse-engineering/ExportDecomp.java
      - tools/reverse-engineering/verify-eu2av-final.ps1
      - tools/reverse-engineering/EU2AV_FINAL_SOURCE_LOCK.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: eu2av-2.10.3.16-final-decompile
  cancel-in-progress: true

jobs:
  decompile:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Checkout isolated reference branch
        uses: actions/checkout@v4
        with:
          ref: reference/eu2av-2.10.3.16-final-decompiled
          fetch-depth: 1
          persist-credentials: true

      - name: Validate reverse-engineering scripts before expensive work
        shell: pwsh
        run: |
          $files = @(
            'tools/reverse-engineering/decompile-eu2av-final.ps1',
            'tools/reverse-engineering/verify-eu2av-final.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$file : $($_.Message)" }
              throw "PowerShell parser rejected $file"
            }
          }

      - name: Restore preserved export for verification
        uses: actions/download-artifact@v4
        with:
          name: EU2AV-2.10.3.16-Final-verification-failure
          run-id: 34222077364
          github-token: ${{ github.token }}
          path: reverse-engineering/EU2AV-Thetis-2.10.3.16-Final

      - name: Inspect preserved shader profiles and decompiler diagnostics
        shell: pwsh
        run: |
          $root = 'reverse-engineering/EU2AV-Thetis-2.10.3.16-Final'
          Get-ChildItem "$root/dxbc" -Filter *.asm.txt | ForEach-Object {
            Write-Host "SHADER: $($_.Name)"
            Get-Content -LiteralPath $_.FullName -TotalCount 45
          }
          $hits = @(Get-ChildItem "$root/managed" -Recurse -Filter *.cs |
            Select-String -Pattern 'Error decompiling|ICSharpCode.Decompiler.DecompilerException|Invalid IL code')
          Write-Host "MANAGED_DIAGNOSTIC_MATCHES=$($hits.Count)"
          $hits | Select-Object -First 30 | ForEach-Object { Write-Host $_ }
          
      - name: Set up compiler for independent CSharp syntax validation
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate all recovered CSharp syntax using Roslyn
        id: syntax
        shell: pwsh
        run: |
          $root = 'reverse-engineering/EU2AV-Thetis-2.10.3.16-Final'
          $sdkLine = @(dotnet --list-sdks | Where-Object { $_ -match '^8[.]' })[-1]
          if ($sdkLine -notmatch '^(\S+) \[(.+)\]') { throw 'Cannot locate .NET 8 SDK' }
          $roslyn = Join-Path (Join-Path $matches[2] $matches[1]) 'Roslyn/bincore'
          Add-Type -Path (Join-Path $roslyn 'Microsoft.CodeAnalysis.dll')
          Add-Type -Path (Join-Path $roslyn 'Microsoft.CodeAnalysis.CSharp.dll')
          $options = [Microsoft.CodeAnalysis.CSharp.CSharpParseOptions]::Default.WithLanguageVersion(
            [Microsoft.CodeAnalysis.CSharp.LanguageVersion]::Preview)
          $errors = [System.Collections.Generic.List[object]]::new()
          $files = @(Get-ChildItem "$root/managed" -Recurse -Filter *.cs)
          foreach ($file in $files) {
            $tree = [Microsoft.CodeAnalysis.CSharp.CSharpSyntaxTree]::ParseText(
              [IO.File]::ReadAllText($file.FullName), $options, $file.FullName,
              [Text.Encoding]::UTF8, [Threading.CancellationToken]::None)
            foreach ($diagnostic in $tree.GetDiagnostics([Threading.CancellationToken]::None)) {
              if ($diagnostic.Severity.ToString() -eq 'Error') {
                $errors.Add([pscustomobject]@{
                  file = [IO.Path]::GetRelativePath((Resolve-Path $root).Path, $file.FullName)
                  diagnostic = $diagnostic.ToString()
                })
              }
            }
          }
          $errors | Export-Csv "$root/metadata/CSHARP_SYNTAX_ERRORS.csv" -NoTypeInformation
          [ordered]@{
            scope = 'CSharp syntax only; not compilation or semantic equivalence'
            result = $(if ($errors.Count -eq 0 -and $files.Count -gt 0) { 'PASS' } else { 'FAIL' })
            files_checked = $files.Count
            syntax_errors = $errors.Count
          } | ConvertTo-Json | Set-Content "$root/metadata/CSHARP_SYNTAX_VERIFICATION.json"
          Write-Host "CSHARP_FILES=$($files.Count) SYNTAX_ERRORS=$($errors.Count)"
          $errors | Select-Object -First 20 | ForEach-Object { Write-Host $_.diagnostic }

      - name: Strict binary-grounded verification
        id: strict
        shell: pwsh
        run: |
          ./tools/reverse-engineering/verify-eu2av-final.ps1

      - name: Upload strict verification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EU2AV-2.10.3.16-Final-verification-failure
          path: |
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final
          if-no-files-found: warn
          retention-days: 7

      - name: Commit working decompilation with explicit verification status
        if: ${{ !cancelled() && steps.syntax.outcome == 'success' && (steps.strict.outcome == 'success' || steps.strict.outcome == 'failure') }}
        shell: pwsh
        env:
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
        run: |
          $root = 'reverse-engineering/EU2AV-Thetis-2.10.3.16-Final'
          $syntax = Get-Content "$root/metadata/CSHARP_SYNTAX_VERIFICATION.json" -Raw | ConvertFrom-Json
          if ($syntax.result -ne 'PASS') { throw 'CSharp syntax validation failed; refusing working snapshot' }
          $lock = Get-Content 'tools/reverse-engineering/EU2AV_FINAL_SOURCE_LOCK.json' -Raw | ConvertFrom-Json
          $provenance = Get-Content "$root/metadata/PROVENANCE.txt" -Raw
          if (-not $provenance.Contains($lock.package_sha256)) { throw 'Source lock mismatch' }
          [ordered]@{
            status = 'WORKING_DECOMPILATION'
            original_export_run = 34222077364
            package_sha256 = $lock.package_sha256
            csharp_syntax = $syntax
            strict_verification = $env:STRICT_OUTCOME
            limitations = @('Compilation not verified','IL semantic equivalence not verified','GPU behavior not verified','21 Skia assembly fallbacks require relevance review')
          } | ConvertTo-Json -Depth 6 | Set-Content "$root/metadata/WORKING_SOURCE_STATUS.json"
          $notice = @(
            '# EU2AV Thetis 2.10.3.16 Final — working decompilation',
            '',
            'This snapshot is available for code inspection and further reconstruction.',
            'It is not a verified rebuild of the original application and has no full STRICT PASS.',
            '',
            '- managed/: recovered C# and IL',
            '- native/: native pseudocode, function indexes and assembly fallbacks',
            '- dxbc/: all seven waterfall shader disassemblies',
            '- metadata/: source provenance, manifests, syntax results and exception register',
            '',
            'C# syntax was checked independently. Compilation, IL equivalence, GPU behavior,',
            'and function-specific relevance of 21 Skia fallbacks remain unverified.',
            'The original export README is preserved as EXPORT_README.md.'
          )
          if (-not (Test-Path "$root/EXPORT_README.md")) {
            Copy-Item "$root/README.md" "$root/EXPORT_README.md"
          }
          $notice | Set-Content "$root/README.md"
          git config user.name 'SQ4KOU Reverse Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- 'reverse-engineering/EU2AV-Thetis-2.10.3.16-Final'
          if (git diff --cached --quiet) {
            Write-Host 'No generated changes to commit.'
            exit 0
          }
          git commit -m 'Deliver working EU2AV decompilation with explicit verification gaps'
          git push origin HEAD:reference/eu2av-2.10.3.16-final-decompiled

      - name: Upload provenance and status artifact
        uses: actions/upload-artifact@v4
        with:
          name: EU2AV-2.10.3.16-Final-decompilation-status
          path: |
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/README.md
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/metadata
            tools/reverse-engineering/EU2AV_FINAL_SOURCE_LOCK.json
          if-no-files-found: error
