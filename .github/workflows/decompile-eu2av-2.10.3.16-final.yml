name: Decompile EU2AV 2.10.3.16 Final

on:
  push:
    branches:
      - reference/eu2av-2.10.3.16-final-decompiled
    paths:
      - .github/workflows/decompile-eu2av-2.10.3.16-final.yml
      - tools/reverse-engineering/decompile-eu2av-final.ps1
      - tools/reverse-engineering/ExportDecomp.java
      - tools/reverse-engineering/verify-eu2av-final.ps1
      - tools/reverse-engineering/EU2AV_FINAL_SOURCE_LOCK.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eu2av-2.10.3.16-final-decompile
  cancel-in-progress: true

jobs:
  decompile:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Checkout isolated reference branch
        uses: actions/checkout@v4
        with:
          ref: reference/eu2av-2.10.3.16-final-decompiled
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Java for Ghidra
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET runtimes for ILSpy
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Full managed/native/DXBC reverse engineering
        shell: pwsh
        run: |
          ./tools/reverse-engineering/decompile-eu2av-final.ps1

      - name: Strict binary-grounded verification
        shell: pwsh
        run: |
          ./tools/reverse-engineering/verify-eu2av-final.ps1

      - name: Upload strict verification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EU2AV-2.10.3.16-Final-verification-failure
          path: |
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/metadata
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/logs
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/native/*/decompile-stats.txt
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/native/*/functions.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Commit decompiled reference snapshot to branch
        shell: pwsh
        run: |
          git config user.name 'SQ4KOU Reverse Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- 'reverse-engineering/EU2AV-Thetis-2.10.3.16-Final'
          if (git diff --cached --quiet) {
            Write-Host 'No generated changes to commit.'
            exit 0
          }
          git commit -m 'Reference: full EU2AV 2.10.3.16 Final decompilation'
          git push origin HEAD:reference/eu2av-2.10.3.16-final-decompiled

      - name: Upload provenance and status artifact
        uses: actions/upload-artifact@v4
        with:
          name: EU2AV-2.10.3.16-Final-decompilation-status
          path: |
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/README.md
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/metadata
            tools/reverse-engineering/EU2AV_FINAL_SOURCE_LOCK.json
          if-no-files-found: error
