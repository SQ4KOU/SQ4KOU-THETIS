name: Decompile EU2AV 2.10.3.16 Final

on:
  push:
    branches:
      - reference/eu2av-2.10.3.16-final-decompiled
    paths:
      - .github/workflows/decompile-eu2av-2.10.3.16-final.yml
      - tools/reverse-engineering/decompile-eu2av-final.ps1
      - tools/reverse-engineering/ExportDecomp.java
      - tools/reverse-engineering/verify-eu2av-final.ps1
      - tools/reverse-engineering/EU2AV_FINAL_SOURCE_LOCK.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: eu2av-2.10.3.16-final-decompile
  cancel-in-progress: true

jobs:
  decompile:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Checkout isolated reference branch
        uses: actions/checkout@v4
        with:
          ref: reference/eu2av-2.10.3.16-final-decompiled
          fetch-depth: 1
          persist-credentials: true

      - name: Validate reverse-engineering scripts before expensive work
        shell: pwsh
        run: |
          $files = @(
            'tools/reverse-engineering/decompile-eu2av-final.ps1',
            'tools/reverse-engineering/verify-eu2av-final.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$file : $($_.Message)" }
              throw "PowerShell parser rejected $file"
            }
          }

      - name: Restore preserved export for verification
        uses: actions/download-artifact@v4
        with:
          name: EU2AV-2.10.3.16-Final-verification-failure
          run-id: 34222077364
          github-token: ${{ github.token }}
          path: reverse-engineering/EU2AV-Thetis-2.10.3.16-Final

      - name: Inspect preserved shader profiles and decompiler diagnostics
        shell: pwsh
        run: |
          $root = 'reverse-engineering/EU2AV-Thetis-2.10.3.16-Final'
          Get-ChildItem "$root/dxbc" -Filter *.asm.txt | ForEach-Object {
            Write-Host "SHADER: $($_.Name)"
            Get-Content -LiteralPath $_.FullName -TotalCount 45
          }
          $hits = @(Get-ChildItem "$root/managed" -Recurse -Filter *.cs |
            Select-String -Pattern 'Error decompiling|ICSharpCode.Decompiler.DecompilerException|Invalid IL code')
          Write-Host "MANAGED_DIAGNOSTIC_MATCHES=$($hits.Count)"
          $hits | Select-Object -First 30 | ForEach-Object { Write-Host $_ }
          
      - name: Strict binary-grounded verification
        shell: pwsh
        run: |
          ./tools/reverse-engineering/verify-eu2av-final.ps1

      - name: Upload strict verification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EU2AV-2.10.3.16-Final-verification-failure
          path: |
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final
          if-no-files-found: warn
          retention-days: 7

      - name: Commit decompiled reference snapshot to branch
        shell: pwsh
        run: |
          git config user.name 'SQ4KOU Reverse Engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- 'reverse-engineering/EU2AV-Thetis-2.10.3.16-Final'
          if (git diff --cached --quiet) {
            Write-Host 'No generated changes to commit.'
            exit 0
          }
          git commit -m 'Reference: full EU2AV 2.10.3.16 Final decompilation'
          git push origin HEAD:reference/eu2av-2.10.3.16-final-decompiled

      - name: Upload provenance and status artifact
        uses: actions/upload-artifact@v4
        with:
          name: EU2AV-2.10.3.16-Final-decompilation-status
          path: |
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/README.md
            reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/metadata
            tools/reverse-engineering/EU2AV_FINAL_SOURCE_LOCK.json
          if-no-files-found: error
