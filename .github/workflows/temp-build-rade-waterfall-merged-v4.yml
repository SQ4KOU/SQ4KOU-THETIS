name: TEMP Build merged RADE + TX Waterfall ID v4

on:
  push:
    branches:
      - temp/redpitaya-rade-tx-waterfall-id-20260916
    paths:
      - '.github/workflows/temp-build-rade-waterfall-merged-v4.yml'

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout exact merged temporary branch
        uses: actions/checkout@v4
        with:
          ref: temp/redpitaya-rade-tx-waterfall-id-20260916
          fetch-depth: 0
          submodules: recursive

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Gate merged source against both tested parents
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $red='3e3499201338312691557da13e49bdd73c651dec'
          $rade='fcc68ded12ac7111f650a3b84690b7df2b1f5a22'
          git cat-file -e "$red^{commit}"
          git cat-file -e "$rade^{commit}"

          $vendor='Project Files\lib\Thetis-RADE-vendor'
          $vsha=(git -C $vendor rev-parse HEAD).Trim()
          if($vsha -ne '408f2b5232ff0a2aec9b538a40d4cb1b02627b17'){throw "Wrong RADE vendor: $vsha"}

          foreach($f in @(
            'Project Files\Source\Console\RadeIntegration.cs',
            'Project Files\Source\Console\RadeNative.cs'
          )){ if(-not (Test-Path $f)){throw "Missing RADE source: $f"} }

          $targets=Get-Content 'Project Files\Source\Console\Directory.Build.targets' -Raw
          foreach($t in @('RadeIntegration.cs','RadeNative.cs','WaterfallID.Advanced.cs','Console.WaterfallIDMenuFix.cs')){
            if($targets -notmatch [regex]::Escape($t)){throw "Missing compile entry: $t"}
          }

          # Preserve the working TX Waterfall ID implementation from Thetis-RedPitaya.
          # Console.WaterfallIDMenuFix.cs is intentionally exempted from byte identity because
          # the merged source already has a native Console.OnShown override. Its semantic gate
          # below verifies the collision-free one-shot menu hook instead.
          foreach($p in @(
            'Project Files/Source/Console/Channel.cs',
            'Project Files/Source/Console/WaterfallID.Advanced.cs',
            'Project Files/Source/Console/Display.GPUWaterfall.cs',
            'Project Files/Source/Console/display.cs',
            'Project Files/Source/Console/NetworkIO.cs',
            'Project Files/Source/Console/PSForm.cs'
          )){
            git diff --exit-code $red -- $p
            if($LASTEXITCODE -ne 0){throw "RedPitaya/Waterfall-ID protected path changed: $p"}
          }

          $menuFix=Get-Content 'Project Files\Source\Console\Console.WaterfallIDMenuFix.cs' -Raw
          if($menuFix -match 'protected\s+override\s+void\s+OnShown\s*\('){throw 'Duplicate Console.OnShown regression in Waterfall ID menu fix'}
          foreach($t in @('_sq4kouWaterfallIdMenuHook','InstallWaterfallIdMenuHook','Sq4kouWaterfallIdMenuIdle','EnsureWaterfallIDMenuVisible')){
            if($menuFix -notmatch [regex]::Escape($t)){throw "Missing Waterfall ID lifecycle element: $t"}
          }
          Write-Host 'WATERFALL_ID_ONSHOWN_COLLISION_FIX=PASS'

          # Preserve the proven RADE EOO-safe arbitration hooks.
          $console=Get-Content 'Project Files\Source\Console\console.cs' -Raw
          foreach($t in @('RadeInterceptMoxChange(chkMOX.Checked)','RadeAfterMoxChanged(tx)','RadePttStateMachine(); // SQ4KOU RADE EOO-safe arbiter')){
            if($console -notmatch [regex]::Escape($t)){throw "Missing RADE console hook: $t"}
          }
          $ri=Get-Content 'Project Files\Source\Console\RadeIntegration.cs' -Raw
          foreach($t in @('SetRadaeTxSilenceHold(1)','RadaeNotifyEndOfOver()','GetRadaeEooFlushed()','RadeEooMarginMs = 300','RadeEooTimeoutMs = 3000')){
            if($ri -notmatch [regex]::Escape($t)){throw "Missing RADE EOO element: $t"}
          }

          $setup=Get-Content 'Project Files\Source\Console\setup.designer.cs' -Raw
          if($setup -notmatch [regex]::Escape('this.grpOzyType.Controls.Add(this.chkNetworkWDT);')){throw 'RedPitaya Network WDT group placement missing'}
          if($setup -match [regex]::Escape('this.panelTS14.Controls.Add(this.chkNetworkWDT);')){throw 'RedPitaya Network WDT panel regression'}
          if($setup -notmatch [regex]::Escape('this.chkNetworkWDT.Location = new System.Drawing.Point(312, 18);')){throw 'RedPitaya Network WDT location regression'}

          Write-Host "MERGED_HEAD=$(git rev-parse HEAD)"
          Write-Host "RADE_VENDOR=$vsha"
          Write-Host 'RADE_TX_WATERFALL_ID_SOURCE_GATE=PASS'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify CMake
        shell: pwsh
        run: cmake --version

      - name: Build pinned RADE native dependencies
        shell: pwsh
        run: tools/rade-redpitaya/build-rade-deps.ps1 -Configuration Release

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $targets){choco install wixtoolset -y --no-progress}
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $targets){$targets=Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\Wix.targets' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1}
          if(-not $targets){throw 'WiX 3.x Wix.targets not found'}
          "WIX_TARGETS=$($targets.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Thetis packages
        shell: pwsh
        run: nuget restore 'Project Files\Source\Thetis_VS2026.sln' -NonInteractive

      - name: Build combined Thetis-RedPitaya Release x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'thetis-redpitaya-rade-tx-waterfall-id-build.log'
          "BUILD_LOG=$log" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & msbuild 'Project Files\Source\Thetis_VS2026.sln' /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal 2>&1 | Tee-Object -FilePath $log
          if($LASTEXITCODE -ne 0){throw "MSBuild failed: $LASTEXITCODE"}
          $errors=Select-String -Path $log -Pattern ': error ' -ErrorAction SilentlyContinue
          if($errors){$errors | ForEach-Object {Write-Host $_.Line}; throw 'Build log contains compiler/build errors'}
          Write-Host 'THETIS_REDPITAYA_RADE_TX_WATERFALL_ID_BUILD=PASS'

      - name: Validate ChannelMaster RADE exports
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll=Get-ChildItem 'Project Files\bin' -Recurse -Filter ChannelMaster.dll | Where-Object {$_.FullName -match '\\x64\\Release\\'} | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $dll){throw 'ChannelMaster.dll x64 Release not found'}
          $dumpbin=Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if(-not $dumpbin){
            $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vspath=& $vswhere -latest -products * -property installationPath
            $dumpbin=Get-ChildItem (Join-Path $vspath 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe | Where-Object {$_.FullName -match '\\Hostx64\\x64\\'} | Sort-Object FullName -Descending | Select-Object -First 1
          }
          if(-not $dumpbin){throw 'dumpbin.exe not found'}
          $exports=& $dumpbin.FullName /exports $dll.FullName | Out-String
          foreach($name in @('SetRadaeRxEnabled','SetRadaeProtocolV2','SetRadaeTxRx','GetRadaeSync','SetRadaeMoxState','RadaeNotifyBeginOver','RadaeNotifyEndOfOver','GetRadaeEooFlushed','SetRadaeTxSilenceHold')){
            if($exports -notmatch [regex]::Escape($name)){throw "Missing ChannelMaster export: $name"}
          }
          Write-Host 'RADE_EXPORTS_AND_EOO_HANDSHAKE=PASS'

      - name: Locate combined MSI and record identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $msi=Get-ChildItem 'Project Files\bin\Installers\*.msi' -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $msi -or $msi.Length -lt 1MB){throw 'Valid MSI was not produced'}
          $final=Join-Path $env:RUNNER_TEMP 'SQ4KOU-THETIS-REDPITAYA-RADE-TX-WATERFALL-ID-TEST-x64.msi'
          Copy-Item $msi.FullName $final -Force
          $sha=(Get-FileHash $final -Algorithm SHA256).Hash
          $head=(git rev-parse HEAD).Trim()
          $info=Join-Path $env:RUNNER_TEMP 'SQ4KOU-THETIS-REDPITAYA-RADE-TX-WATERFALL-ID-TEST.txt'
          @(
            "BRANCH=temp/redpitaya-rade-tx-waterfall-id-20260916",
            "COMMIT=$head",
            "BASE_REDPITAYA=3e3499201338312691557da13e49bdd73c651dec",
            "RADE_SOURCE=fcc68ded12ac7111f650a3b84690b7df2b1f5a22",
            "RADE_VENDOR=408f2b5232ff0a2aec9b538a40d4cb1b02627b17",
            "MSI_SHA256=$sha",
            "RADE=PASS",
            "TX_WATERFALL_ID=PASS_WITH_ONSHOWN_COLLISION_FIX"
          ) | Set-Content $info -Encoding UTF8
          "FINAL_MSI=$final" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "FINAL_INFO=$info" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MSI_BYTES=$($msi.Length)"
          Write-Host "MSI_SHA256=$sha"
          Write-Host "MERGED_COMMIT=$head"

      - name: Upload combined MSI
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-REDPITAYA-RADE-TX-WATERFALL-ID-TEST-x64
          path: |
            ${{ env.FINAL_MSI }}
            ${{ env.FINAL_INFO }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload combined build log
        if: ${{ always() && env.BUILD_LOG != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-REDPITAYA-RADE-TX-WATERFALL-ID-BUILD-LOG
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: error
          compression-level: 6
