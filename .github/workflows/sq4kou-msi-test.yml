name: SQ4KOU MSI Test Build

on:
  push:
    branches: [sq4kou]
    paths:
      - '.github/workflows/sq4kou-msi-test.yml'

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout sq4kou
        uses: actions/checkout@v4
        with:
          ref: sq4kou
          fetch-depth: 1

      - name: Locate Visual Studio / MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $msbuild = & $vswhere -latest -prerelease -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw "MSBuild not found" }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "MSBuild: $msbuild"

      - name: Install build prerequisites
        shell: pwsh
        run: |
          choco install wixtoolset nuget.commandline --no-progress -y
          $wixTargets = "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets"
          if (!(Test-Path $wixTargets)) { throw "WiX 3.x targets not found: $wixTargets" }
          Write-Host "WiX targets: $wixTargets"
          nuget help | Select-Object -First 2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $sln = 'Project Files\Source\Thetis_VS2026.sln'
          $packages = 'Project Files\Source\packages'
          nuget restore $sln -PackagesDirectory $packages -NonInteractive -Verbosity normal
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed with exit code $LASTEXITCODE" }
          $required = @(
            'System.Resources.Extensions.10.0.8\lib\net462\System.Resources.Extensions.dll',
            'Discord.Net.Commands.3.18.0\lib\net461\Discord.Net.Commands.dll',
            'NAudio.2.3.0\lib\net472\NAudio.dll'
          )
          foreach ($rel in $required) {
            $p = Join-Path $packages $rel
            if (!(Test-Path $p)) { throw "Required restored package file missing: $p" }
            Write-Host "RESTORED: $p"
          }

      - name: Build Thetis Release x64 and MSI
        shell: pwsh
        run: |
          $msbuild = '${{ steps.msbuild.outputs.path }}'
          $sln = 'Project Files\Source\Thetis_VS2026.sln'
          & $msbuild $sln /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal /fl /flp:"logfile=SQ4KOU_MSI_BUILD.log;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Validate MSI output
        shell: pwsh
        run: |
          $dir = 'Project Files\bin\Installers'
          if (!(Test-Path $dir)) { throw "Installer output directory not found: $dir" }
          $msi = Get-ChildItem $dir -Filter '*.msi' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$msi) { throw "No MSI produced" }
          $dst = Join-Path $dir 'SQ4KOU_THETIS_CW_TEST_x64.msi'
          if ($msi.FullName -ne (Resolve-Path $dst -ErrorAction SilentlyContinue)) { Copy-Item $msi.FullName $dst -Force }
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash
          $size = (Get-Item $dst).Length
          Write-Host "MSI: $dst"
          Write-Host "SIZE: $size"
          Write-Host "SHA256: $hash"
          "MSI=$dst`nSIZE=$size`nSHA256=$hash`nSOURCE_COMMIT=${{ github.sha }}`nCW_FIX_COMMIT=6b8ae885172b99a7c7a5da7551b6717250ccc85b" | Set-Content 'SQ4KOU_MSI_BUILD_INFO.txt'

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU_THETIS_CW_TEST_MSI
          path: |
            Project Files/bin/Installers/SQ4KOU_THETIS_CW_TEST_x64.msi
            SQ4KOU_MSI_BUILD.log
            SQ4KOU_MSI_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
