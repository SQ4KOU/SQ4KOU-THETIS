name: Inspect recovered 2.10.3.16 threshold UI

on:
  push:
    branches: [fix/diversity-gpu-waterfall-test]

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/diversity-gpu-waterfall-test
          fetch-depth: 1
      - name: Extract exact recovered threshold implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = @(
            '.github\recovered\eu2av-2.10.3.16\Setup.EU2AV.2.10.3.16.cs.txt',
            '.github\recovered\eu2av-2.10.3.16\Display.EU2AV.2.10.3.16.cs.txt'
          )
          $out = '.github\recovered\threshold-snippet.txt'
          $patterns = @('chkAutoThreshold.Checked =','udAutoThFine.Value =','AutoThresholdEnabled','AutoThresholdFineOffset')
          $sb = [System.Text.StringBuilder]::new()
          foreach($p in $sources) {
            [void]$sb.AppendLine("===== SOURCE: $p =====")
            $lines = Get-Content $p
            foreach($pattern in $patterns) {
              [void]$sb.AppendLine("===== PATTERN: $pattern =====")
              $matches = Select-String -Path $p -SimpleMatch -Pattern $pattern
              foreach($m in $matches) {
                [void]$sb.AppendLine("--- MATCH LINE $($m.LineNumber) ---")
                $from=[Math]::Max(0,$m.LineNumber-30)
                $to=[Math]::Min($lines.Count-1,$m.LineNumber+45)
                for($i=$from;$i -le $to;$i++) { [void]$sb.AppendLine(('{0,7}: {1}' -f ($i+1),$lines[$i])) }
              }
            }
          }
          [System.IO.File]::WriteAllText($out,$sb.ToString(),[System.Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $out
          if(-not (git diff --cached --quiet)) {
            git commit -m 'Diagnostic: extract recovered threshold runtime [skip ci]'
            git push origin HEAD:fix/diversity-gpu-waterfall-test
          }
