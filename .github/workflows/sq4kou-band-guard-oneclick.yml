name: SQ4KOU Band Change Exception Safety Fix
on:
  push:
    branches: [import/3z9am-v6.0.7.25]
    paths: [.github/workflows/sq4kou-band-guard-oneclick.yml]
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply two exact minimal source changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path("Project Files/Source/Console/console.cs")
          raw = p.read_bytes()
          nl = b"\r\n" if b"\r\n" in raw else b"\n"
          def exact_once(s, old, new, label):
              count = s.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 anchor, got {count}")
              return s.replace(old, new, 1)

          # SetBand: an exception must never leave band/QSK change flags stuck.
          start = raw.index(b"        public void SetBand(string mode, string filter, double freq, bool CTUN")
          end = raw.index(b"        public void SetBand(string mode, string filter, double freq)", start)
          segment = raw[start:end]
          start_anchor = b"            qsk_band_changing = true;"
          segment = exact_once(segment, start_anchor,
             start_anchor + nl + b"            try" + nl + b"            {", "SetBand start")
          close_anchor = nl + b"        }" + nl
          close_idx = segment.rfind(close_anchor)
          if close_idx < 0:
              raise RuntimeError("SetBand: final method brace not found")
          cleanup = [
              b"            }",
              b"            catch (Exception ex)",
              b"            {",
              b"                Common.LogException(ex);",
              b"                throw;",
              b"            }",
              b"            finally",
              b"            {",
              b"                qsk_band_changing = false;",
              b"                m_bSetBandRunning = false;",
              b"            }",
          ]
          segment = segment[:close_idx] + nl + nl.join(cleanup) + segment[close_idx:]
          raw = raw[:start] + segment + raw[end:]

          # setRX1BandFromBandStackEntry: always restore HPSDR priority,
          # including when restoring the bandstack throws.
          start = raw.index(b"        private void setRX1BandFromBandStackEntry(")
          end = raw.index(b"        private void OnBandChangeHandler(", start)
          segment = raw[start:end]
          open_anchor = b"            NetworkIO.SendHighPriority(0);"
          segment = exact_once(segment, open_anchor,
             open_anchor + nl + b"            try" + nl + b"            {", "Network priority start")
          final_anchor = b"            NetworkIO.SendHighPriority(1);            "
          segment = exact_once(segment, final_anchor,
             nl.join([
                b"            }",
                b"            finally",
                b"            {",
                b"                NetworkIO.SendHighPriority(1);",
                b"            }"
             ]), "Network priority restore")
          raw = raw[:start] + segment + raw[end:]
          p.write_bytes(raw)
          print("[PASS] Two isolated fixes in console.cs, line endings preserved")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Source patch failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Diff check failed" }
          git diff --stat
          git diff -- "Project Files/Source/Console/console.cs"
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        shell: pwsh
        run: |
          msbuild "Project Files/Source/Thetis_VS2026.sln" -t:Restore -p:Configuration=Release -p:Platform=x64 -m -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
      - name: Build Release x64 with live errors
        shell: pwsh
        run: |
          msbuild "Project Files/Source/Thetis_VS2026.sln" -p:Configuration=Release -p:Platform=x64 -m -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Solution build failed" }
      - name: Verify executable and DLL hashes
        shell: pwsh
        run: |
          foreach ($name in @("Thetis.exe", "Thetis.dll", "wdsp.dll")) {
            $path = "Project Files/bin/x64/Release/$name"
            if (-not (Test-Path $path)) { throw "Missing expected binary: $name" }
            $item = Get-Item $path
            Write-Host "[PASS] $name bytes=$($item.Length) SHA256=$((Get-FileHash $path -Algorithm SHA256).Hash)"
          }
      - name: Build test MSI
        shell: pwsh
        run: |
          $wixTargets = "C:/Program Files (x86)/MSBuild/Microsoft/WiX/v3.x/Wix.targets"
          msbuild "Project Files/Source/Thetis-Installer/Thetis-Installer.wixproj" -p:Configuration=Release -p:Platform=x64 "-p:WixTargetsPath=$wixTargets" -m -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed" }
          $msi = Get-ChildItem "Project Files/bin/Installers/SDR-VST3-v*.msi" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw "MSI output not found" }
          Write-Host "[PASS] MSI $($msi.FullName), bytes=$($msi.Length), SHA256=$((Get-FileHash $msi.FullName -Algorithm SHA256).Hash)"
      - name: Upload MSI for hardware testing
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-BandSwitch-Guard-MSI
          path: Project Files/bin/Installers/SDR-VST3-v*.msi
          if-no-files-found: error
          retention-days: 14
      - name: Publish source only after PASS and remove temporary diagnostics
        shell: pwsh
        run: |
          git config user.name "SQ4KOU Band Fix"
          git config user.email "noreply@users.noreply.github.com"
          git add -- "Project Files/Source/Console/console.cs"
          git rm -f -- ".github/workflows/sq4kou-band-freeze-audit.yml" ".github/workflows/sq4kou-band-guard-oneclick.yml"
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "Final diff check failed" }
          git commit -m "fix: restore band-switch state and HPSDR priority after errors"
          git push origin "HEAD:refs/heads/import/3z9am-v6.0.7.25"
          if ($LASTEXITCODE -ne 0) { throw "Git push failed" }
          Write-Host "[PASS] Published tested source commit"
