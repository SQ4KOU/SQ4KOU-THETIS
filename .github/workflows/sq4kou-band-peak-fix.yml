name: SQ4KOU ResetSpectrumPeaks deadlock fix
on:
  push:
    branches: [import/3z9am-v6.0.7.25]
    paths: [.github/workflows/sq4kou-band-peak-fix.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact one-method deadlock fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("Project Files/Source/Console/display.cs")
          content = path.read_bytes()
          old = (b"            Parallel.For(0, maximums.Length, (i) =>\r\n"
                 b"            {\r\n"
                 b"                maximums[i].max_dBm = float.MinValue;\r\n"
                 b"            });")
          new = (b"            for (int i = 0; i < maximums.Length; i++)\r\n"
                 b"            {\r\n"
                 b"                maximums[i].max_dBm = float.MinValue;\r\n"
                 b"            }")
          if content.count(old) != 1:
              old = old.replace(b"\r\n", b"\n")
              new = new.replace(b"\r\n", b"\n")
          if content.count(old) != 1:
              raise SystemExit("FAIL: ResetSpectrumPeaks source anchor not unique")
          content = content.replace(old, new, 1)
          path.write_bytes(content)
          assert content.count(b"Parallel.For(0, maximums.Length") == 0
          print("[PASS] ResetSpectrumPeaks now uses non-blocking inline serial loop")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Patch failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Diff check failed" }
          git diff --stat
          git diff -- "Project Files/Source/Console/display.cs"
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore x64
        shell: pwsh
        run: |
          msbuild "Project Files/Source/Thetis_VS2026.sln" -t:Restore -p:Configuration=Release -p:Platform=x64 -m -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
      - name: Compile with live errors
        shell: pwsh
        run: |
          msbuild "Project Files/Source/Thetis_VS2026.sln" -p:Configuration=Release -p:Platform=x64 -m -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
      - name: Verify output and SHA256
        shell: pwsh
        run: |
          foreach ($name in @("Thetis.exe","Thetis.dll","wdsp.dll")) {
            $path = "Project Files/bin/x64/Release/$name"
            if (-not (Test-Path $path)) { throw "Missing: $path" }
            Write-Host "[PASS] $name sha256=$((Get-FileHash $path -Algorithm SHA256).Hash) bytes=$((Get-Item $path).Length)"
          }
      - name: Build MSI
        shell: pwsh
        run: |
          $wixTargets = "C:/Program Files (x86)/MSBuild/Microsoft/WiX/v3.x/Wix.targets"
          msbuild "Project Files/Source/Thetis-Installer/Thetis-Installer.wixproj" -p:Configuration=Release -p:Platform=x64 "-p:WixTargetsPath=$wixTargets" -m -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed" }
          $msi = "Project Files/bin/Installers/SDR-VST3.msi"
          if (-not (Test-Path $msi)) { throw "MSI missing" }
          Write-Host "[PASS] MSI sha256=$((Get-FileHash $msi -Algorithm SHA256).Hash) bytes=$((Get-Item $msi).Length)"
      - uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-BAND-DEADLOCK-FIX-MSI
          path: Project Files/bin/Installers/SDR-VST3.msi
          if-no-files-found: error
          retention-days: 14
      - name: Publish only after compile and MSI PASS, remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "SQ4KOU Band Deadlock Fix"
          git config user.email "noreply@users.noreply.github.com"
          git add -- "Project Files/Source/Console/display.cs"
          git rm -f -- ".github/workflows/sq4kou-band-peak-fix.yml"
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "Staged diff check failed" }
          git commit -m "fix: avoid ThreadPool deadlock in ResetSpectrumPeaks on band change"
          if ($LASTEXITCODE -ne 0) { throw "Git commit failed" }
          git push origin "HEAD:refs/heads/import/3z9am-v6.0.7.25"
          if ($LASTEXITCODE -ne 0) { throw "Git push failed" }
          Write-Host "[PASS] Source published after build"
