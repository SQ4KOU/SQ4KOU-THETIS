name: Integrate GPU Waterfall 16 Final

on:
  push:
    branches: [feature/gpu-waterfall-16final-recovered]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/gpu-waterfall-16final-recovered
          fetch-depth: 0

      - name: Fetch recovered reference branch
        shell: pwsh
        run: |
          git fetch origin reference/eu2av-2.10.3.16-final-decompiled:refs/remotes/origin/reference/eu2av-2.10.3.16-final-decompiled
          git rev-parse origin/reference/eu2av-2.10.3.16-final-decompiled

      - name: Normalize integrator for current SQ4KOU source
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          p = Path('tools/integrate_gpu_waterfall_16final.py')
          s = p.read_text(encoding='utf-8')

          pattern = r'''(marker\s*=\s*'\s*\[DllImport\("ChannelMaster\.dll",\s*)CallingConvention\s*=\s*CallingConvention\.Cdecl(\)\])'''
          repl = r'''\1EntryPoint = "SendpOutboundTCIRxIQ", CallingConvention = CallingConvention.Cdecl\2'''
          s2, n = re.subn(pattern, repl, s, count=1)
          if n == 1:
              s = s2
              print('GPU16_PRECHECK: updated cmaster.cs interop anchor for SQ4KOU/ramdor syntax')
          elif 'EntryPoint = "SendpOutboundTCIRxIQ", CallingConvention = CallingConvention.Cdecl' in s:
              print('GPU16_PRECHECK: cmaster anchor already current')
          else:
              raise SystemExit(f'GPU16_PRECHECK_FAIL: cmaster marker regex matches={n}')

          old = "    t = t.replace('</Project>', res + '</Project>')"
          new = "    root_close = t.rfind('</Project>')\n    if root_close < 0: die('Thetis.csproj root closing tag missing')\n    t = t[:root_close] + res + t[root_close:]"
          if old in s:
              s = s.replace(old, new, 1)
              print('GPU16_PRECHECK: fixed root-only Thetis.csproj resource insertion')
          elif "root_close = t.rfind('</Project>')" in s:
              print('GPU16_PRECHECK: root-only csproj insertion already current')
          else:
              raise SystemExit('GPU16_PRECHECK_FAIL: Thetis.csproj root insertion anchor not found')

          p.write_text(s, encoding='utf-8')
          '@ | python -

      - name: Integrate recovered 16 Final GPU sources
        shell: pwsh
        run: python tools/integrate_gpu_waterfall_16final.py

      - name: Adapt GPUDetector logging to SQ4KOU Display ABI
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p = Path(r'Project Files/Source/Console/GPUDetector.cs')
          s = p.read_text(encoding='utf-8-sig')
          old = 'GPUName = Display.GPUName;'
          new = 'GPUName = "unknown"; // SQ4KOU base Display has no GPUName; capability detection below remains unchanged.'
          n = s.count(old)
          if n == 1:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8-sig')
              print('GPU16_GPUDETECTOR_ABI=PASS replaced Display.GPUName logging dependency')
          elif new in s:
              print('GPU16_GPUDETECTOR_ABI=PASS already adapted')
          else:
              raise SystemExit(f'GPU16_GPUDETECTOR_ABI_FAIL matches={n}')
          '@ | python -

      - name: Verify recovered shader identity
        shell: pwsh
        run: |
          $ref='origin/reference/eu2av-2.10.3.16-final-decompiled'
          $base='reverse-engineering/EU2AV-Thetis-2.10.3.16-Final/managed/Thetis.exe'
          $names=@('waterfall_fft_bitreverse_cs.bin','waterfall_fft_magnitude_cs.bin','waterfall_fft_stage_ab_cs.bin','waterfall_fft_stage_ba_cs.bin','waterfall_postproc.bin','waterfall_resolve_cs.bin','waterfall_row_cs.bin')
          foreach($n in $names){
            $tmp=Join-Path $env:RUNNER_TEMP $n
            cmd /c "git show $ref`:$base/Thetis.$n > `"$tmp`""
            if($LASTEXITCODE -ne 0){throw "Cannot extract reference shader $n"}
            $a=(Get-FileHash $tmp -Algorithm SHA256).Hash
            $b=(Get-FileHash "Project Files/Source/Console/$n" -Algorithm SHA256).Hash
            if($a -ne $b){throw "Shader mismatch: $n"}
            Write-Host "PASS shader $n $a"
          }

      - name: Verify ProjectReference metadata survived integration
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re
          p = Path(r'Project Files/Source/Console/Thetis.csproj')
          s = p.read_text(encoding='utf-8-sig')
          refs = {
              r'..\Midi2Cat\Midi2Cat.csproj': '{66ADE184-31BA-4F5B-8007-F39EF1B90F95}',
              r'..\RawInput\RawInput.csproj': '{4143D085-38CF-4640-BB05-2FDFFAF94D76}',
          }
          for ref, guid in refs.items():
              pat = r'<ProjectReference\s+Include="' + re.escape(ref) + r'">\s*<Project>\s*' + re.escape(guid) + r'\s*</Project>'
              if not re.search(pat, s, flags=re.IGNORECASE):
                  raise SystemExit('GPU16_PROJECTREF_FAIL: invalid/corrupted Project metadata for ' + ref)
              print('PASS ProjectReference ' + ref + ' ' + guid)
          print('GPU16_PROJECTREF_METADATA=PASS')
          '@ | python -

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if(-not $targets){ choco install wixtoolset -y --no-progress }
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if(-not $targets){ throw 'WiX 3.x not found' }
          "WIX_TARGETS=$($targets.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore packages
        shell: pwsh
        run: nuget restore "Project Files\Source\Thetis_VS2026.sln" -NonInteractive

      - name: Build Release x64
        shell: pwsh
        run: msbuild "Project Files\Source\Thetis_VS2026.sln" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal

      - name: Verify MSI
        shell: pwsh
        run: |
          $msi=Get-ChildItem "Project Files\bin\Installers\*.msi" -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $msi -or $msi.Length -lt 1MB){throw 'Valid MSI not produced'}
          Write-Host "MSI=$($msi.FullName) SIZE=$($msi.Length)"

      - name: Commit generated recovered sources after successful build
        shell: pwsh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "Project Files/Source/Console" "Project Files/Source/ChannelMaster" "tools/integrate_gpu_waterfall_16final.py"
          if(git diff --cached --quiet){ Write-Host 'No generated source changes to commit'; exit 0 }
          git commit -m "[gpu16-integrated] Recovered 2.10.3.16 GPU core pipeline"
          git push origin HEAD:feature/gpu-waterfall-16final-recovered

      - name: Upload test MSI
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-GPU16-STAGE1-MSI
          path: Project Files/bin/Installers/*.msi
          if-no-files-found: error
          compression-level: 0
