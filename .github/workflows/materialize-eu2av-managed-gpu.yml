name: Materialize EU2AV Managed GPU Waterfall

on:
  workflow_dispatch:
  push:
    branches: [feature/eu2av-gpu-waterfall-sq4kou]
    paths: [.github/workflows/materialize-eu2av-managed-gpu.yml]

permissions:
  contents: write

jobs:
  materialize-build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eu2av-gpu-waterfall-sq4kou
          fetch-depth: 0

      - name: Recover untouched EU2AV 2.10.3.16 managed project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:RUNNER_TEMP 'Thetis-Extended-Final.7z'
          Invoke-WebRequest -Uri 'https://eu2av.net/download/file.php?id=2070' -OutFile $pkg -UseBasicParsing
          if ((Get-Item $pkg).Length -lt 10MB) { throw 'EU2AV package is unexpectedly small' }
          $unpack = Join-Path $env:RUNNER_TEMP 'eu2av'
          New-Item -ItemType Directory -Force -Path $unpack | Out-Null
          & 7z x $pkg "-o$unpack" -y | Out-Null
          $msi = Get-ChildItem $unpack -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'EU2AV MSI not found' }
          $installed = Join-Path $env:RUNNER_TEMP 'eu2av-installed'
          New-Item -ItemType Directory -Force -Path $installed | Out-Null
          $p = Start-Process msiexec.exe -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$installed`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI extraction failed: $($p.ExitCode)" }
          $exe = Get-ChildItem $installed -Recurse -Filter Thetis.exe | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Thetis.exe not found' }
          dotnet tool install --global ilspycmd --version 11.0.0.9375
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $rec = Join-Path $env:RUNNER_TEMP 'recovered-project'
          New-Item -ItemType Directory -Force -Path $rec | Out-Null
          ilspycmd --disable-updatecheck -p -o $rec $exe.FullName
          "REC=$rec" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EUROOT=$installed" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Materialize exact GPU classes and shader binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = Join-Path $PWD 'Project Files\Source\Console'
          $src = Join-Path $env:REC 'Thetis'
          $classes = @('GPUWaterfallPipeline.cs','WaterfallGPURenderer.cs','GPUWaterfallLogger.cs','SharedWaterfallState.cs','GPUWaterfallWindowType.cs','GPUWaterfallMagnitudeMode.cs','GPUWaterfallResamplingMode.cs')
          foreach ($f in $classes) {
            $s = Join-Path $src $f
            if (-not (Test-Path $s)) { throw "Recovered source missing: $f" }
            Copy-Item $s (Join-Path $dst $f) -Force
          }
          $shaders = @('waterfall_fft_bitreverse_cs.bin','waterfall_fft_stage_ab_cs.bin','waterfall_fft_stage_ba_cs.bin','waterfall_fft_magnitude_cs.bin','waterfall_row_cs.bin','waterfall_postproc.bin','waterfall_resolve_cs.bin')
          foreach ($f in $shaders) {
            $s = Get-ChildItem $env:EUROOT -Recurse -Filter $f | Select-Object -First 1
            if (-not $s) { throw "Recovered shader missing: $f" }
            Copy-Item $s.FullName (Join-Path $dst $f) -Force
          }

      - name: Restore exact managed Display adapter from audited recovery commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = (git show HEAD^:.github/workflows/materialize-eu2av-managed-gpu.yml) -join "`n"
          $m = [regex]::Match($old, "\$b64\s*=\s*'([^']+)'", [Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $m.Success) { throw 'Audited Display adapter payload not found in parent commit' }
          [IO.File]::WriteAllBytes('gpu_display_exact.cs.gz', [Convert]::FromBase64String($m.Groups[1].Value))
          python -c "import gzip; open(r'Project Files/Source/Console/Display.GPUWaterfall.cs','wb').write(gzip.open('gpu_display_exact.cs.gz','rb').read())"

      - name: Patch SQ4KOU integration points
        shell: pwsh
        run: |
          $patchB64 = ''
          [IO.File]::WriteAllBytes('integrate_exact_gpu.py.gz', [Convert]::FromBase64String($patchB64))
          python -c "import gzip; open('integrate_exact_gpu.py','wb').write(gzip.open('integrate_exact_gpu.py.gz','rb').read())"
          python integrate_exact_gpu.py

      - name: Verify managed GPU source before commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $display = Get-Content 'Project Files\Source\Console\Display.GPUWaterfall.cs' -Raw
          if ($display -match 'CM_GPUWaterfall_Process') { throw 'Old native GPU path still active' }
          foreach ($f in @('GPUWaterfallPipeline.cs','WaterfallGPURenderer.cs','SharedWaterfallState.cs','waterfall_fft_magnitude_cs.bin','waterfall_row_cs.bin')) {
            if (-not (Test-Path (Join-Path 'Project Files\Source\Console' $f))) { throw "Missing component: $f" }
          }
          git diff --stat

      - name: Commit recovered managed GPU source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Project Files/Source/Console'
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Integrate recovered EU2AV 2.10.3.16 managed GPU waterfall'
            git push origin HEAD:feature/eu2av-gpu-waterfall-sq4kou
          }
          "SOURCE_SHA=$(git rev-parse HEAD)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: latest
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) { choco install wixtoolset -y --no-progress }
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) { $targets = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\Wix.targets" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $targets) { throw 'WiX 3.x Wix.targets not found' }
          "WIX_TARGETS=$($targets.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore and build Release x64 MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore "Project Files\Source\Thetis_VS2026.sln" -NonInteractive
          msbuild "Project Files\Source\Thetis_VS2026.sln" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal

      - name: Verify shaders and final MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @('waterfall_fft_bitreverse_cs.bin','waterfall_fft_stage_ab_cs.bin','waterfall_fft_stage_ba_cs.bin','waterfall_fft_magnitude_cs.bin','waterfall_row_cs.bin')) {
            if (-not (Get-ChildItem 'Project Files\bin' -Recurse -Filter $f | Select-Object -First 1)) { throw "Shader not deployed: $f" }
          }
          $msi = Get-ChildItem "Project Files\bin\Installers\*.msi" -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi -or $msi.Length -lt 1MB) { throw 'Valid MSI was not produced' }
          $final = Join-Path $msi.DirectoryName 'SQ4KOU-THETIS-EU2AV-2.10.3.16-MANAGED-GPU-x64.msi'
          Copy-Item $msi.FullName $final -Force
          @("SOURCE_SHA=$env:SOURCE_SHA", "MSI_SHA256=$((Get-FileHash $final -Algorithm SHA256).Hash)", "MSI_BYTES=$((Get-Item $final).Length)") | Set-Content (Join-Path $msi.DirectoryName 'EU2AV-MANAGED-GPU-BUILD.txt')
          Get-Content (Join-Path $msi.DirectoryName 'EU2AV-MANAGED-GPU-BUILD.txt')

      - uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-EU2AV-2.10.3.16-MANAGED-GPU-MSI
          path: |
            Project Files/bin/Installers/SQ4KOU-THETIS-EU2AV-2.10.3.16-MANAGED-GPU-x64.msi
            Project Files/bin/Installers/EU2AV-MANAGED-GPU-BUILD.txt
          if-no-files-found: error
          compression-level: 0
