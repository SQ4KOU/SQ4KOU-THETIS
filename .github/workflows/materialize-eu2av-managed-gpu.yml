name: Materialize EU2AV Managed GPU Waterfall
# Exact recovered managed GPU pipeline; preserve existing SQ4KOU Extended waterfall support.

on:
  workflow_dispatch:
  push:
    branches: [feature/eu2av-gpu-waterfall-sq4kou]
    paths: [.github/workflows/materialize-eu2av-managed-gpu.yml]

permissions:
  contents: write

jobs:
  materialize-build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eu2av-gpu-waterfall-sq4kou
          fetch-depth: 0

      - name: Recover untouched EU2AV 2.10.3.16 managed project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:RUNNER_TEMP 'Thetis-Extended-Final.7z'
          Invoke-WebRequest -Uri 'https://eu2av.net/download/file.php?id=2070' -OutFile $pkg -UseBasicParsing
          if ((Get-Item $pkg).Length -lt 10MB) { throw 'EU2AV package is unexpectedly small' }
          $unpack = Join-Path $env:RUNNER_TEMP 'eu2av'; New-Item -ItemType Directory -Force -Path $unpack | Out-Null
          & 7z x $pkg "-o$unpack" -y | Out-Null
          $msi = Get-ChildItem $unpack -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'EU2AV MSI not found' }
          $installed = Join-Path $env:RUNNER_TEMP 'eu2av-installed'; New-Item -ItemType Directory -Force -Path $installed | Out-Null
          $p = Start-Process msiexec.exe -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$installed`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI extraction failed: $($p.ExitCode)" }
          $exe = Get-ChildItem $installed -Recurse -Filter Thetis.exe | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Thetis.exe not found' }
          dotnet tool install --global ilspycmd --version 11.0.0.9375
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $rec = Join-Path $env:RUNNER_TEMP 'recovered-project'; New-Item -ItemType Directory -Force -Path $rec | Out-Null
          ilspycmd --disable-updatecheck -p -o $rec $exe.FullName
          "REC=$rec" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EUROOT=$installed" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Materialize exact EU2AV GPU classes and shaders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = Join-Path $PWD 'Project Files\Source\Console'
          $src = Join-Path $env:REC 'Thetis'
          $classes = @(
            'GPUWaterfallPipeline.cs','WaterfallGPURenderer.cs','GPUWaterfallLogger.cs','SharedWaterfallState.cs',
            'GPUWaterfallWindowType.cs','GPUWaterfallMagnitudeMode.cs','GPUWaterfallResamplingMode.cs'
          )
          foreach ($f in $classes) {
            $s = Join-Path $src $f
            if (-not (Test-Path $s)) { throw "Recovered source missing: $f" }
            Copy-Item $s (Join-Path $dst $f) -Force
          }
          $shaders = @(
            'waterfall_fft_bitreverse_cs.bin','waterfall_fft_stage_ab_cs.bin','waterfall_fft_stage_ba_cs.bin',
            'waterfall_fft_magnitude_cs.bin','waterfall_row_cs.bin','waterfall_postproc.bin','waterfall_resolve_cs.bin'
          )
          foreach ($f in $shaders) {
            $s = Get-ChildItem $env:EUROOT -Recurse -Filter $f | Select-Object -First 1
            if (-not $s) { throw "Recovered shader missing: $f" }
            Copy-Item $s.FullName (Join-Path $dst $f) -Force
          }

      - name: Install exact managed GPU Display adapter
        shell: pwsh
        run: |
          $b64 = ''
          [IO.File]::WriteAllBytes('gpu_display_exact.cs.gz', [Convert]::FromBase64String($b64))
          python -c "import gzip; open(r'Project Files/Source/Console/Display.GPUWaterfall.cs','wb').write(gzip.open('gpu_display_exact.cs.gz','rb').read())"

      - name: Patch SQ4KOU integration points without replacing Display or Setup
        shell: pwsh
        run: |
          @'
import pathlib, re
root = pathlib.Path('Project Files/Source/Console')

p = root/'cmaster.cs'
s = p.read_text(encoding='utf-8-sig')
marker = '        // siphon\n'
if 'ReadWaterfallIQ(int stream' not in s:
    block = r'''        // EU2AV 2.10.3.16 GPU waterfall I/Q ring
        private static bool _waterfallIQInitialized = false;
        [DllImport("ChannelMaster.dll", CallingConvention = CallingConvention.Cdecl)] public static extern int CM_WaterfallIQ_Init(int stream, int capacitySamples);
        [DllImport("ChannelMaster.dll", CallingConvention = CallingConvention.Cdecl)] public static extern void CM_WaterfallIQ_Free(int stream);
        [DllImport("ChannelMaster.dll", CallingConvention = CallingConvention.Cdecl)] public static extern void CM_WaterfallIQ_SetEnabled(int stream, int enable);
        [DllImport("ChannelMaster.dll", CallingConvention = CallingConvention.Cdecl)] public static extern int CM_WaterfallIQ_Available(int stream);
        [DllImport("ChannelMaster.dll", CallingConvention = CallingConvention.Cdecl)] private unsafe static extern int CM_WaterfallIQ_Get(int stream, int maxSamples, float* outI, float* outQ);
        [DllImport("ChannelMaster.dll", CallingConvention = CallingConvention.Cdecl)] public static extern ulong CM_WaterfallIQ_DroppedSamples(int stream);
        [DllImport("ChannelMaster.dll", CallingConvention = CallingConvention.Cdecl)] public static extern void CM_WaterfallIQ_ResetDropped(int stream);
        public static void SetWaterfallIQEnabled(bool enabled)
        {
            if (enabled && !_waterfallIQInitialized)
            {
                for (int i = 0; i < 2; i++) CM_WaterfallIQ_Init(i, 524288);
                _waterfallIQInitialized = true;
            }
            if (_waterfallIQInitialized) for (int i = 0; i < 2; i++) CM_WaterfallIQ_SetEnabled(i, enabled ? 1 : 0);
        }
        public unsafe static int ReadWaterfallIQ(int stream, float[] outI, float[] outQ, int maxSamples)
        {
            if (outI == null || outQ == null || maxSamples <= 0) return 0;
            int n = Math.Min(maxSamples, Math.Min(outI.Length, outQ.Length));
            if (n <= 0) return 0;
            int got;
            fixed (float* pi = outI) fixed (float* pq = outQ) got = CM_WaterfallIQ_Get(stream, n, pi, pq);
            for (int i = 0; i < got; i++) { float t = outI[i]; outI[i] = outQ[i]; outQ[i] = t; }
            return got;
        }
        public static int GetWaterfallIQDroppedSamples(int stream)
        {
            ulong v = CM_WaterfallIQ_DroppedSamples(stream); return v > int.MaxValue ? int.MaxValue : (int)v;
        }
        public static void ResetWaterfallIQDropped(int stream) { CM_WaterfallIQ_ResetDropped(stream); }

'''
    if marker not in s: raise SystemExit('cmaster siphon anchor not found')
    s = s.replace(marker, block + marker, 1)
p.write_text(s, encoding='utf-8-sig')

p = root/'display.cs'
s = p.read_text(encoding='utf-8-sig')
s = s.replace('TryUpdateGPUWaterfallRow(rx, nDecimatedWidth, local_mox);', 'TryUpdateGPUWaterfallRow(rx, W, local_mox);')
anchor = """                    if (horizontalShiftPixels > W) horizontalShiftPixels = W;
                    else if (horizontalShiftPixels < -W) horizontalShiftPixels = -W;

                    if (rx == 1)"""
replacement = """                    if (horizontalShiftPixels > W) horizontalShiftPixels = W;
                    else if (horizontalShiftPixels < -W) horizontalShiftPixels = -W;

                    UpdateEU2AVGPURenderer(rx, W, H, local_mox, cScheme, low_threshold, high_threshold, horizontalShiftPixels, addRow);

                    if (rx == 1)"""
if anchor not in s: raise SystemExit('display shift anchor not found')
s = s.replace(anchor, replacement, 1)
old = """                if (rx == 1)
                {
                    _d2dRenderTarget.DrawBitmap(_waterfall_bmp_dx2d, new RectangleF(0, nVerticalShift + 20, _waterfall_bmp_dx2d.Size.Width, _waterfall_bmp_dx2d.Size.Height), m_fRX1WaterfallOpacity, BitmapInterpolationMode.Linear);
                }
                else
                {
                    _d2dRenderTarget.DrawBitmap(_waterfall_bmp2_dx2d, new RectangleF(0, nVerticalShift + 20, _waterfall_bmp2_dx2d.Size.Width, _waterfall_bmp2_dx2d.Size.Height), m_fRX2WaterfallOpacity, BitmapInterpolationMode.Linear);
                }"""
new = """                if (!DrawEU2AVGPURenderer(rx, nVerticalShift))
                {
                    if (rx == 1)
                    {
                        _d2dRenderTarget.DrawBitmap(_waterfall_bmp_dx2d, new RectangleF(0, nVerticalShift + 20, _waterfall_bmp_dx2d.Size.Width, _waterfall_bmp_dx2d.Size.Height), m_fRX1WaterfallOpacity, BitmapInterpolationMode.Linear);
                    }
                    else
                    {
                        _d2dRenderTarget.DrawBitmap(_waterfall_bmp2_dx2d, new RectangleF(0, nVerticalShift + 20, _waterfall_bmp2_dx2d.Size.Width, _waterfall_bmp2_dx2d.Size.Height), m_fRX2WaterfallOpacity, BitmapInterpolationMode.Linear);
                    }
                }"""
if old not in s: raise SystemExit('display draw anchor not found')
s = s.replace(old, new, 1)
p.write_text(s, encoding='utf-8-sig')

p = root/'Thetis.csproj'
s = p.read_text(encoding='utf-8-sig')
s = s.replace('    <Compile Include="GPUWaterfallEnums.cs" />\n', '')
compile_anchor = '    <Compile Include="GPUWaterfallNative.cs" />\n'
add = '''    <Compile Include="GPUWaterfallWindowType.cs" />
    <Compile Include="GPUWaterfallMagnitudeMode.cs" />
    <Compile Include="GPUWaterfallResamplingMode.cs" />
    <Compile Include="GPUWaterfallPipeline.cs" />
    <Compile Include="WaterfallGPURenderer.cs" />
    <Compile Include="GPUWaterfallLogger.cs" />
    <Compile Include="SharedWaterfallState.cs" />
'''
for name in ['GPUWaterfallWindowType.cs','GPUWaterfallMagnitudeMode.cs','GPUWaterfallResamplingMode.cs','GPUWaterfallPipeline.cs','WaterfallGPURenderer.cs','GPUWaterfallLogger.cs','SharedWaterfallState.cs']:
    s = s.replace(f'    <Compile Include="{name}" />\n','')
if compile_anchor not in s: raise SystemExit('csproj compile anchor not found')
s = s.replace(compile_anchor, compile_anchor + add, 1)
shader_xml = '''    <Content Include="waterfall_fft_bitreverse_cs.bin"><CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory></Content>
    <Content Include="waterfall_fft_stage_ab_cs.bin"><CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory></Content>
    <Content Include="waterfall_fft_stage_ba_cs.bin"><CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory></Content>
    <Content Include="waterfall_fft_magnitude_cs.bin"><CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory></Content>
    <Content Include="waterfall_row_cs.bin"><CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory></Content>
    <Content Include="waterfall_postproc.bin"><CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory></Content>
    <Content Include="waterfall_resolve_cs.bin"><CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory></Content>
'''
for sh in ['waterfall_fft_bitreverse_cs.bin','waterfall_fft_stage_ab_cs.bin','waterfall_fft_stage_ba_cs.bin','waterfall_fft_magnitude_cs.bin','waterfall_row_cs.bin','waterfall_postproc.bin','waterfall_resolve_cs.bin']:
    s = re.sub(r'\s*<Content Include="'+re.escape(sh)+r'"[^>]*>.*?</Content>\s*', '\n', s, flags=re.S)
none_anchor = '    <None Include="Resources\\thetis-logo2.png" />'
if none_anchor not in s: raise SystemExit('csproj content anchor not found')
s = s.replace(none_anchor, shader_xml + none_anchor, 1)
p.write_text(s, encoding='utf-8-sig')
print('Managed EU2AV GPU integration patched successfully')
'@ | Set-Content integrate_exact_gpu.py -Encoding utf8
          python integrate_exact_gpu.py

      - name: Verify exact managed GPU source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $display = Get-Content 'Project Files\Source\Console\Display.GPUWaterfall.cs' -Raw
          if ($display -match 'CM_GPUWaterfall_Process') { throw 'Old native GPU waterfall path still active' }
          foreach ($f in @('GPUWaterfallPipeline.cs','WaterfallGPURenderer.cs','waterfall_fft_magnitude_cs.bin','waterfall_row_cs.bin')) {
            if (-not (Test-Path (Join-Path 'Project Files\Source\Console' $f))) { throw "Missing GPU component $f" }
          }
          git diff --stat

      - name: Commit recovered managed GPU source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Project Files/Source/Console'
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Integrate recovered EU2AV 2.10.3.16 managed GPU waterfall'
            git push origin HEAD:feature/eu2av-gpu-waterfall-sq4kou
          }
          "SOURCE_SHA=$(git rev-parse HEAD)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: latest
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) { choco install wixtoolset -y --no-progress }
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) { $targets = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\Wix.targets" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $targets) { throw 'WiX 3.x Wix.targets not found' }
          "WIX_TARGETS=$($targets.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore and build Release x64 MSI from committed managed GPU source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore "Project Files\Source\Thetis_VS2026.sln" -NonInteractive
          msbuild "Project Files\Source\Thetis_VS2026.sln" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal

      - name: Verify shader deployment and final MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @('waterfall_fft_bitreverse_cs.bin','waterfall_fft_stage_ab_cs.bin','waterfall_fft_stage_ba_cs.bin','waterfall_fft_magnitude_cs.bin','waterfall_row_cs.bin')) {
            $hit = Get-ChildItem 'Project Files\bin' -Recurse -Filter $f | Select-Object -First 1
            if (-not $hit) { throw "Shader not deployed: $f" }
          }
          $msi = Get-ChildItem "Project Files\bin\Installers\*.msi" -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi -or $msi.Length -lt 1MB) { throw 'Valid MSI was not produced' }
          $final = Join-Path $msi.DirectoryName 'SQ4KOU-THETIS-EU2AV-2.10.3.16-MANAGED-GPU-x64.msi'
          Copy-Item $msi.FullName $final -Force
          @("SOURCE_SHA=$env:SOURCE_SHA", "MSI_SHA256=$((Get-FileHash $final -Algorithm SHA256).Hash)", "MSI_BYTES=$((Get-Item $final).Length)") | Set-Content (Join-Path $msi.DirectoryName 'EU2AV-MANAGED-GPU-BUILD.txt')
          Get-Content (Join-Path $msi.DirectoryName 'EU2AV-MANAGED-GPU-BUILD.txt')

      - uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-EU2AV-2.10.3.16-MANAGED-GPU-MSI
          path: |
            Project Files/bin/Installers/SQ4KOU-THETIS-EU2AV-2.10.3.16-MANAGED-GPU-x64.msi
            Project Files/bin/Installers/EU2AV-MANAGED-GPU-BUILD.txt
          if-no-files-found: error
          compression-level: 0
