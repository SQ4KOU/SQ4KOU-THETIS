name: Materialize EU2AV Managed GPU Waterfall

on:
  workflow_dispatch:
  push:
    branches: [feature/eu2av-gpu-waterfall-sq4kou]
    paths: [.github/workflows/materialize-eu2av-managed-gpu.yml]

permissions:
  contents: write

jobs:
  recover-source:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eu2av-gpu-waterfall-sq4kou
          fetch-depth: 0

      - name: Recover untouched EU2AV 2.10.3.16 project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:RUNNER_TEMP 'Thetis-Extended-Final.7z'
          Invoke-WebRequest -Uri 'https://eu2av.net/download/file.php?id=2070' -OutFile $pkg -UseBasicParsing
          if ((Get-Item $pkg).Length -lt 10MB) { throw 'EU2AV package is unexpectedly small' }

          $unpack = Join-Path $env:RUNNER_TEMP 'eu2av'
          New-Item -ItemType Directory -Force -Path $unpack | Out-Null
          & 7z x $pkg "-o$unpack" -y | Out-Null
          $msi = Get-ChildItem $unpack -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'EU2AV MSI not found' }

          $installed = Join-Path $env:RUNNER_TEMP 'eu2av-installed'
          New-Item -ItemType Directory -Force -Path $installed | Out-Null
          $p = Start-Process msiexec.exe -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$installed`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI extraction failed: $($p.ExitCode)" }
          $exe = Get-ChildItem $installed -Recurse -Filter Thetis.exe | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Thetis.exe not found' }

          dotnet tool install --global ilspycmd --version 11.0.0.9375
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $rec = Join-Path $env:RUNNER_TEMP 'recovered-project'
          New-Item -ItemType Directory -Force -Path $rec | Out-Null
          ilspycmd --disable-updatecheck -p -o $rec $exe.FullName
          "REC=$rec" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "EUROOT=$installed" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Materialize exact managed GPU classes and shaders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = Join-Path $PWD 'Project Files\Source\Console'
          $src = Join-Path $env:REC 'Thetis'
          $classes = @(
            'GPUWaterfallPipeline.cs',
            'WaterfallGPURenderer.cs',
            'GPUWaterfallLogger.cs',
            'SharedWaterfallState.cs',
            'GPUWaterfallWindowType.cs',
            'GPUWaterfallMagnitudeMode.cs',
            'GPUWaterfallResamplingMode.cs'
          )
          foreach ($f in $classes) {
            $s = Join-Path $src $f
            if (-not (Test-Path $s)) { throw "Recovered source missing: $f" }
            Copy-Item $s (Join-Path $dst $f) -Force
          }

          $shaders = @(
            'waterfall_fft_bitreverse_cs.bin',
            'waterfall_fft_stage_ab_cs.bin',
            'waterfall_fft_stage_ba_cs.bin',
            'waterfall_fft_magnitude_cs.bin',
            'waterfall_row_cs.bin',
            'waterfall_postproc.bin',
            'waterfall_resolve_cs.bin'
          )
          foreach ($f in $shaders) {
            $s = Get-ChildItem $env:EUROOT -Recurse -Filter $f | Select-Object -First 1
            if (-not $s) { throw "Recovered shader missing: $f" }
            Copy-Item $s.FullName (Join-Path $dst $f) -Force
          }

      - name: Preserve exact recovered Display Setup and project references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:REC 'Thetis'
          $audit = Join-Path $PWD '.github\recovered\eu2av-2.10.3.16'
          New-Item -ItemType Directory -Force -Path $audit | Out-Null

          $display = Get-ChildItem $src -Recurse -Filter *.cs | Where-Object { $_.Name -ieq 'display.cs' } | Select-Object -First 1
          if (-not $display) {
            $display = Get-ChildItem $src -Recurse -Filter *.cs | Where-Object { (Get-Content $_.FullName -Raw) -match 'GPUWaterfallPipeline' } | Select-Object -First 1
          }
          if (-not $display) { throw 'Recovered Display source containing GPUWaterfallPipeline not found' }
          Copy-Item $display.FullName (Join-Path $audit 'Display.EU2AV.2.10.3.16.cs.txt') -Force

          $setup = Get-ChildItem $src -Recurse -Filter *.cs | Where-Object { $_.Name -ieq 'setup.cs' } | Select-Object -First 1
          if (-not $setup) {
            $setup = Get-ChildItem $src -Recurse -Filter *.cs | Where-Object { (Get-Content $_.FullName -Raw) -match 'GPUWaterfallPipelineEnabled' } | Select-Object -First 1
          }
          if ($setup) { Copy-Item $setup.FullName (Join-Path $audit 'Setup.EU2AV.2.10.3.16.cs.txt') -Force }

          $proj = Get-ChildItem $env:REC -Recurse -Filter Thetis.csproj | Select-Object -First 1
          if ($proj) { Copy-Item $proj.FullName (Join-Path $audit 'Thetis.EU2AV.2.10.3.16.csproj.txt') -Force }

          @(
            "Display=$($display.FullName)",
            "Setup=$($setup.FullName)",
            "Project=$($proj.FullName)",
            "RecoveredExeRoot=$env:EUROOT"
          ) | Set-Content (Join-Path $audit 'RECOVERY-MANIFEST.txt')

      - name: Verify recovery is managed D3D11 path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'Project Files\Source\Console'
          $pipeline = Get-Content (Join-Path $root 'GPUWaterfallPipeline.cs') -Raw
          $renderer = Get-Content (Join-Path $root 'WaterfallGPURenderer.cs') -Raw
          if ($pipeline -notmatch 'SharpDX|Direct3D11|ComputeShader') { throw 'Recovered pipeline does not expose expected managed GPU API' }
          if ($renderer -notmatch 'SharpDX|Direct3D11|RenderTarget') { throw 'Recovered renderer does not expose expected managed renderer API' }
          foreach ($f in @('waterfall_fft_bitreverse_cs.bin','waterfall_fft_stage_ab_cs.bin','waterfall_fft_stage_ba_cs.bin','waterfall_fft_magnitude_cs.bin','waterfall_row_cs.bin','waterfall_postproc.bin','waterfall_resolve_cs.bin')) {
            $p = Join-Path $root $f
            if (-not (Test-Path $p) -or (Get-Item $p).Length -lt 32) { throw "Invalid recovered shader: $f" }
          }
          $displayRef = Get-Content '.github\recovered\eu2av-2.10.3.16\Display.EU2AV.2.10.3.16.cs.txt' -Raw
          if ($displayRef -notmatch 'GPUWaterfallPipeline') { throw 'Recovered Display reference has no GPUWaterfallPipeline integration' }

      - name: Commit exact recovered source of truth
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Project Files/Source/Console/GPUWaterfallPipeline.cs' 'Project Files/Source/Console/WaterfallGPURenderer.cs' 'Project Files/Source/Console/GPUWaterfallLogger.cs' 'Project Files/Source/Console/SharedWaterfallState.cs' 'Project Files/Source/Console/GPUWaterfallWindowType.cs' 'Project Files/Source/Console/GPUWaterfallMagnitudeMode.cs' 'Project Files/Source/Console/GPUWaterfallResamplingMode.cs' 'Project Files/Source/Console/waterfall_fft_bitreverse_cs.bin' 'Project Files/Source/Console/waterfall_fft_stage_ab_cs.bin' 'Project Files/Source/Console/waterfall_fft_stage_ba_cs.bin' 'Project Files/Source/Console/waterfall_fft_magnitude_cs.bin' 'Project Files/Source/Console/waterfall_row_cs.bin' 'Project Files/Source/Console/waterfall_postproc.bin' 'Project Files/Source/Console/waterfall_resolve_cs.bin' '.github/recovered/eu2av-2.10.3.16'
          if (git diff --cached --quiet) { throw 'Recovery produced no changes to commit' }
          git commit -m 'Materialize exact EU2AV 2.10.3.16 managed GPU source of truth'
          git push origin HEAD:feature/eu2av-gpu-waterfall-sq4kou
          git rev-parse HEAD
