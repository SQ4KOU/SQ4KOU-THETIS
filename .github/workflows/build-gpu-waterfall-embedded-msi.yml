name: Build GPU Waterfall Embedded Shader MSI

on:
  push:
    branches: [fix/gpu-waterfall-fallback-runtime]
    paths:
      - '.github/scripts/fix-gpu-shader-embedded-resources.ps1'
      - '.github/workflows/build-gpu-waterfall-embedded-msi.yml'
      - 'Project Files/Source/Console/GPUWaterfallPipeline.cs'
      - 'Project Files/Source/Console/WaterfallGPURenderer.cs'
      - 'Project Files/Source/Console/Display.GPUWaterfall.cs'
      - 'Project Files/Source/Console/display.cs'
      - 'Project Files/Source/Console/Thetis.csproj'
      - 'Project Files/Source/Console/waterfall_*.bin'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout GPU waterfall continuation branch
        uses: actions/checkout@v4
        with:
          ref: fix/gpu-waterfall-fallback-runtime
          fetch-depth: 1

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Apply recovered 2.10.3.16 archive-parity GPU model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The synthesized source currently keeps the four palette writes on one
          # line. Normalize that exact current form before the parity script; the
          # script then verifies the recovered 0..1 GPU contract.
          $gpu = 'Project Files\Source\Console\Display.GPUWaterfall.cs'
          $text = [System.IO.File]::ReadAllText($gpu)
          $old = '_gpuPaletteUpload[n] = r; _gpuPaletteUpload[n + 1] = g; _gpuPaletteUpload[n + 2] = b; _gpuPaletteUpload[n + 3] = 1f;'
          $new = '_gpuPaletteUpload[n] = r / 255f; _gpuPaletteUpload[n + 1] = g / 255f; _gpuPaletteUpload[n + 2] = b / 255f; _gpuPaletteUpload[n + 3] = 1f;'
          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            [System.IO.File]::WriteAllText($gpu, $text, [System.Text.UTF8Encoding]::new($false))
          }

          .\.github\scripts\fix-gpu-shader-embedded-resources.ps1
          Write-Host '--- GPU archive-parity source diff used for this build ---'
          git diff -- 'Project Files/Source/Console/Thetis.csproj' 'Project Files/Source/Console/GPUWaterfallPipeline.cs' 'Project Files/Source/Console/WaterfallGPURenderer.cs' 'Project Files/Source/Console/Display.GPUWaterfall.cs' 'Project Files/Source/Console/display.cs'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) { choco install wixtoolset -y --no-progress }
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) { $targets = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\Wix.targets' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $targets) { throw 'WiX 3.x Wix.targets not found' }
          "WIX_TARGETS=$($targets.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore and build Release x64 MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore "Project Files\Source\Thetis_VS2026.sln" -NonInteractive
          msbuild "Project Files\Source\Thetis_VS2026.sln" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal

      - name: Validate seven embedded shaders in built Thetis.exe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'Thetis.waterfall_postproc.bin',
            'Thetis.waterfall_row_cs.bin',
            'Thetis.waterfall_fft_bitreverse_cs.bin',
            'Thetis.waterfall_fft_stage_ab_cs.bin',
            'Thetis.waterfall_fft_stage_ba_cs.bin',
            'Thetis.waterfall_fft_magnitude_cs.bin',
            'Thetis.waterfall_resolve_cs.bin'
          )
          $exe = Get-ChildItem 'Project Files\bin' -Recurse -Filter Thetis.exe -ErrorAction Stop | Where-Object { $_.FullName -match '\\x64\\Release\\' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Built x64 Release Thetis.exe not found' }
          $asm = [System.Reflection.Assembly]::ReflectionOnlyLoadFrom($exe.FullName)
          $resources = @($asm.GetManifestResourceNames())
          Write-Host "Built EXE: $($exe.FullName)"
          $resources | Where-Object { $_ -like 'Thetis.waterfall*' } | Sort-Object | ForEach-Object { Write-Host "  $_" }
          $missing = @($expected | Where-Object { $_ -notin $resources })
          if ($missing.Count -ne 0) { throw ('Built EXE missing embedded GPU shaders: ' + ($missing -join ', ')) }
          if (($expected | Where-Object { $_ -in $resources }).Count -ne 7) { throw 'Built EXE embedded shader count is not exactly seven' }
          "BUILT_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate MSI and extract administrative image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem 'Project Files\bin\Installers\*.msi' -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi -or $msi.Length -lt 1MB) { throw 'Valid MSI was not produced' }
          $extract = Join-Path $env:RUNNER_TEMP 'sq4kou-msi-extract'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $p = Start-Process msiexec.exe -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$extract`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI administrative extraction failed: $($p.ExitCode)" }
          "MSI_PATH=$($msi.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MSI_EXTRACT=$extract" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate seven embedded shaders in Thetis.exe extracted from MSI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'Thetis.waterfall_postproc.bin',
            'Thetis.waterfall_row_cs.bin',
            'Thetis.waterfall_fft_bitreverse_cs.bin',
            'Thetis.waterfall_fft_stage_ab_cs.bin',
            'Thetis.waterfall_fft_stage_ba_cs.bin',
            'Thetis.waterfall_fft_magnitude_cs.bin',
            'Thetis.waterfall_resolve_cs.bin'
          )
          $exe = Get-ChildItem $env:MSI_EXTRACT -Recurse -Filter Thetis.exe -ErrorAction Stop | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Thetis.exe not found in extracted MSI' }
          $asm = [System.Reflection.Assembly]::ReflectionOnlyLoadFrom($exe.FullName)
          $resources = @($asm.GetManifestResourceNames())
          Write-Host "MSI EXE: $($exe.FullName)"
          $resources | Where-Object { $_ -like 'Thetis.waterfall*' } | Sort-Object | ForEach-Object { Write-Host "  $_" }
          $missing = @($expected | Where-Object { $_ -notin $resources })
          if ($missing.Count -ne 0) { throw ('MSI EXE missing embedded GPU shaders: ' + ($missing -join ', ')) }
          if (($expected | Where-Object { $_ -in $resources }).Count -ne 7) { throw 'MSI EXE embedded shader count is not exactly seven' }

      - name: Package validated MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-Item $env:MSI_PATH
          $out = Join-Path $msi.DirectoryName 'SQ4KOU-THETIS-GPU-WATERFALL-ARCHIVE-PARITY-x64.msi'
          Copy-Item $msi.FullName $out -Force
          $hash = Get-FileHash $out -Algorithm SHA256
          $info = Join-Path $msi.DirectoryName 'SQ4KOU-THETIS-GPU-WATERFALL-ARCHIVE-PARITY-build.txt'
          @(
            "SOURCE_SHA=${{ github.sha }}",
            'EMBEDDED_SHADER_COUNT_BUILT_EXE=7',
            'EMBEDDED_SHADER_COUNT_MSI_EXE=7',
            'LOADER_POLICY=embedded-resource-first;loose-file-fallback',
            'GPU_PALETTE_UPLOAD=normalized-0..1',
            'COLOR_DEPTH_SWITCH=in-place-ResizeBuffers-first;full-rebuild-fallback',
            "MSI_SHA256=$($hash.Hash)"
          ) | Set-Content $info -Encoding utf8
          Write-Host "VALIDATED MSI: $out"
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload validated MSI only
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-GPU-WATERFALL-ARCHIVE-PARITY-MSI
          path: |
            Project Files/bin/Installers/SQ4KOU-THETIS-GPU-WATERFALL-ARCHIVE-PARITY-x64.msi
            Project Files/bin/Installers/SQ4KOU-THETIS-GPU-WATERFALL-ARCHIVE-PARITY-build.txt
          if-no-files-found: error
          compression-level: 0
