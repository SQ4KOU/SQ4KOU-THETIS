name: SQ4KOU CW source fix

on:
  push:
    branches: [sq4kou]

permissions:
  contents: write

jobs:
  patch-cw:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sq4kou
          fetch-depth: 0
      - name: Remove CW PTT regression
        shell: python
        run: |
          from pathlib import Path
          p = Path('Project Files/Source/Console/console.cs')
          data = p.read_bytes()
          old_crlf = b'_current_ptt_mode != PTTMode.CAT &&\r\n                    _current_ptt_mode != PTTMode.CW)'
          old_lf = b'_current_ptt_mode != PTTMode.CAT &&\n                    _current_ptt_mode != PTTMode.CW)'
          matches = data.count(old_crlf) + data.count(old_lf)
          if matches != 1:
              raise SystemExit(f'Expected exactly one CW PTT regression block, found {matches}')
          if old_crlf in data:
              data = data.replace(old_crlf, b'_current_ptt_mode != PTTMode.CAT)', 1)
          else:
              data = data.replace(old_lf, b'_current_ptt_mode != PTTMode.CAT)', 1)
          p.write_bytes(data)
      - name: Verify only intended source change
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- . ':!.github/workflows/sq4kou-cw-fix.yml' >/dev/null && exit 1 || true
          git diff -- 'Project Files/Source/Console/console.cs'
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'SQ4KOU CW Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add 'Project Files/Source/Console/console.cs'
          git commit -m 'Fix CW RF output in SQ4KOU branch'
          git push origin HEAD:sq4kou
