name: Build native Final palettes and Setup Display

on:
  push:
    branches: [feature/eu2av-gpu-waterfall-sq4kou]
    paths:
      - .github/workflows/build-gpu-waterfall-diversity-cmasio.yml
      - .github/scripts/fix-gpu-waterfall-palettes.py
      - .github/scripts/test-final-palettes.ps1
      - Project Files/Source/Console/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-final:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout exact GPU waterfall branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Verify native Final palettes and protected GPU source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python .github/scripts/fix-gpu-waterfall-palettes.py
          if($LASTEXITCODE -ne 0){throw 'Native Final palette source gate failed'}

      - name: Audit current SQ4KOU GPU source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $c='Project Files\Source\Console'
          $gpu=Get-Content "$c\Display.GPUWaterfall.cs" -Raw
          $setupGpu=Get-Content "$c\Setup.GPUWaterfall.cs" -Raw
          $display=Get-Content "$c\display.cs" -Raw
          $div=Get-Content "$c\DiversityForm.cs" -Raw
          $setup=Get-Content "$c\setup.cs" -Raw

          foreach($t in @(
            @($gpu,'GPUWaterfallPipeline','managed GPU FFT pipeline'),
            @($gpu,'WaterfallGPURenderer','managed GPU renderer'),
            @($gpu,'SQ4KOU_GPU_PALETTE_NORMALIZED','normalized GPU palette marker'),
            @($gpu,'_gpuPaletteUpload\[n\]\s*=\s*r\s*/\s*255f','normalized RGB LUT'),
            @($gpu,'ColorScheme\.Enhanced256','Native Enhanced256 GPU palette'),
            @($gpu,'ColorScheme\.Grayscale256','Native Grayscale256 GPU palette'),
            @($gpu,'B8G8R8A8_UNorm','8-bit GPU format'),
            @($gpu,'R16G16B16A16_Float','16-bit GPU format'),
            @($setup,'comboColorPalette\.Text == "Enhanced 256"','RX1 Enhanced 256 mapping'),
            @($setup,'comboColorPalette\.Text == "BlackWhite 256"','RX1 BlackWhite 256 mapping'),
            @($setup,'comboRX2ColorPalette\.Text == "Enhanced 256"','RX2 Enhanced 256 mapping'),
            @($setup,'comboRX2ColorPalette\.Text == "BlackWhite 256"','RX2 BlackWhite 256 mapping'),
            @($setup,'comboColorPalette_tx\.Text == "Enhanced 256"','TX Enhanced 256 mapping'),
            @($setup,'comboColorPalette_tx\.Text == "BlackWhite 256"','TX BlackWhite 256 mapping'),
            @($setupGpu,'_pendingGPUSelection','manual GPU startup retry state preserved'),
            @($setupGpu,'_gpuStatusTimer\.Interval = 250','fast DeviceContext retry preserved'),
            @($display,'SQ4KOU_DXGI_EACCESSDENIED_FALLBACK','DirectX startup fallback'),
            @($div,'SQ4KOU_DIVERSITY_COMPACT','Diversity compact mode'),
            @($setup,'SQ4KOU_CMASIO_ALWAYS_VISIBLE','cmASIO visibility')
          )){
            if($t[0] -notmatch $t[1]){throw "Missing required element: $($t[2])"}
          }

          foreach($f in @(
            'waterfall_fft_bitreverse_cs.bin',
            'waterfall_fft_stage_ab_cs.bin',
            'waterfall_fft_stage_ba_cs.bin',
            'waterfall_fft_magnitude_cs.bin',
            'waterfall_row_cs.bin',
            'waterfall_postproc.bin',
            'waterfall_resolve_cs.bin'
          )){
            $p=Join-Path $c $f
            if(-not (Test-Path $p) -or (Get-Item $p).Length -lt 32){throw "Missing/invalid GPU shader: $f"}
          }
          Write-Host 'SQ4KOU_GPU_PALETTE_SOURCE_AUDIT=PASS'
          Write-Host "SOURCE_SHA_BEFORE_PATCH_COMMIT=$((git rev-parse HEAD).Trim())"

      - name: Compare compiled palettes against recovered Final
        shell: pwsh
        run: .github/scripts/test-final-palettes.ps1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $targets){choco install wixtoolset -y --no-progress}
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $targets){$targets=Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\Wix.targets' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1}
          if(-not $targets){throw 'WiX 3.x Wix.targets not found'}
          "WIX_TARGETS=$($targets.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore packages
        shell: pwsh
        run: nuget restore 'Project Files\Source\Thetis_VS2026.sln' -NonInteractive

      - name: Build Release x64 and MSI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'sq4kou-gpu-waterfall-palette-fix-build.log'
          & msbuild 'Project Files\Source\Thetis_VS2026.sln' /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal 2>&1 | Tee-Object -FilePath $log
          if($LASTEXITCODE -ne 0){throw "MSBuild failed: $LASTEXITCODE"}
          $errors=Select-String -Path $log -Pattern ': error ' -ErrorAction SilentlyContinue
          if($errors){$errors | ForEach-Object {Write-Host $_.Line}; throw 'Build log contains compiler/build errors'}
          "BUILD_LOG=$log" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'SQ4KOU_GPU_PALETTE_BUILD=PASS'

      - name: Validate seven embedded shaders in built Thetis.exe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'Thetis.waterfall_postproc.bin',
            'Thetis.waterfall_row_cs.bin',
            'Thetis.waterfall_fft_bitreverse_cs.bin',
            'Thetis.waterfall_fft_stage_ab_cs.bin',
            'Thetis.waterfall_fft_stage_ba_cs.bin',
            'Thetis.waterfall_fft_magnitude_cs.bin',
            'Thetis.waterfall_resolve_cs.bin'
          )
          $exe = Get-ChildItem 'Project Files\bin' -Recurse -Filter Thetis.exe -ErrorAction Stop | Where-Object { $_.FullName -match '\\x64\\Release\\' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Built x64 Release Thetis.exe not found' }
          $asm = [System.Reflection.Assembly]::ReflectionOnlyLoadFrom($exe.FullName)
          $resources = @($asm.GetManifestResourceNames())
          Write-Host "Built EXE: $($exe.FullName)"
          $resources | Where-Object { $_ -like 'Thetis.waterfall*' } | Sort-Object | ForEach-Object { Write-Host "  $_" }
          $missing = @($expected | Where-Object { $_ -notin $resources })
          if ($missing.Count -ne 0) { throw ('Built EXE missing embedded GPU shaders: ' + ($missing -join ', ')) }
          if (($expected | Where-Object { $_ -in $resources }).Count -ne 7) { throw 'Built EXE embedded shader count is not exactly seven' }
          "BUILT_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate MSI and extract administrative image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem 'Project Files\bin\Installers\*.msi' -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi -or $msi.Length -lt 1MB) { throw 'Valid MSI was not produced' }
          $extract = Join-Path $env:RUNNER_TEMP 'sq4kou-msi-extract'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $p = Start-Process msiexec.exe -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$extract`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI administrative extraction failed: $($p.ExitCode)" }
          "MSI_PATH=$($msi.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MSI_EXTRACT=$extract" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate seven embedded shaders in Thetis.exe extracted from MSI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'Thetis.waterfall_postproc.bin',
            'Thetis.waterfall_row_cs.bin',
            'Thetis.waterfall_fft_bitreverse_cs.bin',
            'Thetis.waterfall_fft_stage_ab_cs.bin',
            'Thetis.waterfall_fft_stage_ba_cs.bin',
            'Thetis.waterfall_fft_magnitude_cs.bin',
            'Thetis.waterfall_resolve_cs.bin'
          )
          $exe = Get-ChildItem $env:MSI_EXTRACT -Recurse -Filter Thetis.exe -ErrorAction Stop | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Thetis.exe not found in extracted MSI' }
          $asm = [System.Reflection.Assembly]::ReflectionOnlyLoadFrom($exe.FullName)
          $resources = @($asm.GetManifestResourceNames())
          Write-Host "MSI EXE: $($exe.FullName)"
          $resources | Where-Object { $_ -like 'Thetis.waterfall*' } | Sort-Object | ForEach-Object { Write-Host "  $_" }
          $missing = @($expected | Where-Object { $_ -notin $resources })
          if ($missing.Count -ne 0) { throw ('MSI EXE missing embedded GPU shaders: ' + ($missing -join ', ')) }
          if (($expected | Where-Object { $_ -in $resources }).Count -ne 7) { throw 'MSI EXE embedded shader count is not exactly seven' }

      - name: Preserve native Final palette and Setup MSI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $final=Join-Path $env:RUNNER_TEMP 'SQ4KOU-THETIS-NATIVE-FINAL-PALETTES-SETUP-TEST-x64.msi'
          Copy-Item $env:MSI_PATH $final -Force
          $hash=(Get-FileHash $final -Algorithm SHA256).Hash
          "FINAL_MSI_PATH=$final" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MSI_SHA256=$hash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SOURCE_SHA=${{ github.sha }}"
          Write-Host "MSI_BYTES=$((Get-Item $final).Length)"
          Write-Host "MSI_SHA256=$hash"

      - name: Upload test MSI
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-NATIVE-FINAL-PALETTES-SETUP-TEST-x64
          path: ${{ env.FINAL_MSI_PATH }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-NATIVE-FINAL-PALETTES-SETUP-BUILD-LOG
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: error
          compression-level: 6
