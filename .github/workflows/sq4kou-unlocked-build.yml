name: SQ4KOU unlocked source verification
on:
  push:
    branches: [import/3z9am-v6.0.7.25]
    paths: [.github/workflows/sq4kou-unlocked-build.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout modified branch
        uses: actions/checkout@v4
      - name: Check source invariants and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $code = Get-Content "Project Files/Source/Console/ActivationCode.cs" -Raw
          $activation = Get-Content "Project Files/Source/Console/Console.Activation.cs" -Raw
          $project = Get-Content "Project Files/Source/Console/Thetis.csproj" -Raw
          if ($project -match '<Compile Include="ActivationSecret.cs"') { throw "Missing secret still required" }
          if ($activation -notmatch 'private bool ensureActivated\(\)' -or $activation -notmatch 'return true;') { throw "POWER is not explicitly unlocked" }
          if ($activation -match 'ShowDialog|MachineGuid|Activation\.Code') { throw "Activation dialog/persistence remains" }
          if ($code -notmatch 'SectionDiversity \| ActivationFeature.SoftEdges') { throw "Full entitlement not enabled" }
          Write-Host "[PASS] SOURCE: POWER unlocked, all features selected, no secret dependency"
          foreach ($path in @("Project Files/Source/Console/ActivationCode.cs", "Project Files/Source/Console/Console.Activation.cs", "Project Files/Source/Console/Thetis.csproj")) {
            $f = Get-Item $path
            $sha = (Get-FileHash $path -Algorithm SHA256).Hash
            Write-Host "[SHA256] $path $sha"
          }
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        shell: pwsh
        run: |
          msbuild "Project Files/Source/Thetis_VS2026.sln" -t:Restore -p:Configuration=Release -p:Platform=x64 -m -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild Restore failed: $LASTEXITCODE" }
      - name: Build complete solution
        shell: pwsh
        run: |
          msbuild "Project Files/Source/Thetis_VS2026.sln" -p:Configuration=Release -p:Platform=x64 -m -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }
      - name: Inspect binary files and hash them
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "Project Files/bin/x64/Release" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -in @("Thetis.dll", "Thetis.exe", "wdsp.dll") })
          if (-not ($files | Where-Object { $_.Name -eq 'Thetis.dll' -or $_.Name -eq 'Thetis.exe' })) {
            throw "Thetis binary missing"
          }
          foreach ($f in $files) {
            Write-Host "[PASS] BINARY $($f.FullName) $($f.Length) bytes SHA256=$((Get-FileHash $f.FullName -Algorithm SHA256).Hash)"
          }
          Write-Host "[PASS] MSBuild solution and binary verification"
