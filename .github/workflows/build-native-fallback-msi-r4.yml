name: Build Native Fallback MSI R4

on:
  push:
    branches: [build/native-fallback-msi-r4-20260910]

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact corrected fallback commit
        uses: actions/checkout@v4
        with:
          ref: ba9e5ecf0fa4656d32a2e474d732b5835cc90788
          fetch-depth: 1
          filter: blob:none

      - name: Verify source invariants
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($sha -ne 'ba9e5ecf0fa4656d32a2e474d732b5835cc90788') { throw "Wrong source SHA: $sha" }
          $decl = @(Get-ChildItem "Project Files\Source\Console" -Recurse -Filter *.cs | Select-String -Pattern '\b(class|partial\s+class)\s+DiversityForm\b')
          $decl | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
          if ($decl.Count -ne 1) { throw "Expected exactly one DiversityForm declaration, got $($decl.Count)" }
          $gainProxy = @(Select-String -Path "Project Files\Source\Console\console.cs" -SimpleMatch 'CATDiversityGainMulti')
          if ($gainProxy.Count -ne 0) { throw "Native-incompatible CATDiversityGainMulti proxy remains" }

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) { choco install wixtoolset -y --no-progress }
          $targets = Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue
          if (-not $targets) {
            $targets = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\Wix.targets" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $targets) { throw "WiX 3.x Wix.targets not found" }
          "WIX_TARGETS=$($targets.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using WiX targets: $($targets.FullName)"

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore "Project Files\Source\Thetis_VS2026.sln" -NonInteractive

      - name: Build Release x64 and MSI
        shell: pwsh
        run: msbuild "Project Files\Source\Thetis_VS2026.sln" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal

      - name: Verify MSI
        shell: pwsh
        run: |
          $msis = @(Get-ChildItem "Project Files\bin\Installers\*.msi" -ErrorAction Stop | Sort-Object LastWriteTime -Descending)
          if ($msis.Count -lt 1) { throw "MSI was not produced" }
          $msi = $msis[0]
          if ($msi.Length -lt 1MB) { throw "MSI is unexpectedly small: $($msi.Length) bytes" }
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash
          Write-Host "MSI=$($msi.FullName)"
          Write-Host "SIZE=$($msi.Length)"
          Write-Host "SHA256=$hash"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-NATIVE-FALLBACK-MSI-R4
          path: Project Files/bin/Installers/*.msi
          if-no-files-found: error
          compression-level: 0
