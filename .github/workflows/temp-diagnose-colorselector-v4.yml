name: TEMP Diagnose generated ColorSelector V4

on:
  push:
    branches:
      - temp/redpitaya-rade-tx-waterfall-id-20260916
    paths:
      - '.github/workflows/temp-diagnose-colorselector-v4.yml'
      - 'tools/rade-redpitaya/fix-setup-nre.py'

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp/redpitaya-rade-tx-waterfall-id-20260916
          fetch-depth: 0
          submodules: recursive

      - name: Reproduce RADE build-time source transform
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tools/rade-redpitaya/integrate.py
          if($LASTEXITCODE -ne 0){throw 'integrate.py failed'}
          python tools/rade-redpitaya/integrate-ui.py
          if($LASTEXITCODE -ne 0){throw 'integrate-ui.py failed'}
          python tools/rade-redpitaya/fix-setup-nre.py
          if($LASTEXITCODE -ne 0){throw 'fix-setup-nre.py failed'}
          python tools/rade-redpitaya/integrate-deps.py
          if($LASTEXITCODE -ne 0){throw 'integrate-deps.py failed'}

      - name: Locate every ColorSelector source and project reference
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $needles=@('ConfigureAsPlayerCallsignEditor','DisablePlayerCallSignInput','PlayerCallSignText','CurrentPlayerColor','txtCallSign_TextChanged')
          $files=Get-ChildItem . -Recurse -File -Filter '*.cs' | Where-Object {
            $p=$_.FullName
            $p -notmatch '\\.git\\' -and $p -notmatch '\\packages\\' -and $p -notmatch '\\obj\\' -and $p -notmatch '\\bin\\'
          }
          $hits=@()
          foreach($f in $files){
            $text=Get-Content $f.FullName -Raw -ErrorAction SilentlyContinue
            if($null -eq $text){continue}
            foreach($n in $needles){
              if($text -match [regex]::Escape($n)){
                $hits += $f.FullName
                Write-Host "HIT $n :: $($f.FullName)"
              }
            }
          }
          $hits=$hits | Sort-Object -Unique
          Write-Host "UNIQUE_SOURCE_FILES=$($hits.Count)"
          foreach($h in $hits){
            Write-Host "===== $h ====="
            $text=Get-Content $h -Raw
            foreach($n in $needles){Write-Host "COUNT $n=$(([regex]::Matches($text,[regex]::Escape($n))).Count)"}
          }
          Write-Host '--- project references ---'
          Get-ChildItem . -Recurse -File -Include '*.csproj','*.targets','*.props' | Where-Object {$_.FullName -notmatch '\\.git\\'} | ForEach-Object {
            $m=Select-String -Path $_.FullName -Pattern 'colorselector|ColorSelector' -ErrorAction SilentlyContinue
            if($m){$m | ForEach-Object {Write-Host "$($_.Path):$($_.LineNumber):$($_.Line)"}}
          }
          if($hits.Count -eq 0){throw 'No source containing ColorSelector callsign members found anywhere'}
