name: SQ4KOU Band Switch Source Audit
on:
  push:
    branches: [import/3z9am-v6.0.7.25]
    paths: [.github/workflows/sq4kou-band-freeze-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify band event subscribers and synchronous waits
        shell: bash
        run: |
          set -euo pipefail
          echo '=== [A] Band pre-change event references ==='
          git grep -n -E 'BandPreChangeHandlers|BandNoChangeHandlers|SetBandChangeHanders' -- 'Project Files/Source' | head -120 || true
          echo '=== [B] Band event subscribers ==='
          git grep -n -E 'BandChangeHandlers[[:space:]]*\+=' -- 'Project Files/Source' | head -90 || true
          echo '=== [C] synchronous invokes near radio hardware integration ==='
          git grep -n -E 'Invoke\(|WaitOne\(|\.Result\b|\.Wait\(|\.Join\(' -- 'Project Files/Source/Console/Console.NewGUI.cs' 'Project Files/Source/Console/TCIServer.cs' 'Project Files/Source/Console/clsBandStackManager.cs' | head -100 || true
          echo '=== [D] source identity ==='
          git rev-parse HEAD
