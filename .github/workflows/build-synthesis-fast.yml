name: Fast synthesis x64 build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-synthesis-fast.yml

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout synthesis snapshot only
        uses: actions/checkout@v4
        with:
          ref: synthesis-clean
          fetch-depth: 1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget restore "Project Files/Source/Thetis_VS2026.sln" -NonInteractive

      - name: Build x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          msbuild "Project Files/Source/Thetis_VS2026.sln" /m /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal /fl /flp:"logfile=build-logs/msbuild-x64-release.log;verbosity=normal" /bl:build-logs/msbuild-x64-release.binlog

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-x64-build-logs
          path: build-logs/
          if-no-files-found: warn

      - name: Upload x64 release output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-thetis-x64-release
          path: Project Files/bin/x64/Release/**
          if-no-files-found: error

      - name: Upload MSI installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-thetis-x64-installer
          path: Project Files/bin/Installers/Thetis.msi
          if-no-files-found: error
