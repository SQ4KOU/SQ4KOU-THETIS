name: Inspect Diversity and cmASIO

on:
  push:
    branches: [feature/eu2av-gpu-waterfall-sq4kou]
    paths:
      - .github/workflows/inspect-diversity-cmasio.yml
  workflow_dispatch:

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eu2av-gpu-waterfall-sq4kou
          fetch-depth: 0
      - name: Show exact implementation contexts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Show-Context([string]$path,[string]$needle,[int]$before,[int]$after){
            $lines=[System.IO.File]::ReadAllLines($path)
            $idx=-1
            for($i=0;$i -lt $lines.Length;$i++){if($lines[$i].Contains($needle)){$idx=$i;break}}
            if($idx -lt 0){throw "Needle not found: $needle in $path"}
            $s=[Math]::Max(0,$idx-$before); $e=[Math]::Min($lines.Length-1,$idx+$after)
            Write-Host "=== $path :: $needle :: line $($idx+1) ==="
            for($i=$s;$i -le $e;$i++){Write-Host ("{0,6}: {1}" -f ($i+1),$lines[$i])}
          }
          $d='Project Files\Source\Console\DiversityForm.cs'
          $s='Project Files\Source\Console\setup.cs'
          Show-Context $d 'private void picRadar_MouseDown' 12 55
          Show-Context $d 'private void picRadar_MouseUp' 8 35
          Show-Context $d 'private void DiversityForm_Closing' 8 18
          Show-Context $d 'this.ClientSize = new System.Drawing.Size(313, 598);' 12 24
          Show-Context $s 'public void SetupCMAsio' 8 55
