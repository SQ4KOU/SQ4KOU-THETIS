name: Inspect Diversity and cmASIO

on:
  push:
    branches: [feature/eu2av-gpu-waterfall-sq4kou]
    paths:
      - .github/workflows/inspect-diversity-cmasio.yml
  workflow_dispatch:

jobs:
  inspect:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eu2av-gpu-waterfall-sq4kou
          fetch-depth: 0
      - name: Locate Diversity and cmASIO implementation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='Project Files\Source\Console'
          Write-Host '=== FILE NAMES: diversity / cmASIO ==='
          Get-ChildItem $root -Recurse -File | Where-Object { $_.Name -match 'divers|cmasio|cmASIO' } | ForEach-Object { Write-Host $_.FullName }
          Write-Host '=== DIVERSITY TEXT MATCHES ==='
          Get-ChildItem $root -Recurse -Include *.cs -File | Select-String -Pattern 'Diversity|diversity|Phase|Gain' | Select-Object -First 250 | ForEach-Object { Write-Host ("{0}:{1}: {2}" -f $_.Path,$_.LineNumber,$_.Line.Trim()) }
          Write-Host '=== CMASIO TEXT MATCHES ==='
          Get-ChildItem $root -Recurse -Include *.cs -File | Select-String -Pattern 'cmASIO|CMASIO|cmAsio|cm_asio' | Select-Object -First 250 | ForEach-Object { Write-Host ("{0}:{1}: {2}" -f $_.Path,$_.LineNumber,$_.Line.Trim()) }
