name: Publish confirmed P1 CWX release

on:
  push:
    branches: [sq4kou]
    paths:
      - '.github/workflows/publish-p1-cwx-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: sq4kou-p1-cwx-2026-09-06
      TARGET_SHA: 53a59b216c61b0fc856cf5aa7ba117a02299c349
      SOURCE_RUN: 34021547574
      ARTIFACT_NAME: SQ4KOU_THETIS_P1_CWX_PTT_HOLD_MSI
      EXPECTED_MSI_SHA256: 4c220249a7b6fe95adbf36f712486a310e48ce88b121cf8feebe9c5f43531975

    steps:
      - name: Checkout sq4kou
        uses: actions/checkout@v4
        with:
          ref: sq4kou
          fetch-depth: 0

      - name: Download verified MSI artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release_asset | Out-Null
          gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name $env:ARTIFACT_NAME --dir release_asset
          $msi = Get-ChildItem release_asset -Recurse -Filter "SQ4KOU_THETIS_P1_CWX_PTT_HOLD_x64.msi" | Select-Object -First 1
          if (-not $msi) { throw "Verified MSI not found in artifact" }
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:EXPECTED_MSI_SHA256) { throw "MSI SHA256 mismatch: $hash" }
          "MSI_PATH=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified MSI: $($msi.FullName)"
          Write-Host "SHA256: $hash"

      - name: Create GitHub release
        shell: pwsh
        run: |
          @'
          ## SQ4KOU Thetis — Protocol 1 CWX

          Hardware-confirmed release for Red Pitaya / HPSDR Protocol 1.

          ### Confirmed working on real hardware
          - CWX generates RF correctly in Protocol 1.
          - CWX uses normal WDSP TX IQ instead of the Hermes 3-bit firmware-keyer packing that Red Pitaya does not use for RF generation.
          - PTT is held across inter-word gaps. Minimum hold is 8 dot periods, while a larger configured CWX Drop Delay is still respected.
          - Protocol 2 path is unchanged.
          - ARM and FPGA are unchanged.

          Source commit: `53a59b216c61b0fc856cf5aa7ba117a02299c349`

          MSI SHA-256: `4c220249a7b6fe95adbf36f712486a310e48ce88b121cf8feebe9c5f43531975`
          '@ | Set-Content -Encoding UTF8 release_notes.md

          gh release create $env:TAG $env:MSI_PATH `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:TARGET_SHA `
            --title "SQ4KOU Thetis — Protocol 1 CWX" `
            --notes-file release_notes.md `
            --latest

      - name: Remove one-shot publisher
        shell: pwsh
        run: |
          git config user.name "SQ4KOU Build Bot"
          git config user.email "actions@github.com"
          git rm -- ".github/workflows/publish-p1-cwx-release.yml"
          git commit -m "Remove one-shot P1 CWX release publisher"
          git push origin HEAD:sq4kou
