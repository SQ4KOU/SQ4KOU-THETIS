name: Build SQ4KOU RedPitaya Safe 3D GPU

on:
  push:
    branches:
      - feature/redpitaya-3d-gpu-safe-cae084
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-msi:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Enable long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Gate protected SQ4KOU RedPitaya paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='cae084286310bfd35ebc9ece8b8fbf2ec6094505'
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor $base HEAD
          if($LASTEXITCODE -ne 0){ throw "Feature branch is not based on $base" }

          $vendor='Project Files\lib\Thetis-RADE-vendor'
          $vsha=(git -C $vendor rev-parse HEAD).Trim()
          if($vsha -ne '408f2b5232ff0a2aec9b538a40d4cb1b02627b17'){throw "Wrong RADE vendor: $vsha"}

          $protected=@(
            'Project Files/Source/Console/Display.GPUWaterfall.cs',
            'Project Files/Source/Console/GPUWaterfallPipeline.cs',
            'Project Files/Source/Console/WaterfallGPURenderer.cs',
            'Project Files/Source/Console/NetworkIO.cs',
            'Project Files/Source/Console/PSForm.cs',
            'Project Files/Source/Console/TCIServer.cs',
            'Project Files/Source/Console/database.cs',
            'Project Files/Source/Console/RadeIntegration.cs',
            'Project Files/Source/ChannelMaster/radae.c',
            'Project Files/Source/ChannelMaster/radae.h',
            'Project Files/Source/ChannelMaster/radae_micdsp.c'
          )
          foreach($p in $protected){
            git diff --exit-code $base HEAD -- $p
            if($LASTEXITCODE -ne 0){throw "Protected path changed: $p"}
          }

          foreach($p in @(
            'Project Files/Source/Console/Display.ThreeDPanadapter.cs',
            'Project Files/Source/Console/Console.ThreeDPanadapter.cs',
            'Project Files/Source/Console/frm3DPanadapter.cs'
          )){
            if(-not (Test-Path $p)){throw "Missing 3D source: $p"}
          }

          $display=Get-Content 'Project Files\Source\Console\display.cs' -Raw
          foreach($t in @(
            'Capture3DHistoryFrame(data, nDecimatedWidth, local_mox)',
            'DrawPanadapter3DHistoryDX2D',
            'live3DMapping'
          )){
            if($display -notmatch [regex]::Escape($t)){throw "Missing 3D display hook: $t"}
          }
          if($display -match 'DrawPanadapterDX2D\([^\r\n]*,\s*2,\s*[^\r\n]*_pan3DEnabled'){
            throw 'RX2 was unexpectedly wired to experimental 3D mode'
          }

          $threeD=Get-Content 'Project Files\Source\Console\Display.ThreeDPanadapter.cs' -Raw
          if($threeD -match '(?m)^\\s*using\\s+Vortice' -or $threeD -match 'Vortice\\.'){throw 'Vortice dependency leaked into SharpDX build'}
          $threeDCode=(Get-Content 'Project Files\\Source\\Console\\Display.ThreeDPanadapter.cs' | Where-Object { $_ -notmatch '^\\s*//' }) -join "`n"
          if($threeDCode -match '\\bGPUWaterfallPipeline\\b|\\bWaterfallGPURenderer\\b'){throw '3D renderer coupled to protected GPU waterfall pipeline'}

          Write-Host "BASE=$base"
          Write-Host "RADE_VENDOR=$vsha"
          Write-Host 'SAFE_3D_GPU_SOURCE_GATE=PASS'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify CMake
        shell: pwsh
        run: cmake --version

      - name: Build pinned RADE native dependencies
        shell: pwsh
        run: tools/rade-redpitaya/build-rade-deps.ps1 -Configuration Release

      - name: Ensure WiX Toolset 3.x
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $targets){choco install wixtoolset -y --no-progress}
          $targets=Get-ChildItem "${env:ProgramFiles(x86)}\MSBuild\Microsoft\WiX\v3.x\Wix.targets" -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $targets){$targets=Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\Wix.targets' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1}
          if(-not $targets){throw 'WiX 3.x Wix.targets not found'}
          "WIX_TARGETS=$($targets.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Thetis packages
        shell: pwsh
        run: nuget restore 'Project Files\Source\Thetis_VS2026.sln' -NonInteractive

      - name: Build Thetis RedPitaya safe 3D Release x64
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'sq4kou-redpitaya-3d-gpu-build.log'
          "BUILD_LOG=$log" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & msbuild 'Project Files\Source\Thetis_VS2026.sln' /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v145 /p:WixTargetsPath="$env:WIX_TARGETS" /v:minimal 2>&1 | Tee-Object -FilePath $log
          if($LASTEXITCODE -ne 0){throw "MSBuild failed: $LASTEXITCODE"}
          $errors=Select-String -Path $log -Pattern ': error ' -ErrorAction SilentlyContinue
          if($errors){$errors | ForEach-Object {Write-Host $_.Line}; throw 'Build log contains compiler/build errors'}
          Write-Host 'THETIS_REDPITAYA_3D_GPU_BUILD=PASS'

      - name: Validate ChannelMaster RADE exports
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dll=Get-ChildItem 'Project Files\bin' -Recurse -Filter ChannelMaster.dll | Where-Object {$_.FullName -match '\\x64\\Release\\'} | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $dll){throw 'ChannelMaster.dll x64 Release not found'}
          $dumpbin=Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if(-not $dumpbin){
            $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vspath=& $vswhere -latest -products * -property installationPath
            $dumpbin=Get-ChildItem (Join-Path $vspath 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe | Where-Object {$_.FullName -match '\\Hostx64\\x64\\'} | Sort-Object FullName -Descending | Select-Object -First 1
          }
          if(-not $dumpbin){throw 'dumpbin.exe not found'}
          $exports=& $dumpbin.FullName /exports $dll.FullName | Out-String
          foreach($name in @('SetRadaeRxEnabled','SetRadaeProtocolV2','SetRadaeTxRx','GetRadaeSync','SetRadaeMoxState','RadaeNotifyBeginOver','RadaeNotifyEndOfOver','GetRadaeEooFlushed','SetRadaeTxSilenceHold')){
            if($exports -notmatch [regex]::Escape($name)){throw "Missing ChannelMaster export: $name"}
          }
          Write-Host 'RADE_EXPORTS=PASS'

      - name: Locate MSI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $msi=Get-ChildItem 'Project Files\bin\Installers\*.msi' -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $msi -or $msi.Length -lt 1MB){throw 'Valid MSI was not produced'}
          $final=Join-Path $env:RUNNER_TEMP 'SQ4KOU-THETIS-REDPITAYA-RADE-WATERFALL-ID-3D-GPU-TEST-x64.msi'
          Copy-Item $msi.FullName $final -Force
          $sha=(Get-FileHash $final -Algorithm SHA256).Hash
          $head=(git rev-parse HEAD).Trim()
          $info=Join-Path $env:RUNNER_TEMP 'SQ4KOU-THETIS-REDPITAYA-RADE-WATERFALL-ID-3D-GPU-TEST.txt'
          @(
            'BASE=cae084286310bfd35ebc9ece8b8fbf2ec6094505',
            "COMMIT=$head",
            'RADE_VENDOR=408f2b5232ff0a2aec9b538a40d4cb1b02627b17',
            '3D=RX1_SAFE_ISOLATED_SHARPDX',
            'GPU_WATERFALL=PROTECTED_UNCHANGED',
            "MSI_SHA256=$sha"
          ) | Set-Content $info -Encoding UTF8
          "FINAL_MSI=$final" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "FINAL_INFO=$info" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MSI_BYTES=$($msi.Length)"
          Write-Host "MSI_SHA256=$sha"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-REDPITAYA-RADE-WATERFALL-ID-3D-GPU-TEST-x64
          path: |
            ${{ env.FINAL_MSI }}
            ${{ env.FINAL_INFO }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload build log
        if: ${{ always() && env.BUILD_LOG != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: SQ4KOU-THETIS-REDPITAYA-3D-GPU-BUILD-LOG
          path: ${{ env.BUILD_LOG }}
          if-no-files-found: error
          compression-level: 6
